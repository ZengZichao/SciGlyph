  <title id="t-gliding_motility">滑行运动 / Gliding Motility</title>
  <desc id="d-gliding_motility">Flagella-independent surface motility; mechanisms are lineage-specific: focal-adhesion A-motility (Agl/Glt, Myxococcus) or Gld/SprB adhesins (Flavobacterium). 关键词: gliding, A-motility, Agl, Glt, SprB</desc>
  
  <g id="layer-body-gliding_motility" data-name="body">
    <ellipse cx="50" cy="45" rx="18.0" ry="7.0" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="10" y1="58" x2="90" y2="58" stroke="#8C6D3F" stroke-width="2" data-pp="host" stroke-linecap="round"/>
    <path d="M25,65 L35,65" fill="none" stroke="#00857A" stroke-width="1.5" data-pp="metabolism" stroke-linecap="round"/>
    <path d="M33,63 L35,65 L33,67" fill="none" stroke="#00857A" stroke-width="1" data-pp="metabolism" stroke-linecap="round"/>
    <path d="M45,65 L55,65" fill="none" stroke="#00857A" stroke-width="1.5" data-pp="metabolism" stroke-linecap="round"/>
    <path d="M53,63 L55,65 L53,67" fill="none" stroke="#00857A" stroke-width="1" data-pp="metabolism" stroke-linecap="round"/>
    <path d="M65,65 L75,65" fill="none" stroke="#00857A" stroke-width="1.5" data-pp="metabolism" stroke-linecap="round"/>
    <path d="M73,63 L75,65 L73,67" fill="none" stroke="#00857A" stroke-width="1" data-pp="metabolism" stroke-linecap="round"/>
    
  </g>
