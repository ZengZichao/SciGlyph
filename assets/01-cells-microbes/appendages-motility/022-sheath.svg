    <line x1="34" y1="60" x2="34" y2="78" stroke="#93A0AC" stroke-width="1" data-pp="muted" stroke-linecap="round"/>
    <text x="22" y="85" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2E86AB" data-pp="bacteria">cell chain</text>
  </g>
</svg>