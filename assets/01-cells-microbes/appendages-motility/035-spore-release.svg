  <title id="t-spore_release">芽孢释放 / Spore Release</title>
  <desc id="d-spore_release">Mature endospore released from lysed sporangium. 关键词: endospore, sporangium, release, Bacillus, Clostridium</desc>
  <g id="layer-body" data-name="body">
