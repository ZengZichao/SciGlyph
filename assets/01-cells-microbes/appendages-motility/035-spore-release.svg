    <path d="M48,44 Q52,50 48,56" fill="none" stroke="#C42D2D" stroke-width="1.5" data-pp="alert" stroke-linecap="round"/>
    <circle cx="68" cy="50" r="10" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="2"/>
    <circle cx="68" cy="50" r="6" fill="#FFFFFF" data-pp="white" stroke="#1B2733" stroke-width="0.8"/>
    <circle cx="68" cy="50" r="3" fill="#8C6D3F" data-pp="host" stroke="#1B2733" stroke-width="0.5"/>
    <circle cx="55" cy="42" r="2" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.3"/>
    <circle cx="58" cy="58" r="1.5" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.3"/>

