    <line x1="58.0" y1="47.9" x2="47.42" y2="47.9" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="47.42" y="50.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#E8871E" data-pp="mge">N-term helix</text>
  </g>
