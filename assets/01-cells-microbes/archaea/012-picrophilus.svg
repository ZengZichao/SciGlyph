  <title id="t-picrophilus">嗜酸菌 / Picrophilus</title>
  <desc id="d-picrophilus">Small irregular coccus, non-motile (no flagella observed); extreme acidophile, growth ~pH 0 (opt ~0.7) at 60°C. Class Thermoplasmata (GTDB phylum Thermoplasmatota; 旧称 Euryarchaeota). 关键词: Picrophilus, pH 0, extreme acidophile, Thermoplasmata</desc>
