  <title id="t-cenarchaeum">海洋奇古菌 / Cenarchaeum</title>
  <desc id="d-cenarchaeum">Marine ammonia-oxidizing archaeon, coccoid; sponge (Axinella) symbiont. Genome lacks flagellar/motility genes. Phylum Nitrososphaerota（旧称 Thaumarchaeota）. 关键词: Cenarchaeum, marine, ammonia oxidation, symbiont, Nitrososphaerota</desc>
