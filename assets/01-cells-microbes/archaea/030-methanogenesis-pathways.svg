  <title id="t-methanogenesis_pathways">产甲烷途径 / Methanogenesis Pathways</title>
  <desc id="d-methanogenesis_pathways">Three methanogenesis pathways converging to methane: hydrogenotrophic, methylotrophic, acetoclastic. 关键词: methanogenesis, hydrogenotrophic, methylotrophic, acetoclastic, CH4</desc>
  <g id="layer-body" data-name="body">
    <rect x="5" y="12" width="20" height="10" rx="2" fill="#8C6D3F" data-pp="host" stroke="#1B2733" stroke-width="0.8"/>
    <text x="7" y="20" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">H2+CO2</text>
    <line x1="25" y1="17" x2="40" y2="17" stroke="#00857A" stroke-width="1.5" data-pp="metabolism" stroke-linecap="round"/>
    <path d="M38,14 L43,17 L38,20" fill="none" stroke="#00857A" stroke-width="1.5" data-pp="metabolism" stroke-linecap="round"/>
    <rect x="5" y="42" width="20" height="10" rx="2" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.8"/>
    <text x="8" y="50" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">MeOH</text>
    <line x1="25" y1="47" x2="40" y2="47" stroke="#00857A" stroke-width="1.5" data-pp="metabolism" stroke-linecap="round"/>
    <path d="M38,44 L43,47 L38,50" fill="none" stroke="#00857A" stroke-width="1.5" data-pp="metabolism" stroke-linecap="round"/>
    <rect x="5" y="72" width="20" height="10" rx="2" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.8"/>
    <text x="7" y="80" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">acetate</text>
    <line x1="25" y1="77" x2="40" y2="77" stroke="#00857A" stroke-width="1.5" data-pp="metabolism" stroke-linecap="round"/>
    <path d="M38,74 L43,77 L38,80" fill="none" stroke="#00857A" stroke-width="1.5" data-pp="metabolism" stroke-linecap="round"/>
    <line x1="43" y1="17" x2="60" y2="47" stroke="#00857A" stroke-width="1" data-pp="metabolism" stroke-dasharray="2,1"/>
    <line x1="43" y1="47" x2="60" y2="47" stroke="#00857A" stroke-width="1" data-pp="metabolism"/>
    <line x1="43" y1="77" x2="60" y2="47" stroke="#00857A" stroke-width="1" data-pp="metabolism" stroke-dasharray="2,1"/>
    <circle cx="75" cy="47" r="14" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1.5"/>
    <text x="67" y="51" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">CH4</text>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#A2305B" data-pp="archaea">methanogenesis</text>
  </g>
