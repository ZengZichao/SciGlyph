<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-archaea" role="img" aria-labelledby="t-histone_dna d-histone_dna" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-histone_dna">组蛋白DNA核小体 / Histone-DNA Nucleosome-like</title>
  <desc id="d-histone_dna">Archaeal histone-DNA complex forming nucleosome-like particle with DNA wrapping ~1 turn (~60 bp) around a histone tetramer (archaeasome; cf. eukaryal nucleosome 1.65 turns/147 bp). 关键词: histone, nucleosome, DNA wrapping, archaeasome, tetramer</desc>
  <g id="layer-body" data-name="body">
    <!-- Histone core (tetramer, archaeasome) -->
    <ellipse cx="50" cy="50" rx="12" ry="10" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Histone subunits visible -->
    <circle cx="44" cy="46" r="4" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" fill-opacity="0.7"/>
    <circle cx="56" cy="46" r="4" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" fill-opacity="0.7"/>
    <circle cx="44" cy="54" r="4" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" fill-opacity="0.7"/>
    <circle cx="56" cy="54" r="4" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" fill-opacity="0.7"/>
    <!-- DNA wrapping ~1 turn around the tetramer -->
    <path d="M30,42 Q35,35 42,38 Q48,40 50,35 Q52,30 58,38 Q64,46 68,50 Q64,54 58,62 Q52,70 50,65 Q48,60 42,62 Q35,65 30,58 Q26,52 30,42" fill="none" stroke="#E8871E" stroke-width="2.5" data-pp="mge" stroke-linecap="round"/>
    <!-- DNA entry/exit tails -->
    <path d="M30,42 Q25,38 20,35" fill="none" stroke="#E8871E" stroke-width="2" data-pp="mge" stroke-linecap="round"/>
    <path d="M30,58 Q25,62 20,65" fill="none" stroke="#E8871E" stroke-width="2" data-pp="mge" stroke-linecap="round"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="20" y="85" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">histone</text>
    <text x="55" y="85" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#E8871E" data-pp="mge">DNA wrap</text>
  </g>
</svg>