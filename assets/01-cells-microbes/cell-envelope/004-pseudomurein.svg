  <title id="t-pseudomurein">假肽聚糖 / Pseudomurein</title>
  <desc id="d-pseudomurein">古菌假肽聚糖：N-乙酰葡糖胺(GlcNAc)+N-乙酰塔洛糖胺糖醛酸(TalNAcA)，β-1,3 连接。关键词: pseudomurein, GlcNAc, talNAcA, talosaminuronic acid</desc>
  
  <g id="layer-body-1" data-name="body">
    <rect x="10" y="35" width="15" height="12" rx="2" fill="#A2305B" stroke="#1B2733" stroke-width="1" data-pp="archaea" /><rect x="28" y="35" width="15" height="12" rx="2" fill="#A2305B" fill-opacity="0.45" stroke="#1B2733" stroke-width="1" data-pp="archaea" /><rect x="46" y="35" width="15" height="12" rx="2" fill="#A2305B" stroke="#1B2733" stroke-width="1" data-pp="archaea" /><rect x="64" y="35" width="15" height="12" rx="2" fill="#A2305B" fill-opacity="0.45" stroke="#1B2733" stroke-width="1" data-pp="archaea" /><line x1="25" y1="41" x2="28" y2="41" stroke="#1B2733" stroke-width="1.5" data-pp="ink" /><line x1="43" y1="41" x2="46" y2="41" stroke="#1B2733" stroke-width="1.5" data-pp="ink" /><line x1="61" y1="41" x2="64" y2="41" stroke="#1B2733" stroke-width="1.5" data-pp="ink" />
  </g>
