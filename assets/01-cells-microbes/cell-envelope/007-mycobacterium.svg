  <title id="t-mycobacterium">分枝杆菌包被 / Mycobacterium envelope</title>
  <desc id="d-mycobacterium">分枝杆菌 mAGP 复合体：肽聚糖-阿拉伯半乳聚糖-分枝菌酸共价相连；分枝菌酸构成不对称霉菌酸膜内叶，外层另有游离脂质 TDM/LAM(抗酸)。关键词: Mycobacterium, mycolic acid, arabinogalactan, mAGP, acid-fast</desc>
  
