  <title id="t-pg_monomer">肽聚糖单体 / Peptidoglycan monomer</title>
  <desc id="d-pg_monomer">肽聚糖单体放大：NAG-NAM-五肽(L-Ala-D-Glu-mDAP/L-Lys-D-Ala-D-Ala)-交联桥；转肽交联后丢失末端D-Ala成为四肽。关键词: peptidoglycan, NAG, NAM, pentapeptide, crossbridge</desc>
  
  <g id="layer-body-1" data-name="body">
    <rect x="10" y="30" width="20" height="15" rx="3" fill="#2E86AB" stroke="#1B2733" stroke-width="1" data-pp="bacteria"/><rect x="33" y="30" width="20" height="15" rx="3" fill="#00857A" stroke="#1B2733" stroke-width="1" data-pp="metabolism"/><line x1="43" y1="45" x2="43" y2="55" stroke="#6C3FA0" stroke-width="2" data-pp="gene"/><line x1="43" y1="55" x2="43" y2="65" stroke="#6C3FA0" stroke-width="2" data-pp="gene"/><line x1="43" y1="65" x2="43" y2="75" stroke="#6C3FA0" stroke-width="2" data-pp="gene"/><line x1="43" y1="75" x2="43" y2="85" stroke="#6C3FA0" stroke-width="2" data-pp="gene"/><line x1="43" y1="85" x2="65" y2="85" stroke="#C42D2D" stroke-width="2" data-pp="alert"/>
  </g>
  <g id="layer-annotation-1" data-name="annotation">
    <text x="12" y="26" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2E86AB" data-pp="bacteria">NAG</text><text x="35" y="26" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism">NAM</text><line x1="50" y1="70" x2="65" y2="70" stroke="#93A0AC" stroke-width="1" data-pp="muted" stroke-linecap="round"/><text x="68" y="68" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">penta-</text><line x1="50" y1="85" x2="68" y2="92" stroke="#93A0AC" stroke-width="1" data-pp="muted" stroke-linecap="round"/><text x="72" y="97" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">bridge</text>
  </g>
