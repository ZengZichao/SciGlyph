<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-cell-envelope" role="img" aria-labelledby="t-gram_stain d-gram_stain" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-gram_stain">Gram stain</title>
  <desc id="d-gram_stain">Gram stain result: purple G+ cocci vs red G- rods</desc>
  
  <g id="layer-body" data-name="body">
    <circle cx="25" cy="40" r="6" fill="#6C3FA0" stroke="#1B2733" stroke-width="1.5" data-pp="gene"/>
    <circle cx="35" cy="45" r="6" fill="#6C3FA0" stroke="#1B2733" stroke-width="1.5" data-pp="gene"/>
    <circle cx="30" cy="52" r="6" fill="#6C3FA0" stroke="#1B2733" stroke-width="1.5" data-pp="gene"/>
    <rect x="60" y="38" width="12" height="5" rx="2.5" fill="#C42D2D" stroke="#1B2733" stroke-width="1" data-pp="alert" transform="rotate(15,66,41)"/>
    <rect x="65" y="50" width="12" height="5" rx="2.5" fill="#C42D2D" stroke="#1B2733" stroke-width="1" data-pp="alert" transform="rotate(-10,71,53)"/>
    <text x="30" y="65" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">G+</text>
    <text x="68" y="65" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">G−</text>
    <line x1="50" y1="25" x2="50" y2="70" stroke="#93A0AC" stroke-width="1" stroke-linecap="round" data-pp="muted" stroke-dasharray="3,3"/>
  </g>
  
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Gram stain</text>
  </g>
</svg>