<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-cell-envelope" role="img" aria-labelledby="t-acid_fast d-acid_fast" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-acid_fast">Acid-fast stain</title>
  <desc id="d-acid_fast">Acid-fast stain: red AF+ rods vs blue AF- rods</desc>
  
  <g id="layer-body" data-name="body">
    <rect x="20" y="38" width="14" height="5" rx="2.5" fill="#C42D2D" stroke="#1B2733" stroke-width="1" data-pp="alert" transform="rotate(10,27,41)"/>
    <rect x="25" y="50" width="14" height="5" rx="2.5" fill="#C42D2D" stroke="#1B2733" stroke-width="1" data-pp="alert" transform="rotate(-5,32,53)"/>
    <rect x="60" y="40" width="12" height="5" rx="2.5" fill="#2E86AB" stroke="#1B2733" stroke-width="1" data-pp="bacteria" transform="rotate(15,66,43)"/>
    <rect x="65" y="52" width="12" height="5" rx="2.5" fill="#2E86AB" stroke="#1B2733" stroke-width="1" data-pp="bacteria" transform="rotate(-10,71,55)"/>
    <text x="27" y="65" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">AF+</text>
    <text x="68" y="65" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2E86AB" data-pp="bacteria">AF−</text>
    <line x1="50" y1="25" x2="50" y2="70" stroke="#93A0AC" stroke-width="1" stroke-linecap="round" data-pp="muted" stroke-dasharray="3,3"/>
  <rect x="30" y="60" width="13" height="5" rx="2.5" fill="#C42D2D" stroke="#1B2733" stroke-width="1" data-pp="alert"/><rect x="58" y="30" width="12" height="5" rx="2.5" fill="#2E86AB" stroke="#1B2733" stroke-width="1" data-pp="bacteria"/></g>
  
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">acid-fast stain</text>
  </g>
</svg>