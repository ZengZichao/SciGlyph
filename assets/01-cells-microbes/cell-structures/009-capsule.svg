  <title id="t-09-capsule">荚膜 / Capsule</title>
  <desc id="d-09-capsule">荚膜为细胞壁外由多糖或蛋白构成的胶质层，可抗吞噬、抗干燥，也促进黏附与生物膜形成，是重要毒力因子。关键词: 荚膜, 胶质层, 抗吞噬, 抗黏附, 多糖</desc>
