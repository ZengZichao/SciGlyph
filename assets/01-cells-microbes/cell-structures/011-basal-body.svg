  <desc id="d-11-basal-body">革兰阴性菌鞭毛基体由 L/P 环（锚定于外膜与肽聚糖层）、MS 环（膜内转子环）、C 环（胞质转子环）与嵌于内膜的定子（MotA/MotB）构成，跨膜把质子动力转化为转矩。关键词: 鞭毛基体, L环, P环, MS环, C环, 马达, 定子, 跨膜</desc>
