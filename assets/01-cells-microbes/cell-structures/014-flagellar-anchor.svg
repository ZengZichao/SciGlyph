  <title id="t-14-flagellar-anchor">鞭毛锚定 / Flagellar anchoring</title>
  <desc id="d-14-flagellar-anchor">基体由外侧 L/P 环锚定在细胞包被上，轴杆自内向外穿过肽聚糖层与外膜，外侧接钩与鞭毛丝（革兰阳性菌无外膜亦无 L/P 环）。关键词: 锚定, 鞭毛基体, L环, P环, 肽聚糖, 外膜, 穿膜</desc>
