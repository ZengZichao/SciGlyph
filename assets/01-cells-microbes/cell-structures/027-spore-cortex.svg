  <title id="t-27-spore-cortex">芽孢皮层 / Spore cortex</title>
  <desc id="d-27-spore-cortex">芽孢皮层是由交联度低、取向随机的肽聚糖构成的厚层，皮层的溶胀压把核心维持在脱水状态，是芽孢耐热性的关键；萌发时皮层被专一水解酶降解、核心重新吸水而启动</desc>
