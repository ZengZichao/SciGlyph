  <title id="t-33-magnetosome">磁小体 / Magnetosome</title>
  <desc id="d-33-magnetosome">磁小体是磁细菌细胞内由细胞膜包裹、含铁磁性矿物（磁铁矿）的细胞器，单磁畴晶体串珠链状排列形成磁偶极子，可感知地磁方向并趋磁游动。关键词: 磁小体, 磁细菌, 磁铁矿, Fe3O4, 单磁畴, 趋磁, 细胞器</desc>
