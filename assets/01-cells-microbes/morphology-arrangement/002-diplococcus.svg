<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="双球菌" data-name-en="Diplococcus" data-cat="01-morphology" data-tags="双球菌,diplococcus,成对,平面分裂,链状起点,脑膜炎奈瑟菌,淋病奈瑟菌" role="img" aria-labelledby="t-02-diplococcus d-02-diplococcus" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-02-diplococcus">双球菌 / Diplococcus</title>
  <desc id="d-02-diplococcus">细胞沿单一平面分裂，两个子细胞保持成对排列，如脑膜炎奈瑟菌、淋病奈瑟菌等奈瑟菌属（肺炎链球菌为矛头状，常成对或短链排列）。关键词: 双球菌, diplococcus, 成对, 平面分裂, 链状起点, 脑膜炎奈瑟菌, 淋病奈瑟菌</desc>
  <g stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="45" cy="60" rx="21" ry="24" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="2"/>
    <ellipse cx="75" cy="60" rx="21" ry="24" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="2"/>
    <path d="M 60,40 L 60,80" fill="none" stroke="#1F6F8B" stroke-width="1.6"/>
    <ellipse cx="45" cy="60" rx="9" ry="11" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.4"/>
    <ellipse cx="75" cy="60" rx="9" ry="11" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.4"/>
    <circle cx="35" cy="47" r="3.2" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
