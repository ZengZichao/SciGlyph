  <title id="t-17-filamentous">丝状菌 / Filamentous</title>
  <desc id="d-17-filamentous">单个细胞延长为不分枝的管状丝状体，可见轻微横隔，如丝状蓝细菌或贝日阿托氏菌属（Beggiatoa）。关键词: 丝状菌, filamentous, 丝状体, 不分枝, 管状, 横隔</desc>
