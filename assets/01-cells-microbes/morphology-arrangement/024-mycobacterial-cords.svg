  <title id="t-24-mycobacterial-cords">抗酸菌索状成束 / Mycobacterial cords</title>
  <desc id="d-24-mycobacterial-cords">抗酸菌（结核分枝杆菌等）镜下典型形态：细长、微弯、不分枝的杆菌，常平行聚集成蛇形索状束（cord）排列；“分枝”仅在特定培养条件下偶见。关键词: 抗酸菌, 分枝杆菌, 索状束, cord formation, 微弯杆菌, 平行排列</desc>
