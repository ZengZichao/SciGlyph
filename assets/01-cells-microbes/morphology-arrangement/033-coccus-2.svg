    <line x1="50" y1="28" x2="50" y2="72" stroke="#93A0AC" stroke-width="1.5" data-pp="muted" stroke-dasharray="3,2"/>
  <path d="M40,52 Q50,42 60,52" fill="none" stroke="#6C3FA0" stroke-width="1.5" data-pp="gene" stroke-linecap="round"/><circle cx="43" cy="57" r="1.2" fill="#6C3FA0" data-pp="gene"/><circle cx="56" cy="55" r="1.2" fill="#6C3FA0" data-pp="gene"/></g>
