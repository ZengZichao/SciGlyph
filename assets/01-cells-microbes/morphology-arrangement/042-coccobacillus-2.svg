<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-morphology" role="img" aria-labelledby="t-coccobacillus d-coccobacillus" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-coccobacillus">球杆菌 / Coccobacillus</title>
  <desc id="d-coccobacillus">Short rod transitional form between coccus and bacillus with cell wall layers. 关键词: coccobacillus, short rod, transitional, cell wall</desc>
  <g id="layer-body" data-name="body">
    <rect x="30" y="40" width="40" height="20" rx="10" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5"/>
    <rect x="33" y="43" width="34" height="14" rx="7" fill="none" stroke="#1B2733" stroke-width="0.8" data-pp="ink" stroke-dasharray="2,1"/>
    <ellipse cx="50" cy="50" rx="8" ry="4" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" fill-opacity="0.5"/>
    <circle cx="38" cy="46" r="1.2" fill="#93A0AC" data-pp="muted"/>
    <circle cx="45" cy="54" r="1.2" fill="#93A0AC" data-pp="muted"/>
    <circle cx="55" cy="46" r="1.2" fill="#93A0AC" data-pp="muted"/>
    <circle cx="62" cy="54" r="1.2" fill="#93A0AC" data-pp="muted"/>

  </g>
  <g id="layer-annotation" data-name="annotation">

    <line x1="50" y1="40" x2="50" y2="22" stroke="#93A0AC" stroke-width="1" data-pp="muted" stroke-linecap="round"/>
    <text x="40" y="18" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">cell wall</text>

    <line x1="50" y1="50" x2="70" y2="65" stroke="#93A0AC" stroke-width="1" data-pp="muted" stroke-linecap="round"/>
    <text x="60" y="72" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">nucleoid</text>

  </g>
</svg>