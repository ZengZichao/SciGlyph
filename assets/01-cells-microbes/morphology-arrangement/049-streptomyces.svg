<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-morphology" role="img" aria-labelledby="t-actinomyces d-actinomyces" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-actinomyces">链霉菌型放线菌 / Actinomycetota (Streptomyces-type)</title>
  <desc id="d-actinomyces">链霉菌型放线菌：基内菌丝+气生菌丝+孢子丝(直/波曲/螺旋)，末端生成孢子链；狭义 Actinomyces 属不形成真正的气生菌丝与孢子链。关键词: Streptomyces, Actinomycetota, substrate mycelium, aerial hyphae, spore chain</desc>
  
