  <title id="t-chryseobacterium">金黄杆菌 / Chryseobacterium</title>
  <desc id="d-chryseobacterium">Short rod with yellow flexirubin pigment (Flavobacteriaceae); 部分种可滑行运动，不出芽、无柄。关键词: Chryseobacterium, flexirubin, yellow pigment, Flavobacteriaceae</desc>
  <g id="layer-body" data-name="body">
