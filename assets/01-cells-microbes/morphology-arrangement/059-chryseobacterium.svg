    <circle cx="33" cy="40" r="2" fill="#C42D2D" data-pp="alert" fill-opacity="0.5"/>
    <circle cx="50" cy="53" r="2" fill="#C42D2D" data-pp="alert" fill-opacity="0.5"/>
    <circle cx="67" cy="41" r="1.5" fill="#C42D2D" data-pp="alert" fill-opacity="0.5"/>
    <ellipse cx="50" cy="45" rx="9" ry="3.5" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" fill-opacity="0.4"/>

  </g>
  <g id="layer-annotation" data-name="annotation">

    <line x1="50" y1="72" x2="50" y2="60" stroke="#93A0AC" stroke-width="1" data-pp="muted" stroke-linecap="round"/>
    <text x="50" y="80" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#E8871E" data-pp="mge" text-anchor="middle">flexirubin</text>

