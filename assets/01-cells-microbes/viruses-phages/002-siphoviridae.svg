  <title id="t-siphoviridae">长尾噬菌体 / Long non-contractile-tail phage (siphovirus)</title>
  <desc id="d-siphoviridae">有尾病毒纲 Caudoviricetes 长尾形态群，长而柔韧的非收缩尾。旧称：Siphoviridae 长尾噬菌体科、Caudovirales 目名均已废止。关键词: siphovirus, lambda-like, flexible tail</desc>
