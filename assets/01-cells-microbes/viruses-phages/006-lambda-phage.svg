    <rect x="46" y="33" width="8" height="3" fill="#93A0AC" data-pp="muted" stroke="#1B2733" stroke-width="1" rx="1"/>
    <path d="M50,36 Q47,45 50,50 Q53,55 50,60 Q47,65 50,70 Q53,75 50,80" fill="none" stroke="#5B8C3E" data-pp="virus" stroke-width="3" stroke-linecap="round"/>
    <path d="M50,36 Q47,45 50,50 Q53,55 50,60 Q47,65 50,70 Q53,75 50,80" fill="none" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
