<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-virology" role="img" aria-labelledby="t-t7_phage d-t7_phage" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-t7_phage">T7噬菌体(短尾) / T7 phage (short tail)</title>
  <desc id="d-t7_phage">T7噬菌体，短尾形态群(podovirus)代表。短尾含尾纤维，烈性噬菌体。基因组~40kb线性dsDNA。旧称：Podoviridae 短尾噬菌体科（已废止并入 Caudoviricetes）。关键词: T7, podovirus, short tail, virulent</desc>
  <g id="layer-body-t7_phage" data-name="body">
    <!-- Head -->
    <polygon points="50,12 62,19 62,33 50,40 38,33 38,19" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Tail hub -->
    <rect x="46" y="40" width="8" height="6" fill="#93A0AC" data-pp="muted" stroke="#1B2733" stroke-width="1"/>
    <!-- Short tail fibers (6 small) -->
    <line x1="46" y1="46" x2="40" y2="56" stroke="#1B2733" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="48" y1="46" x2="44" y2="58" stroke="#1B2733" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="50" y1="46" x2="50" y2="59" stroke="#1B2733" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="52" y1="46" x2="56" y2="58" stroke="#1B2733" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="54" y1="46" x2="60" y2="56" stroke="#1B2733" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Ejector -->
    <line x1="50" y1="40" x2="50" y2="34" stroke="#6C3FA0" data-pp="gene" stroke-width="1" stroke-dasharray="1,1"/>
  </g>
  <g id="layer-annotation-t7_phage" data-name="annotation">
    <text x="66" y="20" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">T7</text>
  </g>
</svg>