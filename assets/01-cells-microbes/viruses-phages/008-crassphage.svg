<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-virology" role="img" aria-labelledby="t-crassphage d-crassphage" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-crassphage">crAss噬菌体(肠道) / crAssphage gut bacteriophage</title>
  <desc id="d-crassphage">crAssphage，人类肠道中最丰富的噬菌体（目 Crassvirales，属 Caudoviricetes）。小二十面体衣壳+顶部星形(stargate)门复合物；冷冻电镜研究显示其颗粒具短尾。2014年通过宏基因组组装发现。关键词: crAssphage, gut virome, Crassvirales, stargate</desc>
  <g id="layer-body-crassphage" data-name="body">
    <polygon points="50.0,29.0 63.9,37.0 63.9,53.0 50.0,61.0 36.1,53.0 36.1,37.0" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M43.0,39.0 Q50,42.0 57.0,39.0 Q50,48.0 43.0,51.0" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="1"/>
    <polygon points="50,25 46,20 50,15 54,20" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <polygon points="50,25 44,22 42,16 48,18" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.8"/>
    <polygon points="50,25 56,22 58,16 52,18" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.8"/>
    <line x1="50" y1="15" x2="50" y2="10" stroke="#E8871E" data-pp="mge" stroke-width="1.5"/>
    <line x1="42" y1="16" x2="38" y2="12" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
    <line x1="58" y1="16" x2="62" y2="12" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
    <circle cx="50" cy="9" r="2" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.5"/>
  </g>
