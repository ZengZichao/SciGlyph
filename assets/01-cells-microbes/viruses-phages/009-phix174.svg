  <title id="t-phix174">φX174(无尾二十面体) / phiX174 tailless icosahedral</title>
  <desc id="d-phix174">φX174噬菌体，Microviridae科。无尾二十面体衣壳，含环状单链DNA(+)基因组(~5.4kb)。首个被完整测序的DNA基因组(Sanger 1977)。T=1对称。关键词: phiX174, Microviridae, ssDNA, icosahedral</desc>
