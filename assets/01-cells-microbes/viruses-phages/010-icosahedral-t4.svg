  <title id="t-icosahedral_t4">二十面体T=4 / Icosahedral T=4 triangulation</title>
  <desc id="d-icosahedral_t4">T=4二十面体三角剖分示意(Caspar-Klug理论)。不对称单元数=60T=240；壳微粒=12个五聚体+10(T-1)=30个六聚体，共42个。球面投影网格为示意，不按比例(schematic, not to scale)。关键词: icosahedral, T=4, triangulation, capsid symmetry, Caspar-Klug</desc>
