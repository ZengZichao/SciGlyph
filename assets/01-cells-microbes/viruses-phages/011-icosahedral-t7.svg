  <title id="t-icosahedral_t7">二十面体T=7 / Icosahedral T=7 triangulation</title>
  <desc id="d-icosahedral_t7">T=7二十面体三角剖分示意(Caspar-Klug理论)。不对称单元数=60T=420；壳微粒=12个五聚体+10(T-1)=60个六聚体，共72个。常见于有尾噬菌体头部(如HK97、P22)；乳头瘤病毒为T=7d特例，72个壳微粒全为五聚体。球面投影网格为示意，不按比例。关键词: icosahedral, T=7, triangulation, phage head, capsomere</desc>
