<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-virology" role="img" aria-labelledby="t-procapsid_maturation d-procapsid_maturation" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-procapsid_maturation">前衣壳到成熟衣壳 / Procapsid to mature capsid DNA packaging</title>
  <desc id="d-procapsid_maturation">噬菌体装配：前衣壳(procapsid)为球形空壳，通过portal vertex包装DNA后发生构象变化(expansion)成为角状成熟衣壳。DNA在头内堆积密度约500 mg/mL。关键词: procapsid, DNA packaging, capsid expansion, portal</desc>
  <g id="layer-body-procapsid_maturation" data-name="body">
    <circle cx="20" cy="45" r="15" fill="#F4F1EA" data-pp="bg" stroke="#5B8C3E" stroke-width="2"/>
    <path d="M14,42 Q17,38 20,42 Q23,46 26,42" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.8"/>
    <path d="M37,45 L44,45" fill="none" stroke="#1B2733" data-pp="ink" stroke-width="1.5"/>
    <polygon points="44,42 50,45 44,48" fill="#1B2733" data-pp="ink"/>
    <circle cx="60" cy="45" r="14" fill="#5B8C3E" data-pp="virus" fill-opacity="0.3" stroke="#5B8C3E" stroke-width="1.5"/>
    <path d="M54,42 Q57,38 60,42 Q63,46 66,42" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="1"/>
    <polygon points="80,28 92,35 92,55 80,62 68,55 68,35" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M74,40 Q77,36 80,40 Q83,44 86,40" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="1"/>
    <path d="M74,48 Q77,44 80,48 Q83,52 86,48" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="1"/>
  </g>
  <g id="layer-annotation-procapsid_maturation" data-name="annotation">
    <text x="8" y="72" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">procapsid</text>
    <text x="68" y="72" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">mature</text>
    <text x="38" y="35" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene" text-anchor="start">DNA</text>
  </g>
</svg>
