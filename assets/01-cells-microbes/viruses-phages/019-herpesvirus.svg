<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-virology" role="img" aria-labelledby="t-herpesvirus d-herpesvirus" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-herpesvirus">疱疹病毒(被膜) / Herpesvirus tegument layered</title>
  <desc id="d-herpesvirus">疱疹病毒(Herpesviridae科)。四层结构：外脂质包膜(含糖蛋白刺突)→tegument被膜层(含病毒蛋白)→T=16二十面体衣壳→线性dsDNA。~150-200nm。关键词: herpesvirus, tegument, T=16, enveloped, dsDNA</desc>
  <g id="layer-body-herpesvirus" data-name="body">
    <!-- Outer envelope -->
    <circle cx="50" cy="50" r="32" fill="#F4F1EA" data-pp="bg" stroke="#8C6D3F" stroke-width="1.5"/>
    <!-- Tegument layer -->
    <circle cx="50" cy="50" r="26" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1" fill-opacity="0.3"/>
    <!-- Icosahedral capsid (T=16) -->
    <polygon points="50,30 64,38 64,54 50,62 36,54 36,38" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- DNA inside -->
    <path d="M42,42 Q46,38 50,42 Q54,46 58,42" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="1"/>
    <path d="M42,48 Q46,44 50,48 Q54,52 58,48" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="1"/>
    <!-- Spikes on envelope -->
    <line x1="22" y1="38" x2="16" y2="34" stroke="#8C6D3F" data-pp="host" stroke-width="1.5"/>
    <line x1="50" y1="18" x2="50" y2="12" stroke="#8C6D3F" data-pp="host" stroke-width="1.5"/>
    <line x1="78" y1="38" x2="84" y2="34" stroke="#8C6D3F" data-pp="host" stroke-width="1.5"/>
  </g>
  <g id="layer-annotation-herpesvirus" data-name="annotation">
    <text x="64.78" y="30.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">envelope</text>
    <text x="64.78" y="50.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">tegument</text>
    <text x="70" y="62" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">capsid</text>
  </g>
</svg>