  <title id="t-ebola">埃博拉(丝状) / Ebola filamentous enveloped virus</title>
  <desc id="d-ebola">埃博拉病毒(Filoviridae科)。丝状/卷曲形态，有脂质包膜含GP糖蛋白刺突。内部螺旋核衣壳含ssRNA(-)约19kb。可呈6形/环形。关键词: Ebola, filovirus, filamentous, enveloped, GP spike</desc>
