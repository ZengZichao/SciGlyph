<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-virology" role="img" aria-labelledby="t-dna_injection d-dna_injection" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-dna_injection">DNA注入(尾鞘收缩) / DNA injection tail sheath contraction</title>
  <desc id="d-dna_injection">噬菌体DNA注入：尾鞘收缩驱动尾管穿透细胞壁/膜，将dsDNA从头部通过tail tube注入胞质。空衣壳留在胞外(ghost)。关键词: DNA injection, sheath contraction, ghost, DNA translocation</desc>
  <g id="layer-body-dna_injection" data-name="body">
    <rect x="15" y="55" width="70" height="30" rx="15" ry="15" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5"/>
    <rect x="15" y="55" width="70" height="8" rx="4" fill="#8C6D3F" data-pp="host" fill-opacity="0.4" stroke="#1B2733" stroke-width="0.5"/>
    <polygon points="50,8 60,14 60,26 50,32 40,26 40,14" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1.5" stroke-linejoin="round" fill-opacity="0.4"/>
    <rect x="46" y="32" width="8" height="10" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <line x1="50" y1="42" x2="50" y2="70" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-dasharray="2,1"/>
    <path d="M50,32 Q48,40 50,48 Q52,55 50,62 Q48,68 50,75" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5"/>
    <polygon points="48,60 50,65 52,60" fill="#6C3FA0" data-pp="gene"/>
    <circle cx="50" cy="78" r="2" fill="#6C3FA0" data-pp="gene" fill-opacity="0.5"/>
    <path d="M46,78 Q44,82 46,85" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="0.8"/>
  </g>
  <g id="layer-annotation-dna_injection" data-name="annotation">
    <text x="60" y="38" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">ghost</text>
    <line x1="58.0" y1="67.9" x2="47.42" y2="67.9" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="47.42" y="70.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">DNA transfer</text>
  </g>
</svg>
