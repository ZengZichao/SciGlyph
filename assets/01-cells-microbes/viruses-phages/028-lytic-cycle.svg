<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-virology" role="img" aria-labelledby="t-lytic_cycle d-lytic_cycle" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-lytic_cycle">裂解周期 / Lytic cycle phage replication burst</title>
  <desc id="d-lytic_cycle">噬菌体裂解周期(复制与装配合并展示，共四阶段)：1)吸附adsorption 2)DNA注入 3)复制与装配replication &amp; assembly 4)裂解释放(lysin破壁, burst size~50-200 PFU/cell)。关键词: lytic cycle, replication, lysis, burst size, holin, lysin</desc>
  <g id="layer-body-lytic_cycle" data-name="body">
    <!-- Adsorption -->
    <circle cx="20" cy="20" r="6" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1"/>
    <rect x="15" y="30" width="10" height="6" rx="3" ry="3" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <text x="20" y="45" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">1.attach</text>
    <!-- Injection -->
    <path d="M35,20 L45,20" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5"/>
    <polygon points="45,18 49,20 45,22" fill="#6C3FA0" data-pp="gene"/>
    <rect x="50" y="15" width="12" height="10" rx="4" ry="4" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <text x="50.0" y="30.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">2.inject</text>
    <!-- Replication -->
    <circle cx="80" cy="20" r="8" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <circle cx="77" cy="18" r="2" fill="#5B8C3E" data-pp="virus"/>
    <circle cx="83" cy="18" r="2" fill="#5B8C3E" data-pp="virus"/>
    <circle cx="80" cy="23" r="2" fill="#5B8C3E" data-pp="virus"/>
    <text x="75.63" y="37.42" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">3.replicate</text>
    <!-- Lysis/burst -->
    <circle cx="50" cy="65" r="10" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" stroke-dasharray="2,1"/>
    <circle cx="38" cy="58" r="3" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="0.5"/>
    <circle cx="62" cy="58" r="3" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="0.5"/>
    <circle cx="42" cy="75" r="3" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="0.5"/>
    <circle cx="58" cy="75" r="3" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="0.5"/>
    <circle cx="50" cy="55" r="3" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="0.5"/>
    <text x="50" y="88" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">4.lysis (burst)</text>
    <!-- Arrows -->
    <path d="M28,20 L33,20" fill="none" stroke="#1B2733" stroke-width="1"/>
    <path d="M64,20 L70,20" fill="none" stroke="#1B2733" stroke-width="1"/>
    <path d="M80,30 Q80,50 60,60" fill="none" stroke="#1B2733" stroke-width="1"/>
  </g>
  <g id="layer-annotation-lytic_cycle" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">lytic cycle</text>
  </g>
</svg>