<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-virology" role="img" aria-labelledby="t-lysogeny_integration d-lysogeny_integration" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-lysogeny_integration">溶原化(integration) / Lysogeny prophage integration attB</title>
  <desc id="d-lysogeny_integration">溶原化：温和噬菌体DNA通过attP-attB位点重组(integrase/Int)整合到宿主染色体，成为前噬菌体(prophage)。xis参与切除。关键词: lysogeny, integration, prophage, attP, attB, integrase, xis</desc>
  <g id="layer-body-lysogeny_integration" data-name="body">
    <!-- Host chromosome -->
    <path d="M10,50 Q25,40 40,50 Q55,60 70,50 Q85,40 95,50" fill="none" stroke="#2E86AB" data-pp="bacteria" stroke-width="2"/>
    <!-- attB site -->
    <rect x="45" y="46" width="10" height="8" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="50" y="53" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">attB</text>
    <!-- Phage DNA approaching -->
    <circle cx="50" cy="20" r="10" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1.5"/>
    <path d="M44,18 Q47,14 50,18 Q53,22 56,18" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="1"/>
    <!-- attP label -->
    <text x="50" y="34" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">attP</text>
    <!-- Int/Xis arrow -->
    <path d="M50,34 L50,44" fill="none" stroke="#1B2733" stroke-width="1"/>
    <polygon points="48,42 50,46 52,42" fill="#1B2733" data-pp="ink"/>
    <text x="60" y="40" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">int/xis</text>
    <!-- Integrated prophage -->
    <rect x="45" y="46" width="10" height="8" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1"/>
  </g>
  <g id="layer-annotation-lysogeny_integration" data-name="annotation">
    <text x="50" y="70" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">prophage integrated</text>
    <text x="50" y="78" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">at attB site</text>
  </g>
</svg>