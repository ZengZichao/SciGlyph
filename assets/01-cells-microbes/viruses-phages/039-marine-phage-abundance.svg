  <title id="t-marine_phage_abundance">海洋噬菌体丰度 / Marine phage abundance 10^7 per mL</title>
  <desc id="d-marine_phage_abundance">海洋中噬菌体丰度约10^7/mL，是细菌丰度(~10^6/mL)的约10倍。是海洋中数量最多的生物实体。每天裂解约20-40%海洋细菌。关键词: marine phage, abundance, 10^7/mL, phage-to-bacteria ratio, ocean virology</desc>
