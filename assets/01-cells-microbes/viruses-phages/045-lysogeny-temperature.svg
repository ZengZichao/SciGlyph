<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-virology" role="img" aria-labelledby="t-lysogeny_temperature d-lysogeny_temperature" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-lysogeny_temperature">溶原性随温度变化 / Lysogeny proportion vs temperature</title>
  <desc id="d-lysogeny_temperature">溶原性比例随温度变化：低温/寡营养环境中溶原性比例升高(温带噬菌体策略)，高温/富营养环境中裂解性比例升高。海洋和土壤中的观测趋势。图中温度刻度与比例为示意(非定量曲线, 数值为示例)。关键词: lysogeny, temperature, prophage ratio, environmental gradient</desc>
  <g id="layer-body-lysogeny_temperature" data-name="body">
    <!-- Axes -->
    <line x1="15" y1="75" x2="90" y2="75" stroke="#1B2733" stroke-width="1"/>
    <line x1="15" y1="15" x2="15" y2="75" stroke="#1B2733" stroke-width="1"/>
    <!-- X axis labels -->
    <text x="15" y="85" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">0°C</text>
    <text x="50" y="85" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">25°C</text>
    <text x="85" y="85" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">50°C</text>
    <text x="50" y="95" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">temperature</text>
    <!-- Y axis label -->
    <text x="12" y="45" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">lysogeny</text>
    <!-- Curve: high lysogeny at low temp, low at high temp -->
    <path d="M15,25 Q30,30 45,45 Q60,55 75,65 Q85,70 90,72" fill="none" stroke="#5B8C3E" data-pp="virus" stroke-width="2"/>
      <circle cx="20" cy="28" r="2" fill="#5B8C3E" data-pp="virus"/>
    <circle cx="40" cy="42" r="2" fill="#5B8C3E" data-pp="virus"/>
    <circle cx="60" cy="55" r="2" fill="#5B8C3E" data-pp="virus"/>
    <circle cx="80" cy="68" r="2" fill="#5B8C3E" data-pp="virus"/>

  </g>
  <g id="layer-annotation-lysogeny_temperature" data-name="annotation">
    <text x="50" y="10" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">Lysogeny ↑ at low T</text>
  </g>
</svg>