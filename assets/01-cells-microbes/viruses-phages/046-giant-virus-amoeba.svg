  <title id="t-giant_virus_amoeba">巨型病毒与阿米巴 / Giant virus amoeba host infection</title>
  <desc id="d-giant_virus_amoeba">巨型病毒(如Mimivirus)感染阿米巴(Acanthamoeba)。病毒通过吞噬进入，在胞质病毒工厂中复制。单层二十面体衣壳+衣壳下脂质内膜+表面纤维冠。与细菌小细胞并置比尺寸。关键词: giant virus, Mimivirus, amoeba, Acanthamoeba, virus factory</desc>
