<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-virology" role="img" aria-labelledby="t-phage_display d-phage_display" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-phage_display">噬菌体展示(pIII融合) / Phage display filamentous pIII fusion</title>
  <desc id="d-phage_display">噬菌体展示：将外源蛋白/多肽(如scFv抗体)融合到丝状噬菌体pIII(或pVIII)蛋白上，展示在噬菌体表面。用于筛选结合配体。关键词: phage display, pIII, fusion protein, M13, library, biopanning</desc>
  <g id="layer-body-phage_display" data-name="body">
    
    <rect x="15" y="35" width="55" height="12" rx="6" ry="6" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1.5" />
    
    <circle cx="72" cy="41" r="5" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1.5" />
    
    <path d="M77,41 Q82,36 87,41 Q82,46 77,41" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1" />
    <text x="82" y="43" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">pep</text>
    
    <line x1="20" y1="37" x2="22" y2="45" stroke="#1B2733" stroke-width="0.3" stroke-opacity="0.4" />
    <line x1="30" y1="37" x2="32" y2="45" stroke="#1B2733" stroke-width="0.3" stroke-opacity="0.4" />
    <line x1="40" y1="37" x2="42" y2="45" stroke="#1B2733" stroke-width="0.3" stroke-opacity="0.4" />
    <line x1="50" y1="37" x2="52" y2="45" stroke="#1B2733" stroke-width="0.3" stroke-opacity="0.4" />
    <line x1="60" y1="37" x2="62" y2="45" stroke="#1B2733" stroke-width="0.3" stroke-opacity="0.4" />
  </g>
  <g id="layer-annotation-phage_display" data-name="annotation">
    <text x="65" y="26.4" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">pIII</text>
    <line x1="82.0" y1="31.5" x2="73.46" y2="31.5" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="73.46" y="33.6" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">fusion</text>
    <text x="50" y="60" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">phage display</text>
    <text x="50" y="68" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">pIII-fusion library</text>
  </g>
