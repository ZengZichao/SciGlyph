<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-virology" role="img" aria-labelledby="t-crispr_spacer_match d-crispr_spacer_match" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-crispr_spacer_match">CRISPR spacer匹配 / CRISPR spacer match phage DNA target</title>
  <desc id="d-crispr_spacer_match">CRISPR免疫：spacer序列来自噬菌体DNA片段，转录为crRNA引导Cas核酸酶识别并切割入侵噬菌体DNA。R=repeat。关键词: CRISPR, spacer, cas, protospacer, guide RNA, immunity, adaptation</desc>
  <g id="layer-body-crispr_spacer_match" data-name="body">
    <!-- CRISPR array -->
    <rect x="7" y="12" width="85" height="11" rx="2" ry="2" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <!-- Repeats and spacers -->
    <rect x="9" y="14" width="7" height="7" fill="#93A0AC" data-pp="muted" stroke="#1B2733" stroke-width="0.5"/>
    <rect x="18" y="14" width="13" height="7" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="0.5"/>
    <rect x="33" y="14" width="7" height="7" fill="#93A0AC" data-pp="muted" stroke="#1B2733" stroke-width="0.5"/>
    <rect x="42" y="14" width="13" height="7" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="0.5"/>
    <rect x="57" y="14" width="7" height="7" fill="#93A0AC" data-pp="muted" stroke="#1B2733" stroke-width="0.5"/>
    <rect x="66" y="14" width="13" height="7" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="0.5"/>
    <rect x="81" y="14" width="7" height="7" fill="#93A0AC" data-pp="muted" stroke="#1B2733" stroke-width="0.5"/>
    <!-- crRNA guide from spacer to Cas -->
    <line x1="72.5" y1="23" x2="72.5" y2="47" stroke="#00857A" data-pp="metabolism" stroke-width="1.5"/>
    <!-- Cas nuclease bound on the target -->
    <circle cx="72.5" cy="56" r="9" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <!-- phage DNA with protospacer -->
    <path d="M8 68L92 68" fill="none" stroke="#1B2733" data-pp="ink" stroke-width="2"/>
    <path d="M58 68L87 68" fill="none" stroke="#5B8C3E" data-pp="virus" stroke-width="4"/>
    <line x1="70" y1="66" x2="70" y2="76" stroke="#C42D2D" data-pp="alert" stroke-width="1.5"/>
    <line x1="75" y1="66" x2="75" y2="76" stroke="#C42D2D" data-pp="alert" stroke-width="1.5"/>
  </g>
  <g id="layer-annotation-crispr_spacer_match" data-name="annotation">
    <text x="12.5" y="9" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">R</text>
    <text x="72.5" y="9" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">spacer</text>
    <text x="68" y="34" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism" text-anchor="end">guide RNA</text>
    <text x="72.5" y="58.5" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Cas</text>
    <text x="24" y="78" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">phage DNA</text>
    <text x="90" y="84" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="end">cleavage</text>
    <text x="50" y="94" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">Spacer match → cleavage</text>
  </g>
</svg>