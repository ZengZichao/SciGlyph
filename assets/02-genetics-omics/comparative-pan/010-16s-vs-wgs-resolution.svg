<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t-16s_vs_wgs_resolution d-16s_vs_wgs_resolution" class="pp-diagram pp-comparative" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-16s_vs_wgs_resolution">16S vs 全基因组分辨率 / 16S vs WGS taxonomic resolution</title>
  <desc id="d-16s_vs_wgs_resolution">16S与全基因组分类分辨率对比。schematic, not to scale. 关键词: 16S, WGS, resolution</desc>
  
<g data-name="background"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/></g>
<g data-name="16s-tree">
  <text x="150" y="55" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">16S rRNA</text>
  <line x1="60" y1="200" x2="120" y2="140" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="60" y1="200" x2="120" y2="260" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="120" y1="140" x2="220" y2="110" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="120" y1="140" x2="220" y2="170" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="120" y1="260" x2="220" y2="240" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="120" y1="260" x2="220" y2="290" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <circle cx="220" cy="110" r="5" fill="#2E86AB" data-pp="bacteria"/>
  <circle cx="220" cy="170" r="5" fill="#2E86AB" data-pp="bacteria"/>
  <circle cx="220" cy="240" r="5" fill="#2E86AB" data-pp="bacteria"/>
  <circle cx="220" cy="290" r="5" fill="#2E86AB" data-pp="bacteria"/>
  <text x="150" y="350" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" text-anchor="middle" data-pp="muted">Low resolution</text>
</g>
<g data-name="wgs-tree">
  <text x="440" y="55" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Whole Genome</text>
  <line x1="350" y1="200" x2="400" y2="130" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="350" y1="200" x2="400" y2="270" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="400" y1="130" x2="460" y2="90" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="400" y1="130" x2="460" y2="130" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="400" y1="130" x2="460" y2="170" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="400" y1="270" x2="460" y2="230" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="400" y1="270" x2="460" y2="270" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="400" y1="270" x2="460" y2="310" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <circle cx="460" cy="90" r="5" fill="#6C3FA0" data-pp="gene"/>
  <circle cx="460" cy="130" r="5" fill="#6C3FA0" data-pp="gene"/>
  <circle cx="460" cy="170" r="5" fill="#6C3FA0" data-pp="gene"/>
  <circle cx="460" cy="230" r="5" fill="#6C3FA0" data-pp="gene"/>
  <circle cx="460" cy="270" r="5" fill="#6C3FA0" data-pp="gene"/>
  <circle cx="460" cy="310" r="5" fill="#6C3FA0" data-pp="gene"/>
  <text x="440" y="350" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" text-anchor="middle" data-pp="metabolism">High resolution</text>
</g>
<text x="300" y="30" font-size="13" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">16S vs Whole Genome — Taxonomic Resolution (schematic)</text>
</svg>
