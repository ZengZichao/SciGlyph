  <text x="168" y="155" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">6</text>
  <rect x="206" y="250" width="40" height="90" fill="#E8871E" data-pp="mge"/>
  <text x="226" y="360" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Sp3</text>
  <text x="226" y="245" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">3</text>
  <rect x="264" y="280" width="40" height="60" fill="#E8871E" data-pp="mge"/>
  <text x="284" y="360" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Sp4</text>
  <text x="284" y="275" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">2</text>
  <rect x="322" y="250" width="40" height="90" fill="#E8871E" data-pp="mge"/>
  <text x="342" y="360" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Sp5</text>
  <text x="342" y="245" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">3</text>
  <rect x="380" y="250" width="40" height="90" fill="#E8871E" data-pp="mge"/>
  <text x="400" y="360" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Sp6</text>
  <text x="400" y="245" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">3</text>
  <rect x="438" y="280" width="40" height="60" fill="#E8871E" data-pp="mge"/>
  <text x="458" y="360" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Sp7</text>
  <text x="458" y="275" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">2</text>
  <rect x="496" y="310" width="40" height="30" fill="#E8871E" data-pp="mge"/>
  <text x="516" y="360" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Sp8</text>
  <text x="516" y="305" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">1</text>
