<title id="t-noncoding_rate_comparison">非编码率比较 / Non-coding DNA rate comparison</title>
<desc id="d-noncoding_rate_comparison">Stacked bars showing coding/non-coding/intergenic proportions per group. schematic. 关键词: comparative genomics, noncoding rate comparison, Non-coding, DNA, intergenic, composition, Bacteria, Archaea</desc>
