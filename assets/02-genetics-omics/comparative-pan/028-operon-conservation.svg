  <title id="t-operon_conservation">操纵子保守性 / Operon conservation across species</title>
  <desc id="d-operon_conservation">操纵子基因顺序在物种间的保守性：SpA–SpC 共线性保守(✓)，SpD 的 gC/gE 与 SpE 的 gD/gE 发生重排(✗)。schematic, not to scale. 关键词: operon, conservation, gene order, rearrangement</desc>

