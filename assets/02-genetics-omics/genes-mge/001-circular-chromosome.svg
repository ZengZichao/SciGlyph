<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-01_circular_chromosome d-01_circular_chromosome" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-01_circular_chromosome">环状染色体 / Circular Chromosome</title>
  <desc id="d-01_circular_chromosome">细菌典型环状染色体。oriC(复制起点)与ter(复制终点)对位，双向复制叉。关键词: circular chromosome, oriC, ter, bidirectional replication</desc>
  <defs>
    <marker id="pp01__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
    <circle cx="50" cy="45" r="30" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="2"/>
    <circle cx="50" cy="15" r="4" fill="#00857A" data-pp="metabolism"/>
    <circle cx="50" cy="75" r="4" fill="#C42D2D" data-pp="alert"/>
    <circle cx="20" cy="45" r="3" fill="#E8871E" data-pp="mge"/>
    <circle cx="80" cy="45" r="3" fill="#E8871E" data-pp="mge"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="10" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">oriC</text>
    <text x="50" y="85" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ter</text>
        <line x1="23" y1="45" x2="30" y2="35" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp01__ar)"/>
        <line x1="77" y1="45" x2="70" y2="35" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp01__ar)"/>
    <text x="50" y="95" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">bidirectional forks</text>
  </g>
</svg>