<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-03_metagenome_bins d-03_metagenome_bins" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-03_metagenome_bins">宏基因组组装 / Metagenome Assembly (contig/scaffold/bin)</title>
  <desc id="d-03_metagenome_bins">宏基因组分层: reads→contigs→scaffolds→MAGs(bins)。覆盖度(depth)区分不同基因组。关键词: metagenome, contig, scaffold, bin, MAG, coverage</desc>
  <g id="layer-body" data-name="body">
        <rect x="5" y="15" width="25" height="8" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <text x="17.5" y="20.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">reads</text>
        <rect x="5" y="30" width="40" height="8" rx="1" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <text x="25.0" y="35.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">contigs</text>
        <rect x="5" y="45" width="55" height="8" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="32.5" y="50.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">scaffolds</text>
        <rect x="5" y="60" width="70" height="8" rx="1" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="40.0" y="65.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">bin/MAG</text>
    <rect x="5" y="75" width="90" height="12" rx="1" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="95" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">assembly hierarchy</text>
  </g>
</svg>