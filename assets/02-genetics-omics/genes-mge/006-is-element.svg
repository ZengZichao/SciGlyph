        <rect x="23" y="40" width="50" height="12" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <text x="50.0" y="47.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">transposase</text>
        <rect x="73" y="40" width="8" height="12" rx="1" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="81.0" y="47.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">IRR</text>
