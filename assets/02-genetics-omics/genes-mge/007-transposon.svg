  <title id="t-07_transposon">转座子 / Transposon (Tn)</title>
  <desc id="d-07_transposon">复合转座子: IS-抗性基因-IS。非复合转座子含tnpA/tnpR+抗性基因。关键词: transposon, Tn, composite, antibiotic resistance</desc>
  <g id="layer-body" data-name="body">
        <rect x="5" y="40" width="10" height="12" rx="1" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="10.0" y="47.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">IS</text>
        <rect x="15" y="40" width="25" height="12" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="27.5" y="47.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">AbR</text>
        <rect x="40" y="40" width="25" height="12" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="52.5" y="47.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">AbR2</text>
        <rect x="65" y="40" width="10" height="12" rx="1" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="70.0" y="47.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">IS</text>
    <rect x="75" y="40" width="20" height="12" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <text x="85" y="37" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">tnpA/R</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="65" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">composite Tn</text>
    <text x="50" y="80" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">IS-flanked resistance</text>
