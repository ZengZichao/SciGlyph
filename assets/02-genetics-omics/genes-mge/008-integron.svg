<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-08_integron d-08_integron" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-08_integron">整合子 / Integron</title>
  <desc id="d-08_integron">整合子: intI(整合酶)+attI(重组位点)+基因盒(cassette)串联排列。5'→3'方向表达。关键词: integron, intI, attI, gene cassette, attC</desc>
  <g id="layer-body" data-name="body">
        <rect x="5" y="38" width="15" height="14" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1" />
    <text x="12.5" y="46.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">intI</text>
        <rect x="22" y="38" width="8" height="14" rx="1" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1" />
    <text x="30.0" y="46.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">attI</text>
        <rect x="32" y="38" width="12" height="14" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1" />
    <text x="40.82" y="54.48" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">cass1</text>
        <rect x="46" y="38" width="12" height="14" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1" />
    <text x="50.59" y="45.51" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">cass2</text>
        <rect x="60" y="38" width="12" height="14" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1" />
    <text x="68.82" y="54.48" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">cass3</text>
        <rect x="74" y="38" width="8" height="14" rx="1" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1" />
    <text x="76.59" y="45.51" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">attC</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="25" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">5' → 3' expression</text>
    <text x="50" y="70" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">gene cassette array</text>
    <text x="50" y="85" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">site-specific recomb.</text>
  </g>
</svg>