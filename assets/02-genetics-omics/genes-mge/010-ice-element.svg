  <title id="t-10_ice_element">ICE/IMEX / ICE (Integrative Conjugative Element)</title>
  <desc id="d-10_ice_element">整合性接合元件。染色体整合+接合转移能力。含int(整合酶)+T4SS+oriT。IMEX为整合性移动元件。关键词: ICE, IMEX, integrative, conjugative</desc>
  <g id="layer-body" data-name="body">
    <line x1="5" y1="45" x2="95" y2="45" stroke="#6C3FA0" data-pp="gene" stroke-width="2"/>
        <rect x="20" y="38" width="25" height="14" rx="1" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="32.5" y="46.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ICE</text>
        <rect x="55" y="38" width="15" height="14" rx="1" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <text x="62.5" y="46.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">T4SS</text>
        <rect x="75" y="38" width="12" height="14" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <text x="81.0" y="46.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">int</text>
      <circle cx="14" cy="45" r="3" fill="none" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
    <line x1="5" y1="52" x2="15" y2="52" stroke="#93A0AC" data-pp="muted" stroke-width="0.8" stroke-dasharray="2,1"/>
    <line x1="87" y1="52" x2="95" y2="52" stroke="#93A0AC" data-pp="muted" stroke-width="0.8" stroke-dasharray="2,1"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="70" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">chromosome-integrated</text>
    <text x="50" y="82" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">excision + transfer</text>
