<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-11_genomic_island d-11_genomic_island" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-11_genomic_island">基因组岛 / Genomic Island (GI)</title>
  <desc id="d-11_genomic_island">基因组岛判据: GC含量异常+密码子偏好不同+两侧直接重复(DR)+常插入tRNA基因+含整合酶/转座酶。常含致病岛/共生岛/代谢岛。关键词: genomic island, GC content, codon bias, direct repeat, tRNA, pathogenicity island</desc>
  <g id="layer-body" data-name="body">
    <line x1="5" y1="30" x2="95" y2="30" stroke="#6C3FA0" data-pp="gene" stroke-width="1"/>
    <rect x="30" y="25" width="40" height="10" fill="#E8871E" data-pp="mge" fill-opacity="0.4"/>
    <rect x="30" y="40" width="40" height="15" fill="#C42D2D" data-pp="alert" fill-opacity="0.3"/>
    <text x="50" y="50" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">GI</text>
    <text x="15" y="55" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">GC%</text>
    <text x="85" y="55" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">GC%</text>
      <polygon points="28,25 30,30 30,35 28,40 26,35 26,30" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="0.5"/>
    <polygon points="72,25 70,30 70,35 72,40 74,35 74,30" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="0.5"/>
    <path d="M10,62 Q30,58 50,62 Q70,66 90,62" fill="none" stroke="#E8871E" data-pp="mge" stroke-width="0.8"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="70" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">atypical GC / codon</text>
    <text x="50" y="82" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">DR / tRNA flank</text>
    <text x="50" y="94" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">HGT signature</text>
  </g>
</svg>