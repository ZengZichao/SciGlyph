    <text x="80" y="56.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">R</text>
        <circle cx="20" cy="82" r="10" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" />
    <text x="20" y="83.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">D</text>
