  <title id="t-13_hgt_three_ways">基因水平转移 / Horizontal Gene Transfer (3 ways)</title>
  <desc id="d-13_hgt_three_ways">三种HGT方式: 转化(transformation,摄取游离DNA)、转导(transduction,噬菌体介导)、接合(conjugation,质粒/接合元件)。关键词: HGT, transformation, transduction, conjugation</desc>
