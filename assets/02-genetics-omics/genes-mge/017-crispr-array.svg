  <title id="t-17_crispr_array">CRISPR阵列 / CRISPR Array</title>
  <desc id="d-17_crispr_array">CRISPR阵列: cas基因簇+leader序列+repeat-spacer重复单元。spacer来自入侵者DNA。关键词: CRISPR, cas genes, leader, repeat, spacer, adaptation</desc>
