    <text x="83.0" y="47.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">R</text>
        <rect x="88" y="40" width="8" height="12" rx="1" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1"/>
    <text x="92.0" y="47.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">sp3</text>
