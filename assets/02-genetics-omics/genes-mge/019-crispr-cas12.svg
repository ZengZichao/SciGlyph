<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-19_crispr_cas12 d-19_crispr_cas12" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-19_crispr_cas12">Cas12(V型) / Cas12 (Type V)</title>
  <desc id="d-19_crispr_cas12">V型CRISPR-Cas: Cas12a(Cpf1)仅需单一crRNA(无tracrRNA)，识别T-rich PAM(5'-TTTN)；单一RuvC样催化域交错切割双链DNA产生5'突出粘性末端，激活后还可反式切割ssDNA(cis+trans)。关键词: Cas12, Type V, Cpf1, crRNA, sticky ends, trans-cleavage</desc>
  <g id="layer-body" data-name="body">
    <line x1="10" y1="45" x2="90" y2="45" stroke="#6C3FA0" data-pp="gene" stroke-width="2"/>
    <line x1="10" y1="50" x2="90" y2="50" stroke="#6C3FA0" data-pp="gene" stroke-width="2"/>
        <rect x="38" y="35" width="22" height="20" rx="1" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1"/>
    <text x="49.0" y="46.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Cas12</text>
      <line x1="44" y1="55" x2="44" y2="60" stroke="#C42D2D" data-pp="alert" stroke-width="1"/>
    <line x1="48" y1="55" x2="48" y2="58" stroke="#C42D2D" data-pp="alert" stroke-width="1"/>
    <line x1="49" y1="25" x2="49" y2="35" stroke="#5B8C3E" data-pp="virus" stroke-width="1" stroke-dasharray="1,1"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="30" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">crRNA</text>
    <text x="50" y="70" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">staggered cut</text>
    <text x="50" y="82" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">trans-cleavage</text>
    <text x="50" y="94" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">T-rich PAM</text>
  </g>
</svg>