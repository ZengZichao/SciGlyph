<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-24_sigma_factor_cascade d-24_sigma_factor_cascade" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-24_sigma_factor_cascade">σ因子级联 / Sigma Factor Cascade</title>
  <desc id="d-24_sigma_factor_cascade">真实时序级联示例——枯草芽孢杆菌孢子化: σH→σF(前孢子)→σE(母细胞)→σG(前孢子)，最终σK(图中略)。各σ识别不同启动子-35/-10。(管家σ70、热激σ32、氮σ54、鞭毛σ28为并行调控而非线性级联。) 关键词: sigma factor, sporulation, Bacillus, σH, σF, σE, σG, cascade</desc>
  <defs>
    <marker id="pp24__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink" />
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
        <rect x="5" y="20" width="20" height="12" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1" />
    <text x="15.0" y="27.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">σH</text>
        <rect x="30" y="35" width="20" height="12" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1" />
    <text x="40.0" y="42.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">σF</text>
        <rect x="55" y="50" width="20" height="12" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1" />
    <text x="65.0" y="57.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">σE</text>
        <rect x="75" y="65" width="20" height="12" rx="1" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" />
    <text x="85.0" y="72.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">σG</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
        <line x1="25" y1="26" x2="30" y2="35" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp24__ar)" />
        <line x1="50" y1="41" x2="55" y2="50" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp24__ar)" />
        <line x1="75" y1="56" x2="75" y2="65" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp24__ar)" />
    <text text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" font-size="7" x="26.13" y="90.0">B. subtilis</text><text text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" font-size="7" x="26.13" y="98.26">sporulation</text>
  </g>
</svg>