<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-25_two_component_system d-25_two_component_system" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-25_two_component_system">双组分系统 / Two-Component System</title>
  <desc id="d-25_two_component_system">双组分信号转导: 膜上组氨酸激酶(HK)感知信号→His自磷酸化→磷酸基团转移至应答调节蛋白(RR)的Asp(典型两步磷转移；多步His→Asp→His→Asp体系称phosphorelay)→调控基因表达。关键词: two-component, histidine kinase, response regulator, phosphotransfer</desc>
  <defs>
    <marker id="pp25__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink" />
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
    <line x1="20" y1="50" x2="80" y2="50" stroke="#2E86AB" data-pp="bacteria" stroke-width="2" />
        <rect x="30" y="35" width="15" height="15" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1" />
    <text x="37.5" y="44.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">HK</text>
        <rect x="55" y="55" width="15" height="15" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1" />
    <text x="62.5" y="64.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">RR</text>
    <circle cx="45" cy="42" r="3" fill="#C42D2D" data-pp="alert" />
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="37" y="30" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">signal</text>
        <line x1="45" y1="45" x2="55" y2="55" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp25__ar)" />
    <text x="50" y="80" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">His-kinase → RR-P</text>
    <text text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" font-size="7" x="35.22" y="92.0">two-step</text><text text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" font-size="7" x="33.05" y="72.92">phosphotransfer</text>
  </g>
</svg>