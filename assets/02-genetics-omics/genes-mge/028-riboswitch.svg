<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-28_riboswitch d-28_riboswitch" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-28_riboswitch">核糖开关 / Riboswitch</title>
  <desc id="d-28_riboswitch">核糖开关: mRNA 5'UTR中代谢物结合域，结合后构象变化调控下游基因表达。关键词: riboswitch, aptamer, expression platform, metabolite binding, 5'UTR</desc>
  <defs>
    <marker id="pp28__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
    <line x1="5" y1="45" x2="95" y2="45" stroke="#6C3FA0" data-pp="gene" stroke-width="2"/>
        <rect x="25" y="38" width="20" height="14" rx="1" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="35.0" y="46.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">aptamer</text>
        <rect x="50" y="38" width="20" height="14" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="60.0" y="46.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">expr</text>
    <circle cx="35" cy="28" r="5" fill="#C42D2D" data-pp="alert"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="35" y="22" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ligand</text>
        <line x1="35" y1="33" x2="35" y2="38" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp28__ar)"/>
    <text x="50" y="65" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">conformational switch</text>
    <text x="50" y="78" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">no protein needed</text>
  </g>
</svg>