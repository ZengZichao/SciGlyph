<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-29_restriction_modification d-29_restriction_modification" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-29_restriction_modification">限制修饰系统 / Restriction-Modification System</title>
  <desc id="d-29_restriction_modification">限制酶切割外来DNA，甲基化酶保护自身DNA。Dam(GATC)/Dcm甲基化。关键词: restriction-modification, Dam, Dcm, methylase, endonuclease</desc>
  <g id="layer-body" data-name="body">
    <line x1="10" y1="30" x2="90" y2="30" stroke="#6C3FA0" data-pp="gene" stroke-width="2"/>
    <line x1="10" y1="55" x2="90" y2="55" stroke="#5B8C3E" data-pp="virus" stroke-width="2"/>
        <rect x="40" y="38" width="20" height="12" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="50.0" y="45.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">MTase</text>
        <rect x="40" y="60" width="20" height="12" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="50.0" y="67.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">REase</text>
      <circle cx="25" cy="30" r="2" fill="#00857A" data-pp="metabolism"/>
    <circle cx="75" cy="30" r="2" fill="#00857A" data-pp="metabolism"/>
    <line x1="50" y1="55" x2="50" y2="60" stroke="#C42D2D" data-pp="alert" stroke-width="1.5"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="20" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">self (methylated)</text>
    <text x="50" y="75" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">foreign (cut)</text>
    <text x="50" y="88" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Dam/Dcm methylation</text>
    <text x="50" y="96" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">GATC / CCWGG</text>
  </g>
</svg>