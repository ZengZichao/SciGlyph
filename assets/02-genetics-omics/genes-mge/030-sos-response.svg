        <line x1="50" y1="40" x2="55" y2="40" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp30__ar)"/>
        <line x1="70" y1="40" x2="75" y2="40" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp30__ar)"/>
    <text x="50" y="60" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">LexA auto-cleavage</text>
