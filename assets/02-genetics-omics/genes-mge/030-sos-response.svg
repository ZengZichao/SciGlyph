  <title id="t-30_sos_response">SOS响应 / SOS Response (RecA/LexA)</title>
  <desc id="d-30_sos_response">DNA损伤→RecA激活→LexA自切割→SOS基因去阻遏。uvrA/B/C, umuC/D。关键词: SOS response, RecA, LexA, DNA damage, error-prone repair</desc>
  <defs>
    <marker id="pp30__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
        <circle cx="20" cy="40" r="10" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="20" y="41.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">DNA</text>
        <rect x="35" y="33" width="15" height="14" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <text x="42.5" y="41.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">RecA</text>
        <rect x="55" y="33" width="15" height="14" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <text x="62.5" y="41.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">LexA</text>
        <rect x="75" y="33" width="15" height="14" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="82.5" y="41.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">SOS</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
