<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-33_mutation_types d-33_mutation_types" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-33_mutation_types">突变类型 / Mutation Types</title>
  <desc id="d-33_mutation_types">点突变/插入/缺失/倒位/重复。同义/错义/无义突变。关键词: mutation, point, insertion, deletion, inversion, duplication, synonymous</desc>
  <g id="layer-body" data-name="body">
        <rect x="5" y="15" width="18" height="10" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <text x="14.0" y="21.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">point</text>
        <rect x="28" y="15" width="18" height="10" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="37.0" y="21.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ins</text>
        <rect x="51" y="15" width="18" height="10" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="60.0" y="21.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">del</text>
        <rect x="74" y="15" width="18" height="10" rx="1" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="83.0" y="21.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">inv</text>
        <rect x="5" y="35" width="18" height="10" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="14.0" y="41.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">dup</text>
        <rect x="28" y="35" width="18" height="10" rx="1" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <text x="37.0" y="41.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">syn</text>
        <rect x="51" y="35" width="18" height="10" rx="1" fill="#8C6D3F" data-pp="host" stroke="#1B2733" stroke-width="1"/>
    <text x="60.0" y="41.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">mis</text>
        <rect x="74" y="35" width="18" height="10" rx="1" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1"/>
    <text x="83.0" y="41.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">non</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="60" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">structural changes</text>
    <text x="50" y="72" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">syn= synonymous</text>
    <text x="50" y="82" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">mis= missense</text>
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">non= nonsense</text>
  </g>
</svg>