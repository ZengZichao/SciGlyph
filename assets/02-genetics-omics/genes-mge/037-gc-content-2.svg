<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-37_gc_content d-37_gc_content" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-37_gc_content">GC含量梯度 / GC Content Gradient</title>
  <desc id="d-37_gc_content">GC含量从~25%(Mycoplasma)到~75%(Streptomyces)。GC3s(密码子第三位GC)反映密码子偏好。关键词: GC content, GC3s, codon bias, genome composition</desc>
  <g id="layer-body" data-name="body">
    <rect x="10" y="30" width="80" height="15" rx="2" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1"/>
    <rect x="10" y="30" width="20" height="15" rx="2" fill="#6C3FA0" data-pp="gene" fill-opacity="0.3"/>
    <rect x="30" y="30" width="20" height="15" rx="2" fill="#6C3FA0" data-pp="gene" fill-opacity="0.5"/>
    <rect x="50" y="30" width="20" height="15" rx="2" fill="#6C3FA0" data-pp="gene" fill-opacity="0.7"/>
    <rect x="70" y="30" width="20" height="15" rx="2" fill="#6C3FA0" data-pp="gene" fill-opacity="0.9"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="20" y="55" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">25%</text>
    <text x="50" y="55" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">50%</text>
    <text x="80" y="55" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">75%</text>
    <text x="50" y="72" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">GC content range</text>
    <text x="50" y="84" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">GC3s codon bias</text>
  </g>
</svg>