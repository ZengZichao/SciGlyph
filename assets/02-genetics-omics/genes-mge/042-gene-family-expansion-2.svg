        <line x1="58" y1="40" x2="72" y2="40" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp42__ar)"/>
    <text x="35" y="30" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">expand</text>
    <text x="65" y="30" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">contract</text>
    <text x="50" y="65" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">duplication + loss</text>
    <text x="50" y="78" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">CAFE analysis</text>
