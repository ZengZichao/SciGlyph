<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-44_mag_completeness d-44_mag_completeness" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-44_mag_completeness">MAG完整性 / MAG Completeness/Contamination</title>
  <desc id="d-44_mag_completeness">宏基因组组装基因组(MAG)质量评估: CheckM单拷贝核心基因完整性(%)与污染度(%)。关键词: MAG, CheckM, completeness, contamination, single-copy genes</desc>
  <g id="layer-body" data-name="body">
    <rect x="10" y="25" width="80" height="12" rx="2" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1"/>
    <rect x="10" y="25" width="72" height="12" rx="2" fill="#00857A" data-pp="metabolism" fill-opacity="0.5"/>
    <text x="50" y="34" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">90% complete</text>
    <rect x="10" y="45" width="80" height="12" rx="2" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1"/>
    <rect x="10" y="45" width="4" height="12" rx="2" fill="#C42D2D" data-pp="alert" fill-opacity="0.5"/>
    <text x="50" y="54" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">5% contamination</text>
      <circle cx="20" cy="65" r="2" fill="#00857A" data-pp="metabolism"/>
    <circle cx="30" cy="65" r="2" fill="#00857A" data-pp="metabolism"/>
    <circle cx="40" cy="65" r="2" fill="#C42D2D" data-pp="alert"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="72" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">CheckM assessment</text>
    <text x="50" y="84" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">single-copy markers</text>
    <text x="50" y="95" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">MIMAG standards</text>
  </g>
</svg>