<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-45_gene_conversion d-45_gene_conversion" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-45_gene_conversion">基因转换 / Gene Conversion</title>
  <desc id="d-45_gene_conversion">基因转换: 非对等重组导致一个等位基因序列被另一个替代。同源序列间信息转移。关键词: gene conversion, non-reciprocal, homogenization, concerted evolution</desc>
  <defs>
    <marker id="pp45__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink" />
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
    <line x1="10" y1="30" x2="45" y2="30" stroke="#6C3FA0" data-pp="gene" stroke-width="2" />
    <line x1="10" y1="45" x2="45" y2="45" stroke="#6C3FA0" data-pp="gene" stroke-width="2" />
    <line x1="55" y1="30" x2="90" y2="30" stroke="#6C3FA0" data-pp="gene" stroke-width="2" />
    <line x1="55" y1="45" x2="90" y2="45" stroke="#E8871E" data-pp="mge" stroke-width="2" />
  </g>
  <g id="layer-annotation" data-name="annotation">
        <line x1="45" y1="30" x2="55" y2="30" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp45__ar)" />
        <line x1="45" y1="45" x2="55" y2="45" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp45__ar)" />
    <text x="50" y="65" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">non-reciprocal</text>
    <text text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" font-size="7" x="50" y="76.0">sequence</text><text text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" font-size="7" x="50" y="83.7">homogenization</text>
    <text x="50" y="91.4" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">concerted evolution</text>
  </g>
</svg>