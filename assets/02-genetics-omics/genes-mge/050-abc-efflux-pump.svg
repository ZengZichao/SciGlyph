  <title id="t-50_abc_efflux_pump">ABC外排泵耐药 / ABC Efflux Pump (Antibiotic Resistance)</title>
  <desc id="d-50_abc_efflux_pump">ABC外排泵: 跨膜蛋白+ATP酶将抗生素泵出胞外。多重耐药机制。关键词: ABC efflux pump, antibiotic resistance, multidrug, export</desc>
  <defs>
    <marker id="pp50__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
    <line x1="10" y1="45" x2="90" y2="45" stroke="#2E86AB" data-pp="bacteria" stroke-width="3"/>
        <rect x="40" y="35" width="20" height="20" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="50.0" y="46.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ABC</text>
    <circle cx="50" cy="25" r="5" fill="#C42D2D" data-pp="alert"/>
    <text x="50" y="27" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Abx</text>
      <rect x="35" y="43" width="4" height="4" fill="#2E86AB" data-pp="bacteria"/>
    <rect x="61" y="43" width="4" height="4" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="40" cy="30" r="2" fill="#00857A" data-pp="metabolism"/>

