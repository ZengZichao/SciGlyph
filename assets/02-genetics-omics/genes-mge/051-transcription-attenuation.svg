<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-51_transcription_attenuation d-51_transcription_attenuation" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-51_transcription_attenuation">转录衰减 / Transcription Attenuation</title>
  <desc id="d-51_transcription_attenuation">trpL前导肽介导的转录衰减(trp操纵子)。高色氨酸时核糖体顺利翻译覆盖序列1，形成3:4终止发夹(转录终止)；低色氨酸时核糖体停在1区，暴露2区形成2:3抗终止发夹→RNA聚合酶通读。关键词: attenuation, leader peptide, trp operon, 3:4 terminator, 2:3 antiterminator</desc>
  <g id="layer-body" data-name="body">
        <rect x="5" y="30" width="15" height="10" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="13.52" y="36.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">leader</text>
        <rect x="25" y="30" width="10" height="10" rx="1" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <line x1="30.0" y1="34.4" x2="33.47" y2="40.96" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="33.47" y="43.06" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">1-2</text>
        <rect x="40" y="30" width="10" height="10" rx="1" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="47.0" y="36.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">3-4</text>
        <rect x="55" y="30" width="35" height="10" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <text x="72.5" y="36.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">trpEDCBA</text>
      <path d="M42,30 Q45,22 48,30" fill="none" stroke="#C42D2D" data-pp="alert" stroke-width="1.5"/>
    <circle cx="12" cy="25" r="3" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="0.5"/>
    <line x1="5" y1="40" x2="90" y2="40" stroke="#6C3FA0" data-pp="gene" stroke-width="0.8"/>

  </g>
