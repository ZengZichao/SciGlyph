<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-54_mrna_stability d-54_mrna_stability" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-54_mrna_stability">mRNA稳定性 / mRNA Stability (no 5' cap)</title>
  <desc id="d-54_mrna_stability">原核mRNA无5'帽结构，半衰期短(分钟级)。RNase E降解。多顺反子差异稳定性。关键词: mRNA stability, RNase E, no 5' cap, short half-life, degradosome</desc>
  <g id="layer-body" data-name="body">
    <line x1="10" y1="40" x2="90" y2="40" stroke="#6C3FA0" data-pp="gene" stroke-width="2"/>
    <text x="10" y="35" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">5' ppp</text>
    <text x="75" y="35" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">3' OH</text>
        <rect x="40" y="50" width="20" height="12" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="50.0" y="57.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">RNaseE</text>
      <circle cx="25" cy="50" r="2" fill="#6C3FA0" data-pp="gene"/>
    <circle cx="65" cy="50" r="2" fill="#6C3FA0" data-pp="gene"/>
    <line x1="30" y1="40" x2="35" y2="48" stroke="#C42D2D" data-pp="alert" stroke-width="1"/>
    <line x1="70" y1="40" x2="75" y2="48" stroke="#C42D2D" data-pp="alert" stroke-width="1"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="72" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">no 5' cap protection</text>
    <text x="50" y="84" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">minutes half-life</text>
    <text x="50" y="95" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">degradosome</text>
  </g>
</svg>