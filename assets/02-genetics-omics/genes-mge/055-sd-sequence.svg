<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-55_sd_sequence d-55_sd_sequence" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-55_sd_sequence">SD序列(RBS) / Shine-Dalgarno Sequence (RBS)</title>
  <desc id="d-55_sd_sequence">核糖体结合位点: SD序列(AGGAGG)与16S rRNA 3'端互补。决定翻译起始效率。关键词: Shine-Dalgarno, RBS, ribosome binding, 16S rRNA, translation initiation</desc>
  <g id="layer-body" data-name="body">
    <line x1="5" y1="40" x2="95" y2="40" stroke="#6C3FA0" data-pp="gene" stroke-width="2"/>
    <rect x="30" y="35" width="20" height="10" fill="#00857A" data-pp="metabolism" fill-opacity="0.4"/>
    <text x="40" y="43" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">AGGAGG</text>
    <text x="60" y="43" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">AUG</text>
      <ellipse cx="60" cy="30" rx="10" ry="6" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.8"/>
    <line x1="35" y1="45" x2="45" y2="45" stroke="#00857A" data-pp="metabolism" stroke-width="1" stroke-dasharray="1,1"/>
    <rect x="55" y="38" width="10" height="4" fill="#00857A" data-pp="metabolism" fill-opacity="0.4"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="58" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">SD-antiSD pairing</text>
    <text x="50" y="70" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">16S rRNA 3' end</text>
    <text x="50" y="82" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">translation initiation</text>
  </g>
</svg>