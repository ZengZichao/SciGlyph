<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-genes-mge" role="img" aria-labelledby="t-57_spacer_source d-57_spacer_source" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-57_spacer_source">Spacer来源匹配 / Spacer Source Matching</title>
  <desc id="d-57_spacer_source">CRISPR spacer来源: 噬菌体DNA(病毒防御) vs 质粒DNA vs 宿主自身(自免疫)。关键词: CRISPR spacer, phage DNA, plasmid, self vs non-self</desc>
