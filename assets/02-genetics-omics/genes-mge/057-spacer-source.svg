        <circle cx="55" cy="35" r="10" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1" />
    <text x="55" y="36.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">plasmid</text>
        <circle cx="80" cy="35" r="10" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1" />
    <text x="80" y="36.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">self</text>
        <rect x="15" y="55" width="70" height="12" rx="1" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1" />
