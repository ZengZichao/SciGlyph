      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink" />
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
        <circle cx="25" cy="35" r="10" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1" />
