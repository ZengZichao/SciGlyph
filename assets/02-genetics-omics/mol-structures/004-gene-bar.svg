<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" data-name-zh="基因条带" data-name-en="Gene Bar" data-cat="natural-sciences" aria-labelledby="t-04 d-04" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-04">基因条带 / gene_bar</title>
