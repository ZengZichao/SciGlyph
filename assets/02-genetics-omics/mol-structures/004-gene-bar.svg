  <g id="g-04-基因条带">
    <rect x="20" y="100" width="280" height="40" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="40" y="105" width="50" height="30" fill="#0072B2" stroke="#1f2937" stroke-width="0.75" data-drole="series-1"/>
    <rect x="110" y="105" width="30" height="30" fill="#e5e7eb" stroke="#6b7280" stroke-width="0.75" stroke-dasharray="4 3"/>
