    <polygon points="25,116 32,120 25,124" fill="#1f2937"/>
    <line x1="300" y1="120" x2="310" y2="120" stroke="#1f2937" stroke-width="1.5"/>
    <polygon points="303,116 310,120 303,124" fill="#1f2937"/>
