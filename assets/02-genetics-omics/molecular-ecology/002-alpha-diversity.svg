<title id="t-alpha_diversity">Alpha多样性指数 / Alpha diversity indices</title>
<desc id="d-alpha_diversity">三个指数各一对箱线图(每列左箱=Group A、右箱=Group B；颜色=指数, 不表示分组)：Shannon/Simpson(指数单位)与Chao1(丰富度, ASV计数, 量纲不同)；Chao1 仅示意, 实际应单独坐标轴/分面。schematic. 关键词: microbial ecology, alpha diversity, indices, Shannon, Chao1, richness, significance, Index, Simpson</desc>
