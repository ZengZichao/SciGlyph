<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
     class="pp-diagram pp-molecular-ecology" role="img" aria-labelledby="t-venn d-venn" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-venn">Venn图 / Venn diagram</title>
<desc id="d-venn">三组两两重叠韦恩图, 各交区计数, 外部标注唯一OTU数 关键词: Venn, OTU, overlap, shared</desc>
<g data-name="body">
<rect x="0.0" y="0.0" width="400.0" height="400.0" fill="#F4F1EA" data-pp="bg"/>
<text x="200.0" y="25.0" font-size="13" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">OTU Overlap</text>
<circle cx="160.0" cy="180.0" r="80.0" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.2" stroke="#2E86AB" stroke-width="2"/>
<circle cx="240.0" cy="180.0" r="80.0" fill="#00857A" data-pp="metabolism" fill-opacity="0.2" stroke="#00857A" stroke-width="2"/>
<circle cx="200.0" cy="250.0" r="80.0" fill="#A2305B" data-pp="archaea" fill-opacity="0.2" stroke="#A2305B" stroke-width="2"/>
<!-- OTU dots in unique A region -->
<circle cx="130.0" cy="160.0" r="2.0" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.5"/>
<circle cx="140.0" cy="170.0" r="2.0" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.5"/>
<circle cx="125.0" cy="180.0" r="2.0" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.5"/>
<circle cx="135.0" cy="190.0" r="2.0" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.5"/>
<circle cx="145.0" cy="175.0" r="2.0" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.5"/>
<!-- OTU dots in unique B region -->
<circle cx="270.0" cy="160.0" r="2.0" fill="#00857A" data-pp="metabolism" fill-opacity="0.5"/>
<circle cx="280.0" cy="170.0" r="2.0" fill="#00857A" data-pp="metabolism" fill-opacity="0.5"/>
<circle cx="265.0" cy="180.0" r="2.0" fill="#00857A" data-pp="metabolism" fill-opacity="0.5"/>
<circle cx="275.0" cy="190.0" r="2.0" fill="#00857A" data-pp="metabolism" fill-opacity="0.5"/>
<circle cx="285.0" cy="175.0" r="2.0" fill="#00857A" data-pp="metabolism" fill-opacity="0.5"/>
<!-- OTU dots in unique C region -->
<circle cx="190.0" cy="290.0" r="2.0" fill="#A2305B" data-pp="archaea" fill-opacity="0.5"/>
<circle cx="200.0" cy="300.0" r="2.0" fill="#A2305B" data-pp="archaea" fill-opacity="0.5"/>
<circle cx="210.0" cy="290.0" r="2.0" fill="#A2305B" data-pp="archaea" fill-opacity="0.5"/>
<circle cx="195.0" cy="305.0" r="2.0" fill="#A2305B" data-pp="archaea" fill-opacity="0.5"/>
<circle cx="205.0" cy="295.0" r="2.0" fill="#A2305B" data-pp="archaea" fill-opacity="0.5"/>
<!-- OTU dots in intersection regions -->
<circle cx="195.0" cy="160.0" r="2.0" fill="#1B2733" data-pp="ink" fill-opacity="0.4"/>
<circle cx="205.0" cy="165.0" r="2.0" fill="#1B2733" data-pp="ink" fill-opacity="0.4"/>
<circle cx="170.0" cy="220.0" r="2.0" fill="#1B2733" data-pp="ink" fill-opacity="0.4"/>
<circle cx="230.0" cy="220.0" r="2.0" fill="#1B2733" data-pp="ink" fill-opacity="0.4"/>
<circle cx="200.0" cy="200.0" r="2.0" fill="#1B2733" data-pp="ink" fill-opacity="0.4"/>
<circle cx="200.0" cy="210.0" r="2.0" fill="#1B2733" data-pp="ink" fill-opacity="0.4"/>
<!-- Group labels -->
<text x="120.0" y="130.0" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2E86AB" data-pp="bacteria" text-anchor="middle" font-weight="bold">A</text>
<text x="280.0" y="130.0" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism" text-anchor="middle" font-weight="bold">B</text>
<text x="200.0" y="310.0" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#A2305B" data-pp="archaea" text-anchor="middle" font-weight="bold">C</text>
<!-- Region counts -->
<text x="115.0" y="185.0" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">245</text>
<text x="285.0" y="185.0" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">189</text>
<text x="200.0" y="280.0" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">156</text>
<text x="200.0" y="155.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">67</text>
<text x="165.0" y="230.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">43</text>
<text x="235.0" y="230.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">38</text>
<text x="200.0" y="210.0" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">28</text>
<!-- Summary stats -->
<text x="50.0" y="350.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Total:</text>
<text x="90.0" y="350.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">766</text>
<text x="50.0" y="370.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Unique:</text>
<text x="100.0" y="370.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">590</text>
<text x="200.0" y="370.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Shared:</text>
<text x="248.0" y="370.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">176</text>
</g>
</svg>
