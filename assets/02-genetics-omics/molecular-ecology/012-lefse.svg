<title id="t-lefse">LEfSe进化分支 / LEfSe cladogram</title>
<desc id="d-lefse">LEfSe cladogram with differential taxa highlighted and LDA score bar. Cladogram is nested by taxonomy rank (phylum contains its genera); each taxon keeps one colour in both panels. schematic. 关键词: microbial ecology, lefse, cladogram, differential, taxa, LDA, Evolutionary, Bacteroidota, Prevotella, Bacillota</desc>
