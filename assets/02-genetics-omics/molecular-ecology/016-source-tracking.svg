<title id="t-source_tracking">源追踪 / Source tracking</title>
<desc id="d-source_tracking">FEAST source tracking: 每个 sink 的各源贡献(含 Unknown)之和为 100%。线宽≈贡献比例。示意。关键词: microbial ecology, source tracking, FEAST, proportional, unknown fraction, Soil, Water, Air</desc>
<g id="l-source_tracking" data-name="source">
<rect x="0.0" y="0.0" width="600.0" height="400.0" fill="#F4F1EA" data-pp="bg"/>
<text x="300.0" y="28.0" font-size="13" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">Source Tracking (FEAST)</text>
<rect x="40.0" y="70.0" width="100.0" height="40.0" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.3" stroke="#2E86AB" stroke-width="1.5" rx="5"/>
<text x="90.0" y="95.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">Soil</text>
