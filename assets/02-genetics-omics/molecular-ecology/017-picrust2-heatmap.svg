  <rect x="220" y="120" width="40" height="40" fill="#2E86AB" fill-opacity="0.5" data-pp="bacteria"/>
  <rect x="100" y="160" width="40" height="40" fill="#2E86AB" fill-opacity="0.5" data-pp="bacteria"/>
