  <title id="t-picrust2_heatmap">PICRUSt2通路 / PICRUSt2 pathways</title>
  <desc id="d-picrust2_heatmap">Predicted functional pathway abundance heatmap。 关键词: microbial ecology, picrust2 heatmap, pathways, Predicted, functional, abundance, Glycolysis</desc>
