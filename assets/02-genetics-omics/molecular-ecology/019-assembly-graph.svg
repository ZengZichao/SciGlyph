<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     class="pp-diagram pp-molecular-ecology" role="img" aria-labelledby="t-assembly_graph d-assembly_graph" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-assembly_graph">组装图 / Assembly graph</title>
  <desc id="d-assembly_graph">De Bruijn 图简化示意：节点为 k-mer(k=3)，边表示 k-1 重叠；ATG 重复位点坍缩为单一节点——CAT 的入边与 TGC/TGA/TGG 三条出边汇聚于同一 ATG 节点，形成分叉，虚线回边表示重复序列的二次经过。关键词: de Bruijn graph, assembly graph, k-mer, contig, tip, repeat collapse</desc>
<g id="l-assembly_graph" data-name="assembly">
  <text x="300" y="30" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">De Bruijn Assembly Graph</text>
  <line x1="200" y1="200" x2="330" y2="120" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="330" y1="120" x2="450" y2="80" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="450" y1="80" x2="555" y2="120" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <line x1="200" y1="200" x2="330" y2="200" stroke="#1B2733" stroke-width="1.5" data-pp="ink"/>
  <line x1="200" y1="200" x2="330" y2="280" stroke="#1B2733" stroke-width="1.5" data-pp="ink"/>
  <line x1="545" y1="133" x2="214" y2="190" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-dasharray="4 3"/>
  <circle cx="200" cy="200" r="18" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1.5"/>
  <circle cx="330" cy="120" r="12" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1.5"/>
  <circle cx="450" cy="80" r="12" fill="#6C3FA0" fill-opacity="0.75" data-pp="gene" stroke="#1B2733" stroke-width="1.5"/>
  <circle cx="555" cy="120" r="12" fill="#6C3FA0" fill-opacity="0.5" data-pp="gene" stroke="#1B2733" stroke-width="1.5"/>
  <circle cx="330" cy="200" r="10" fill="#93A0AC" data-pp="muted" stroke="#1B2733" stroke-width="1"/>
  <circle cx="330" cy="280" r="10" fill="#93A0AC" data-pp="muted" stroke="#1B2733" stroke-width="1"/>
  <text x="200" y="204" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">ATG</text>
  <text x="330" y="124" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">TGC</text>
  <text x="450" y="84" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">GCA</text>
  <text x="555" y="124" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">CAT</text>
  <text x="330" y="204" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">TGA</text>
  <text x="330" y="284" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">TGG</text>
</g>
<g data-name="legend">
  <text x="80" y="318" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">k-mer node</text>
  <circle cx="160" cy="315" r="6" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
  <text x="80" y="342" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">k-1 overlap</text>
  <line x1="160" y1="339" x2="186" y2="339" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
  <text x="230" y="342" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">dashed: repeat re-traversal (ATG collapsed)</text>
</g>
</svg>
