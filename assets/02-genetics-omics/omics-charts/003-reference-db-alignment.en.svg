<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="参考数据库序列比对" data-name-en="Reference Database Alignment" data-cat="05-eco-seq" data-tags="序列比对,数据库,参考序列,一致性,错配" role="img" aria-labelledby="t-29-reference-db-alignment d-29-reference-db-alignment" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-29-reference-db-alignment">Reference Database Alignment</title>
  <desc id="d-29-reference-db-alignment">查询序列与多条数据库参考序列多序列比对，保守区高度一致、变异区出现错配，右侧一致性打分排序候选。关键词: 序列比对, 数据库, 参考序列, 一致性, 错配</desc>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 比对区高亮带 -->
  <rect x="50" y="26" width="42" height="80" fill="#2E7D5B" fill-opacity="0.08" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="3 2"/>
  <!-- 列刻度 -->
  <path d="M8 3 v5 M23 3 v5 M38 3 v5 M53 3 v5 M68 3 v5 M83 3 v5" stroke="#2B3A42" stroke-width="1.2"/>
  <path d="M6 8 H94" stroke="#2B3A42" stroke-width="1.2"/>
  <!-- 查询序列 -->
  <rect x="8" y="18" width="11" height="8" rx="1.5" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <rect x="23" y="18" width="11" height="8" rx="1.5" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <rect x="38" y="18" width="11" height="8" rx="1.5" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <rect x="53" y="18" width="11" height="8" rx="1.5" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <rect x="68" y="18" width="11" height="8" rx="1.5" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <rect x="83" y="18" width="11" height="8" rx="1.5" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <text x="8" y="16" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9" fill="#B57A17" stroke="none">Query</text>
  <!-- 参考序列 1（高相似度） -->
  <rect x="8" y="33" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="23" y="33" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="38" y="33" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="53" y="33" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="68" y="33" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="83" y="33" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <!-- 参考序列 2 -->
  <rect x="8" y="49" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="23" y="49" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="38" y="49" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="53" y="49" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="68" y="49" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="86" y="49" width="8" height="8" rx="1.5" fill="none" stroke="#C0504D" stroke-width="1.2"/>
  <!-- 参考序列 3（错配较多） -->
  <rect x="8" y="65" width="11" height="8" rx="1.5" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 2"/>
  <rect x="23" y="65" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="40" y="65" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="55" y="65" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="70" y="65" width="11" height="8" rx="1.5" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 2"/>
  <rect x="85" y="65" width="9" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <!-- 参考序列 4 -->
  <rect x="8" y="81" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="26" y="81" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="38" y="81" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="53" y="81" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="70" y="81" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="85" y="81" width="9" height="8" rx="1.5" fill="none" stroke="#C0504D" stroke-width="1.2"/>
  <!-- 参考序列 5（低相似度） -->
  <rect x="8" y="97" width="11" height="8" rx="1.5" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 2"/>
  <rect x="23" y="97" width="11" height="8" rx="1.5" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 2"/>
  <rect x="41" y="97" width="11" height="8" rx="1.5" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 2"/>
  <rect x="56" y="97" width="11" height="8" rx="1.5" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="71" y="97" width="11" height="8" rx="1.5" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 2"/>
  <rect x="86" y="97" width="8" height="8" rx="1.5" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- 错配标记 -->
  <path d="M70 41 l4 6 M74 41 l-4 6" stroke="#C0504D" stroke-width="1.4"/>
  <path d="M12 85 l4 6 M16 85 l-4 6" stroke="#C0504D" stroke-width="1.4"/>
  <path d="M74 61 l4 6 M78 61 l-4 6" stroke="#C0504D" stroke-width="1.4"/>
  <!-- 一致性打分 -->
  <rect x="97" y="33" width="16" height="8" rx="1.5" fill="#2E7D5B" stroke="none"/>
  <rect x="97" y="49" width="13" height="8" rx="1.5" fill="#1F6F8B" stroke="none"/>
  <rect x="97" y="65" width="9" height="8" rx="1.5" fill="#7A8B93" stroke="none"/>
  <rect x="97" y="81" width="6" height="8" rx="1.5" fill="#7A8B93" stroke="none"/>
  <rect x="97" y="97" width="3" height="8" rx="1.5" fill="#7A8B93" stroke="none"/>
  <text x="113" y="16" text-anchor="end" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9" fill="#2B3A42" stroke="none">Identity</text>
</g>
</svg>
