  <title id="t-isolation_by_distance">隔离-按-距离 / Isolation by Distance</title>
  <desc id="d-isolation_by_distance">IBD (Rousset 模型): Fst/(1-Fst) 随地理距离增加而上升；随距离衰减的是基因流/遗传相似性。schematic, not to scale. 关键词: IBD, Mantel, Rousset, Fst</desc>
  
