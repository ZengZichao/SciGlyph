<title id="t-selective_sweep">选择性清除 / Selective sweep skyline</title>
<desc id="d-selective_sweep">Genomic-window diversity scan across a selective sweep: nucleotide diversity pi shows a pronounced valley and Tajima's D shifts negative around the selected locus (hard-sweep signature), recovering toward neutral flanking levels. Values are schematic, not empirical. 关键词: selective sweep, nucleotide diversity, Tajima's D, hard sweep, population genomics</desc>
