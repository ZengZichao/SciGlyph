<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t-relaxed_clock d-relaxed_clock" class="pp-diagram pp-population-genomics" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-relaxed_clock">松散分子钟 / Relaxed molecular clock</title>
  <desc id="d-relaxed_clock">分支速率变化的松散分子钟。schematic, not to scale. 关键词: relaxed clock, rate variation</desc>
  
<g data-name="background"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/></g>
<g data-name="tree">
  <line x1="100" y1="200" x2="180" y2="120" stroke="#00857A" stroke-width="2.4" data-pp="metabolism"/>
  <line x1="100" y1="200" x2="180" y2="280" stroke="#E8871E" stroke-width="3.6" data-pp="mge"/>
  <line x1="180" y1="120" x2="300" y2="80" stroke="#00857A" stroke-width="1.8" data-pp="metabolism"/>
  <line x1="180" y1="120" x2="300" y2="160" stroke="#C42D2D" stroke-width="4.8" data-pp="alert"/>
  <line x1="180" y1="280" x2="300" y2="240" stroke="#E8871E" stroke-width="3.0" data-pp="mge"/>
  <line x1="180" y1="280" x2="300" y2="330" stroke="#00857A" stroke-width="1.2" data-pp="metabolism"/>
  <circle cx="180" cy="120" r="4" fill="#1B2733" data-pp="ink"/>
  <circle cx="180" cy="280" r="4" fill="#1B2733" data-pp="ink"/>
  <circle cx="300" cy="80" r="4" fill="#1B2733" data-pp="ink"/>
  <circle cx="300" cy="160" r="4" fill="#1B2733" data-pp="ink"/>
  <circle cx="300" cy="240" r="4" fill="#1B2733" data-pp="ink"/>
  <circle cx="300" cy="330" r="4" fill="#1B2733" data-pp="ink"/>
</g>
<g data-name="legend">
  <text x="450" y="80" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="start" data-pp="ink">Rate (sub/site/My)</text>
  <line x1="450" y1="100" x2="490" y2="100" stroke="#00857A" stroke-width="1.5" data-pp="metabolism"/>
  <text x="500" y="104" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="start" data-pp="ink">slow</text>
  <line x1="450" y1="120" x2="490" y2="120" stroke="#C42D2D" stroke-width="4.5" data-pp="alert"/>
  <text x="500" y="124" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="start" data-pp="ink">fast</text>
<text x="500" y="138" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#E8871E" data-pp="mge">intermediate</text>
</g>
<text x="300" y="30" font-size="13" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Relaxed Molecular Clock — Variable Rates (schematic)</text>
</svg>
