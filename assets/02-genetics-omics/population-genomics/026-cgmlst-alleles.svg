  <rect x="218" y="299" width="15" height="41" fill="#00857A" data-pp="metabolism"/>
  <rect x="237" y="231" width="15" height="109" fill="#E8871E" data-pp="mge"/>
  <rect x="256" y="168" width="15" height="172" fill="#C42D2D" data-pp="alert"/>
  <rect x="275" y="296" width="15" height="44" fill="#00857A" data-pp="metabolism"/>
  <rect x="294" y="316" width="15" height="24" fill="#00857A" data-pp="metabolism"/>
  <rect x="313" y="215" width="15" height="125" fill="#C42D2D" data-pp="alert"/>
  <rect x="332" y="268" width="15" height="72" fill="#E8871E" data-pp="mge"/>
