<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t-cgmlst_alleles d-cgmlst_alleles" class="pp-diagram pp-population-genomics" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-cgmlst_alleles">cgMLST 等位基因数 / cgMLST allele differences</title>
  <desc id="d-cgmlst_alleles">cgMLST等位基因差异条形图。schematic, not to scale. 关键词: cgMLST, alleles, typing</desc>
  
<g data-name="background"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/></g>
<g data-name="axes">
  <line x1="80" y1="340" x2="560" y2="340" stroke="#1B2733" stroke-width="1.5" data-pp="ink"/>
  <text x="320.0" y="365" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Isolate</text>

  <line x1="80" y1="340" x2="80" y2="50" stroke="#1B2733" stroke-width="1.5" data-pp="ink"/>
  <text x="50" y="195" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink" transform="rotate(-90 50 195)">Allele differences</text>

</g>
<g data-name="allele-bars">
  <rect x="85" y="310" width="15" height="30" fill="#00857A" data-pp="metabolism"/>
  <rect x="104" y="223" width="15" height="117" fill="#E8871E" data-pp="mge"/>
  <rect x="123" y="310" width="15" height="30" fill="#00857A" data-pp="metabolism"/>
