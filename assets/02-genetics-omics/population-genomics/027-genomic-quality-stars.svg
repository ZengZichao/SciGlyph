<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t-genomic_quality_stars d-genomic_quality_stars" class="pp-diagram pp-population-genomics" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-genomic_quality_stars">基因组质控刻度 / Genome quality completeness vs contamination</title>
  <desc id="d-genomic_quality_stars">基因组完整性和污染散点。线性坐标 x = 80 + 4.8·completeness(%)、y = 340 − 29·contamination(%)，点色按 High/Medium/Low 分级与阈值线一致。schematic, not to scale. 关键词: quality, completeness, contamination, GTDB</desc>
<g data-name="background"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/></g>
<g data-name="axes">
  <line x1="80" y1="340" x2="560" y2="340" stroke="#1B2733" stroke-width="1.5" data-pp="ink"/>
  <text x="320.0" y="378" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Completeness (%)</text>

  <line x1="80" y1="340" x2="80" y2="50" stroke="#1B2733" stroke-width="1.5" data-pp="ink"/>
  <text x="50" y="195" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink" transform="rotate(-90 50 195)">Contamination (%)</text>

  <line x1="512" y1="340" x2="512" y2="50" stroke="#C42D2D" stroke-width="1" data-pp="alert" stroke-dasharray="4,3" stroke-linecap="round"/>
  <text x="516" y="62" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="start">90%</text>
  <line x1="80" y1="195" x2="560" y2="195" stroke="#C42D2D" stroke-width="1" data-pp="alert" stroke-dasharray="4,3" stroke-linecap="round"/>
  <text x="84" y="190" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="start">5%</text>

  <line x1="76" y1="340" x2="80" y2="340" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="72" y="344" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end">0</text>
  <line x1="76" y1="282" x2="80" y2="282" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="72" y="286" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end">2</text>
  <line x1="76" y1="224" x2="80" y2="224" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="72" y="228" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end">4</text>
  <line x1="76" y1="166" x2="80" y2="166" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="72" y="170" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end">6</text>
  <line x1="76" y1="108" x2="80" y2="108" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="72" y="112" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end">8</text>
  <line x1="76" y1="50" x2="80" y2="50" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="72" y="54" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end">10</text>

  <line x1="152" y1="336" x2="152" y2="344" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="152" y="356" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">15</text>
  <line x1="224" y1="336" x2="224" y2="344" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="224" y="356" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">30</text>
  <line x1="296" y1="336" x2="296" y2="344" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="296" y="356" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">45</text>
  <line x1="368" y1="336" x2="368" y2="344" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="368" y="356" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">60</text>
  <line x1="440" y1="336" x2="440" y2="344" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="440" y="356" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">75</text>
  <line x1="512" y1="336" x2="512" y2="344" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="512" y="356" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="middle">90</text>
</g>
