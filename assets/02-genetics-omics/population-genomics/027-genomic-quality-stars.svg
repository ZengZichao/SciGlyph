<g data-name="legend">
  <circle cx="110" cy="70" r="5" fill="#00857A" data-pp="metabolism"/>
  <text x="122" y="74" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="start" data-pp="ink">High (≥90%, ≤5%)</text>
  <circle cx="110" cy="90" r="5" fill="#E8871E" data-pp="mge"/>
  <text x="122" y="94" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="start" data-pp="ink">Medium (50–89%)</text>
  <circle cx="110" cy="110" r="5" fill="#C42D2D" data-pp="alert"/>
  <text x="122" y="114" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="start" data-pp="ink">Low (&lt;50% or &gt;5%)</text>
</g>
<text x="300" y="30" font-size="13" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Genome Quality — Completeness vs Contamination (schematic)</text>
