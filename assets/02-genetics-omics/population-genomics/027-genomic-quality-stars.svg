  <circle cx="460" cy="90" r="5" fill="#E8871E" data-pp="mge"/>
  <text x="475" y="94" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="start" data-pp="ink">Medium</text>
