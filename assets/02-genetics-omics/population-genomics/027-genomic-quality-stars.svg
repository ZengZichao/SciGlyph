<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t-genomic_quality_stars d-genomic_quality_stars" class="pp-diagram pp-population-genomics" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-genomic_quality_stars">基因组质控刻度 / Genome quality completeness vs contamination</title>
  <desc id="d-genomic_quality_stars">基因组完整性和污染散点。schematic, not to scale. 关键词: quality, completeness, contamination, GTDB</desc>
  
<g data-name="background"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/></g>
<g data-name="axes">
  <line x1="80" y1="340" x2="560" y2="340" stroke="#1B2733" stroke-width="1.5" data-pp="ink"/>
  <text x="320.0" y="378" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink">Completeness (%)</text>

  <line x1="80" y1="340" x2="80" y2="50" stroke="#1B2733" stroke-width="1.5" data-pp="ink"/>
  <text x="50" y="195" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" text-anchor="middle" data-pp="ink" transform="rotate(-90 50 195)">Contamination (%)</text>

  <line x1="512" y1="340" x2="512" y2="50" stroke="#C42D2D" stroke-width="1" data-pp="alert" stroke-dasharray="4,3" stroke-linecap="round"/>
  <text x="516" y="62" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="start">90%</text>
  <line x1="80" y1="195" x2="560" y2="195" stroke="#C42D2D" stroke-width="1" data-pp="alert" stroke-dasharray="4,3" stroke-linecap="round"/>
  <text x="84" y="190" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="start">5%</text>
  <line x1="152" y1="336" x2="152" y2="344" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="152" y="356" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">15</text>
  <line x1="280" y1="336" x2="280" y2="344" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="280" y="356" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">42</text>
  <line x1="400" y1="336" x2="400" y2="344" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="400" y="356" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">67</text>
  <line x1="512" y1="336" x2="512" y2="344" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
  <text x="512" y="372" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="middle">90</text>
</g>
