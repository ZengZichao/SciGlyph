  <title id="t-protein_blosum">蛋白比对 BLOSUM 5 级着色 / Protein BLOSUM 5-Level Coloring</title>
  <desc id="d-protein_blosum">BLOSUM62 分值分 5 级着色蛋白多序列比对：按列多数残基着 Identical(红)；替代打分 ≥+2 着 Strong+(橙，如 I/V=+3、K/R=+2)；+1 着 Weak+(蓝，如 A/S)；−1 着 Negative(浅底，如 A/L=−1)。schematic. 关键词: protein, BLOSUM, alignment, coloring, BLOSUM62</desc>
