<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-sequence-graphics" role="img" aria-labelledby="t-promoter_regions d-promoter_regions" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-promoter_regions">启动子 -10/-35 / Promoter -10/-35 Regions</title>
  <desc id="d-promoter_regions">原核启动子 -35 和 -10 元件示意。关键词: promoter, -10, -35, TATAAT, TTGACA, sigma</desc>
  <defs>
    <marker id="pp16__ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1B2733" data-pp="ink" />
    </marker>
  </defs>
  <g data-name="body">
    <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg" />
    <text x="300" y="28" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">Promoter -10 / -35 Regions</text>
    <line x1="40" y1="160" x2="560" y2="160" stroke="#2E86AB" data-pp="bacteria" stroke-width="3" stroke-linecap="round" />
    <rect x="120" y="135" width="60" height="50" rx="3" fill="#C42D2D" data-pp="alert" stroke="#C42D2D" stroke-width="1.5" />
    <text x="150" y="165" text-anchor="middle" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">TTGACA</text>
    <text x="150" y="125" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">-35</text>
    <text x="270" y="125" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">~17 bp spacer</text>
    <rect x="300" y="135" width="60" height="50" rx="3" fill="#00857A" data-pp="metabolism" stroke="#00857A" stroke-width="1.5" />
    <text x="330" y="165" text-anchor="middle" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">TATAAT</text>
    <text x="330" y="125" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">-10</text>
    <line x1="420" y1="130" x2="420" y2="190" stroke="#6C3FA0" data-pp="gene" stroke-width="2" />
    <text x="420" y="122" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene" font-weight="bold">+1 TSS</text>
    <line x1="430" y1="160" x2="540" y2="160" stroke="#6C3FA0" data-pp="gene" stroke-width="2" marker-end="url(#pp16__ar)" />
    <text x="500" y="150" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">→ transcript</text>
    <text x="220" y="230" text-anchor="middle" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">σ⁷⁰ recognizes -35 &amp; -10</text>
    <path d="M220,215 L150,190" stroke="#93A0AC" data-pp="muted" stroke-width="1" fill="none" stroke-dasharray="3,2" />
    <path d="M220,215 L330,190" stroke="#93A0AC" data-pp="muted" stroke-width="1" fill="none" stroke-dasharray="3,2" />
  </g>
  <g data-name="annotation">
    <circle cx="220" cy="200" r="18" fill="#93A0AC" fill-opacity="0.35" stroke="#93A0AC" stroke-width="1.5" data-pp="muted"/>
    <line x1="40" y1="280" x2="560" y2="280" stroke="#93A0AC" stroke-width="0.5" data-pp="muted" stroke-dasharray="3 2"/>
    <rect x="40" y="300" width="12" height="12" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5"/>
    <rect x="60" y="300" width="12" height="12" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="0.5"/>
    <rect x="80" y="300" width="12" height="12" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5"/>
    <text x="98" y="310" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">-35 / -10 / transcript</text>
    <line x1="150" y1="185" x2="150" y2="200" stroke="#93A0AC" stroke-width="1" data-pp="muted" stroke-dasharray="2 2"/>
  </g>
</svg>
