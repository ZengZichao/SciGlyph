<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-sequence-graphics" role="img" aria-labelledby="t-riboswitch d-riboswitch" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-riboswitch">核糖开关两态构象 / Riboswitch Two-State Conformation</title>
<desc id="d-riboswitch">核糖开关无配体 (ON) 与有配体 (OFF) 两态构象。关键词: riboswitch, aptamer, expression platform, ON OFF</desc>
<defs>
<marker id="pp24__ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#1B2733" data-pp="ink" />
</marker>
</defs>
<g data-name="body"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg" />
<text x="300" y="28" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">Riboswitch: Two-State Conformation</text>
<text x="150" y="60" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism" font-weight="bold">ON (no ligand)</text>
<ellipse cx="150" cy="160" rx="60" ry="50" fill="#2E86AB" data-pp="bacteria" stroke="#2E86AB" stroke-width="1.5" />
<text x="150" y="155" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Aptamer</text>
<text x="150" y="170" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">open</text><rect x="110" y="230" width="80" height="25" rx="3" fill="#00857A" data-pp="metabolism" stroke="#00857A" stroke-width="1" />
<text x="150" y="247" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">RBS exposed</text>
<text x="150" y="280" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism">✓ Translation</text>
<text x="450" y="60" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" font-weight="bold">OFF (ligand bound)</text>
<ellipse cx="450" cy="160" rx="60" ry="50" fill="#C42D2D" data-pp="alert" stroke="#C42D2D" stroke-width="1.5" />
<text x="450" y="150" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Aptamer</text>
<circle cx="450" cy="170" r="8" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1" />
<text x="450" y="174" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">L</text>
<text x="450" y="195" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">conformational change</text><rect x="410" y="230" width="80" height="25" rx="3" fill="#C42D2D" data-pp="alert" stroke="#C42D2D" stroke-width="1" />
<text x="450" y="247" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">RBS hidden</text>
<text x="450" y="280" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">✗ No translation</text>
<line x1="230" y1="160" x2="370" y2="160" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp24__ar)" />
<text x="300" y="150" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">+ ligand</text></g>  <g data-name="annotation">
    <line x1="110" y1="210" x2="110" y2="230" stroke="#2E86AB" stroke-width="1.5" data-pp="bacteria"/>
    <line x1="190" y1="210" x2="190" y2="230" stroke="#2E86AB" stroke-width="1.5" data-pp="bacteria"/>
    <line x1="410" y1="210" x2="410" y2="230" stroke="#C42D2D" stroke-width="1.5" data-pp="alert"/>
    <line x1="490" y1="210" x2="490" y2="230" stroke="#C42D2D" stroke-width="1.5" data-pp="alert"/>
    <rect x="120" y="290" width="60" height="4" fill="#00857A" fill-opacity="0.3" stroke="none" data-pp="metabolism"/>
    <rect x="420" y="290" width="60" height="4" fill="#C42D2D" fill-opacity="0.3" stroke="none" data-pp="alert"/>
    <circle cx="300" cy="160" r="3" fill="#1B2733" data-pp="ink"/>
  </g>
</svg>
