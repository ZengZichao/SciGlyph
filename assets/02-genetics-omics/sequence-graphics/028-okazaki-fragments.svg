<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-sequence-graphics" role="img" aria-labelledby="t-okazaki_fragments d-okazaki_fragments" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-okazaki_fragments">冈崎片段方向 / Okazaki Fragment Direction</title>
<desc id="d-okazaki_fragments">滞后链冈崎片段合成方向与连接。关键词: Okazaki, lagging, fragment, ligase, primer</desc>
<g data-name="body"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg" />
<text x="300" y="28" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">Okazaki Fragments</text><line x1="50" y1="160" x2="550" y2="160" stroke="#2E86AB" data-pp="bacteria" stroke-width="3" stroke-linecap="round" />
<text x="40" y="165" text-anchor="end" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">3′</text>
<text x="555" y="165" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">5′</text>
<text x="300" y="145" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2E86AB" data-pp="bacteria">Template (3′→5′)</text><line x1="80" y1="200" x2="180" y2="200" stroke="#6C3FA0" data-pp="gene" stroke-width="2.5" stroke-linecap="round" /><rect x="80" y="195" width="10" height="10" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.5" />
<text x="130.0" y="218" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">5′→3′</text><line x1="190" y1="200" x2="280" y2="200" stroke="#6C3FA0" data-pp="gene" stroke-width="2.5" stroke-linecap="round" /><rect x="190" y="195" width="10" height="10" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.5" />
<text x="235.0" y="218" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">5′→3′</text><line x1="290" y1="200" x2="390" y2="200" stroke="#6C3FA0" data-pp="gene" stroke-width="2.5" stroke-linecap="round" /><rect x="290" y="195" width="10" height="10" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.5" />
<text x="340.0" y="218" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">5′→3′</text><line x1="400" y1="200" x2="480" y2="200" stroke="#6C3FA0" data-pp="gene" stroke-width="2.5" stroke-linecap="round" /><rect x="400" y="195" width="10" height="10" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.5" />
<text x="440.0" y="218" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">5′→3′</text>
<text x="185.0" y="192" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">ligase</text>
<text x="285.0" y="192" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">ligase</text>
<text x="395.0" y="192" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">ligase</text>
<text x="300" y="245" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Each fragment synthesized 5′→3′ (away from fork)</text>
<rect x="150" y="310" width="14" height="14" fill="#6C3FA0" data-pp="gene" />
<text x="168" y="321" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">DNA fragment</text>
<rect x="300" y="310" width="14" height="14" fill="#E8871E" data-pp="mge" />
<text x="318" y="321" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">RNA primer</text></g>  <g data-name="annotation">
    <line x1="50" y1="270" x2="550" y2="270" stroke="#93A0AC" stroke-width="0.5" data-pp="muted" stroke-dasharray="3 2"/>  </g>
