<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-sequence-graphics" role="img" aria-labelledby="t-holliday_junction d-holliday_junction" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-holliday_junction">Holliday 连接两态 / Holliday Junction Two States</title>
<desc id="d-holliday_junction">Holliday 连接体的形成与分支迁移。关键词: Holliday junction, recombination, branch migration, crossover</desc>
<defs>
<marker id="pp29__ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#1B2733" data-pp="ink" />
</marker>
</defs>
<g data-name="body"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg" />
<text x="300" y="28" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">Holliday Junction</text>
<text x="150" y="60" text-anchor="middle" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">State 1 (open)</text><line x1="70" y1="200" x2="130" y2="200" stroke="#2E86AB" data-pp="bacteria" stroke-width="3" /><line x1="170" y1="200" x2="230" y2="200" stroke="#2E86AB" data-pp="bacteria" stroke-width="3" /><line x1="150" y1="120" x2="150" y2="180" stroke="#6C3FA0" data-pp="gene" stroke-width="3" /><line x1="150" y1="220" x2="150" y2="280" stroke="#6C3FA0" data-pp="gene" stroke-width="3" />
<circle cx="150" cy="200" r="15" fill="#E8871E" data-pp="mge" stroke="#E8871E" stroke-width="1.5" />
<text x="450" y="60" text-anchor="middle" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">State 2 (stacked)</text><line x1="370" y1="180" x2="530" y2="180" stroke="#2E86AB" data-pp="bacteria" stroke-width="3" /><line x1="370" y1="220" x2="530" y2="220" stroke="#6C3FA0" data-pp="gene" stroke-width="3" /><line x1="430" y1="180" x2="430" y2="220" stroke="#00857A" data-pp="metabolism" stroke-width="2" stroke-dasharray="3,2" /><line x1="470" y1="180" x2="470" y2="220" stroke="#00857A" data-pp="metabolism" stroke-width="2" stroke-dasharray="3,2" />
<line x1="250" y1="200" x2="340" y2="200" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp29__ar)" />
<text x="295" y="190" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">branch</text>
<text x="295" y="215" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">migration</text>
<text x="300" y="340" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Exchange → migration → resolve</text></g>  <g data-name="annotation">
    <line x1="100" y1="300" x2="500" y2="300" stroke="#93A0AC" stroke-width="0.5" data-pp="muted" stroke-dasharray="3 2"/>
    <rect x="100" y="310" width="12" height="12" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.5"/>
    <rect x="120" y="310" width="12" height="12" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5"/>
    <text x="138" y="314" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">parental / exchanged duplex</text>
  </g>
</svg>
