<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-sequence-graphics" role="img" aria-labelledby="t-gene_conversion d-gene_conversion" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-gene_conversion">基因转换 / Gene Conversion</title>
<desc id="d-gene_conversion">基因转换：一个等位基因序列被另一等位基因覆盖。关键词: gene conversion, non-reciprocal, recombination</desc>
<defs>
<marker id="pp30__ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#1B2733" data-pp="ink" />
</marker>
</defs>
<g data-name="body"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg" />
<text x="300" y="28" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">Gene Conversion (Non-Reciprocal)</text>
<text x="80" y="70" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Before:</text>
<text x="80" y="90" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Donor:</text><rect x="150" y="78" width="57" height="24" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.5" /><rect x="210" y="78" width="57" height="24" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.5" /><rect x="270" y="78" width="57" height="24" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.5" /><rect x="330" y="78" width="57" height="24" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.5" /><rect x="390" y="78" width="57" height="24" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.5" />
<text x="80" y="125" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Acceptor:</text><rect x="150" y="113" width="57" height="24" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" /><rect x="210" y="113" width="57" height="24" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" /><rect x="270" y="113" width="57" height="24" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" /><rect x="330" y="113" width="57" height="24" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" /><rect x="390" y="113" width="57" height="24" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" />
<line x1="300" y1="155" x2="300" y2="185" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp30__ar)" />
<text x="80" y="210" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">After:</text>
<text x="80" y="230" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Donor:</text><rect x="150" y="218" width="57" height="24" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.5" /><rect x="210" y="218" width="57" height="24" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.5" /><rect x="270" y="218" width="57" height="24" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.5" /><rect x="330" y="218" width="57" height="24" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.5" /><rect x="390" y="218" width="57" height="24" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.5" />
<text x="80" y="265" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Acceptor:</text><rect x="150" y="253" width="57" height="24" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" /><rect x="210" y="253" width="57" height="24" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.5" /><rect x="270" y="253" width="57" height="24" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" /><rect x="330" y="253" width="57" height="24" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" /><rect x="390" y="253" width="57" height="24" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5" /><rect x="208" y="251" width="64" height="28" fill="none" stroke="#C42D2D" data-pp="alert" stroke-width="2" stroke-dasharray="4,2" />
<text x="240" y="295" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">converted</text>
<text x="300" y="350" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Non-reciprocal transfer: acceptor copies donor sequence</text></g></svg>
