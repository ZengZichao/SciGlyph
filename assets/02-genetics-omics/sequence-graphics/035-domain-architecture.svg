<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-sequence-graphics" role="img" aria-labelledby="t-domain_architecture d-domain_architecture" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-domain_architecture">结构域拱形图 / Domain Architecture (InterPro-style)</title>
<desc id="d-domain_architecture">N 端在左、C 端在右；Protein C 为 I 型单次跨膜受体(ECD→TM→ICD)。蛋白结构域拱形图。关键词: domain, architecture, InterPro, Pfam, protein</desc>
