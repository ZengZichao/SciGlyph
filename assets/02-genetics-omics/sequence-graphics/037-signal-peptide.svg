<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-sequence-graphics" role="img" aria-labelledby="t-signal_peptide d-signal_peptide" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-signal_peptide">信号肽切割位点 / Signal Peptide Cleavage Site</title>
<desc id="d-signal_peptide">信号肽 n-region, h-region, c-region 与切割位点。关键词: signal peptide, cleavage, Sec, secretion</desc>
<defs>
<marker id="pp37__ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#1B2733" data-pp="ink" />
</marker>
</defs>
<g data-name="body"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg" />
<text x="300" y="28" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">Signal Peptide Cleavage</text><rect x="80" y="125" width="60" height="30" rx="3" fill="#C42D2D" data-pp="alert" stroke="#C42D2D" stroke-width="1.5" />
