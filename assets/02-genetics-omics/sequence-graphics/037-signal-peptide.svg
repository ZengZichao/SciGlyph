<text x="110" y="118" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">(charged)</text><rect x="140" y="125" width="100" height="30" rx="3" fill="#00857A" data-pp="metabolism" stroke="#00857A" stroke-width="1.5" />
<text x="190" y="144" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">h-region</text><rect x="240" y="125" width="60" height="30" rx="3" fill="#2E86AB" data-pp="bacteria" stroke="#2E86AB" stroke-width="1.5" />
<text x="270" y="144" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">c-reg</text>
<line x1="305" y1="115" x2="305" y2="165" stroke="#C42D2D" data-pp="alert" stroke-width="2" stroke-dasharray="4,2" />
<text x="305" y="108" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">↓ cleavage</text><rect x="310" y="125" width="200" height="30" rx="3" fill="#6C3FA0" data-pp="gene" stroke="#6C3FA0" stroke-width="1.5" />
<text x="410" y="144" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">Mature protein</text>
<line x1="300" y1="185" x2="300" y2="220" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp37__ar)" />
<text x="130" y="250" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Signal peptide</text>
<text x="130" y="270" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">(degraded)</text>
<text x="420" y="250" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">Mature protein</text>
<text x="420" y="270" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">(secreted / membrane)</text>
<text x="300" y="340" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">(−3, −1) rule: small residues at −3 and −1 (Ala-X-Ala↓)</text></g>  <g data-name="annotation">
