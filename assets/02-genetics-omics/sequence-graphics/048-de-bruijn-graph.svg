<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-sequence-graphics" role="img" aria-labelledby="t-de_bruijn_graph d-de_bruijn_graph" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-de_bruijn_graph">De Bruijn 拼接图 / De Bruijn Graph Assembly</title>
<desc id="d-de_bruijn_graph">De Bruijn 图简化示意：以 k=3 把读段切成 k-mer 节点，边表示 (k-1)-mer 重叠。图中 ATG→ATC 之间存在两条平行路径（ATG-TGC-GCA-CAT-ATC 与 ATG-TGG-GGA-GAT-ATC），对应一个杂合位点造成的 bubble；实线为唯一连接，虚线圆框标出泡状分支。所有边均满足 u[1:]==v[:-1]，同一 k-mer 只出现一个节点。schematic, not to scale。关键词: De Bruijn, graph, assembly, k-mer, contig, bubble</desc>
<defs>
<marker id="pp48__ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#1B2733" data-pp="ink" />
</marker>
</defs>
<g data-name="body"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg" />
<text x="300" y="28" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">De Bruijn Graph (k=3)</text>
<text x="300" y="46" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">reads ATGCATC / ATGGATC</text></g>
<g data-name="edges">
<line x1="102" y1="192" x2="178" y2="128" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5" marker-end="url(#pp48__ar)" />
<line x1="222" y1="120" x2="298" y2="120" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5" marker-end="url(#pp48__ar)" />
<line x1="342" y1="120" x2="418" y2="120" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5" marker-end="url(#pp48__ar)" />
<line x1="462" y1="128" x2="518" y2="192" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5" marker-end="url(#pp48__ar)" />
<line x1="102" y1="208" x2="178" y2="272" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5" marker-end="url(#pp48__ar)" />
<line x1="222" y1="280" x2="298" y2="280" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5" marker-end="url(#pp48__ar)" />
<line x1="342" y1="280" x2="418" y2="280" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5" marker-end="url(#pp48__ar)" />
<line x1="462" y1="272" x2="518" y2="208" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5" marker-end="url(#pp48__ar)" />
</g>
<g data-name="nodes">
<circle cx="80" cy="200" r="22" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5" />
<text x="80" y="204" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ATG</text>
<circle cx="200" cy="120" r="22" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5" />
<text x="200" y="124" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">TGC</text>
<circle cx="320" cy="120" r="22" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5" />
<text x="320" y="124" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">GCA</text>
<circle cx="440" cy="120" r="22" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5" />
<text x="440" y="124" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">CAT</text>
<circle cx="200" cy="280" r="22" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5" />
<text x="200" y="284" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">TGG</text>
<circle cx="320" cy="280" r="22" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5" />
<text x="320" y="284" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">GGA</text>
<circle cx="440" cy="280" r="22" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5" />
<text x="440" y="284" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">GAT</text>
<circle cx="540" cy="200" r="22" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5" />
<text x="540" y="204" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ATC</text>
</g>
<g data-name="annotation">
<ellipse cx="320" cy="200" rx="150" ry="112" fill="none" stroke="#C42D2D" data-pp="alert" stroke-width="1" stroke-dasharray="4,3" />
<text x="320" y="336" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">bubble (heterozygous site)</text>
<text x="300" y="362" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Nodes = k-mers, Edges = (k-1)-mer overlap</text>
<text x="300" y="380" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Eulerian path through graph → assembled contig</text>
</g>
</svg>
