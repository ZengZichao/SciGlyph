<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-sequence-graphics" role="img" aria-labelledby="t-annotation_track d-annotation_track" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-annotation_track">注释轨道 / Annotation Track (Functional Categories)</title>
<desc id="d-annotation_track">功能类别色条注释轨道(示意,基因长度与位置为示例数据,不按真实坐标缩放)。色条颜色表示注释的功能类别,遵循语义配色:metabolism=代谢、gene=信息加工与调控、mge=移动元件、alert=毒力与耐药、host=表面与分泌、muted=未知功能;此处不使用域色(bacteria/archaea/virus)。关键词: annotation, functional category, COG, color bar, genome browser, gene call</desc>
