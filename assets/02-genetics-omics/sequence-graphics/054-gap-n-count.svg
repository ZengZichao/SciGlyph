<text x="395.0" y="124" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">N×30</text><rect x="460" y="110" width="20" height="20" fill="#C42D2D" data-pp="alert" stroke="#C42D2D" stroke-width="1" />
<text x="470.0" y="124" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">N×20</text>
<text x="60" y="195" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Gap sizes:</text><line x1="100" y1="320" x2="500" y2="320" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round" />
