<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-sequence-graphics" role="img" aria-labelledby="t-gap_n_count d-gap_n_count" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-gap_n_count">Gap N 计数 / Gap N Count Along Scaffold</title>
<desc id="d-gap_n_count">Gap 大小按左闭右开 [a,b) 分箱。Scaffold 中 gap N 的位置与大小计数。gap 数目与 N 碱基总数为示例值(示意)。关键词: gap, N, scaffold, assembly, N-count</desc>
<g data-name="body"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg" />
<text x="300" y="28" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">Gap N Count Along Scaffold</text><rect x="60" y="110" width="480" height="20" rx="3" fill="#2E86AB" data-pp="bacteria" stroke="#2E86AB" stroke-width="1" />
<text x="50" y="125" text-anchor="end" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">scaffold</text><rect x="120" y="110" width="15" height="20" fill="#C42D2D" data-pp="alert" stroke="#C42D2D" stroke-width="1" />
<text x="127.5" y="124" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">N×15</text><rect x="200" y="110" width="50" height="20" fill="#C42D2D" data-pp="alert" stroke="#C42D2D" stroke-width="1" />
<text x="225.0" y="124" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">N×50</text><rect x="300" y="110" width="10" height="20" fill="#C42D2D" data-pp="alert" stroke="#C42D2D" stroke-width="1" />
