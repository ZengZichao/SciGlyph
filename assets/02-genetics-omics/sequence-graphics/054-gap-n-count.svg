<text x="250.0" y="335" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">25-50</text><rect x="200.0" y="280.0" width="100.0" height="40" fill="#E8871E" data-pp="mge" fill-opacity="0.7" stroke="#1B2733" stroke-width="0.5" />
