<text x="70" y="260.0" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" transform="rotate(-90,70,260.0)">Count</text>
<text x="120.0" y="335" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">0-10</text>
