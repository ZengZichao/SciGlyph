  <title id="t-16_substrate_level_p">底物水平磷酸化 / Substrate-Level Phosphorylation</title>
  <desc id="d-16_substrate_level_p">直接由底物高能键驱动ADP→ATP，不依赖膜电位。发酵与糖酵解共有。关键词: SLP, kinase</desc>
  <defs>
    <marker id="pp16__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
        <rect x="8" y="35" width="20" height="14" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="18.0" y="43.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">P~X</text>
        <rect x="40" y="35" width="18" height="14" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <text x="49.0" y="43.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ADP</text>
        <rect x="70" y="35" width="18" height="14" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="79.0" y="43.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ATP</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
        <line x1="28" y1="42" x2="40" y2="42" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp16__ar)"/>
        <line x1="58" y1="42" x2="70" y2="42" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp16__ar)"/>
    <text x="34" y="30" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">kinase</text>
    <text x="50" y="70" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">direct P transfer</text>
  </g>
</svg>