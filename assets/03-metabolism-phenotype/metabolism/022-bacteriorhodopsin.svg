        <rect x="38" y="47" width="24" height="26" rx="1" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="1"/>
    <text x="50.0" y="61.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">bR</text>
        <circle cx="50" cy="30" r="6" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <text x="50" y="31.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ret</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
