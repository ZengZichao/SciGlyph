  <title id="t-22_bacteriorhodopsin">紫膜视紫红质 / Bacteriorhodopsin</title>
  <desc id="d-22_bacteriorhodopsin">嗜盐古菌光驱动质子泵。视黄醛发色团吸收绿光→异构化→泵H⁺出胞→PMF→ATP。关键词: bacteriorhodopsin, retinal, proton pump, Halobacterium</desc>
