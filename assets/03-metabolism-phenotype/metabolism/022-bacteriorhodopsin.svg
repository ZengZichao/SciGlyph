    <line x1="67" y1="70" x2="67" y2="38" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp22__ar)"/>
    <text x="70" y="55" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">H⁺</text>
