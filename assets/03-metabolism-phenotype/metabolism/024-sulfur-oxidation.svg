  <title id="t-24_sulfur_oxidation">硫氧化 / Sulfur Oxidation</title>
  <desc id="d-24_sulfur_oxidation">还原态硫→S⁰→SO₃²⁻→SO₄²⁻。Sox系统(直接氧化)与逆向APS途径(SO₃²⁻+AMP→APS→SO₄²⁻+ATP)。典型菌: Thiobacillus, Beggiatoa。关键词: sox, aps, sulfur oxidation</desc>
