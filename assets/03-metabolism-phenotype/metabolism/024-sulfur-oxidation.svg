        <circle cx="35" cy="50" r="7" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="35" y="51.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">S⁰</text>
