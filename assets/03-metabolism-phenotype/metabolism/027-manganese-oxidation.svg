  <desc id="d-27_manganese_oxidation">Mn²⁺→Mn³⁺/Mn⁴⁺氧化物。典型菌: Pseudomonas, Bacillus, Leptothrix。多铜氧化酶MnxG。关键词: manganese oxidation, Mn2+, MnxG</desc>
