  <desc id="d-28_arsenic_respiration">呼吸型As(V)还原(arrA，产能)或As(III)氧化(aio/aro)；arsC/arsA为脱毒模块(不产能)。厌氧呼吸以As(V)为电子受体。关键词: arsenic, arrA, aio, arsC, arsenate respiration</desc>
