  <title id="t-30_reverse_tca">还原性TCA循环 / Reverse TCA Cycle</title>
  <desc id="d-30_reverse_tca">与好氧TCA方向相反，固定CO₂。ATP-柠檬酸裂解酶驱动。见于绿硫细菌、Campylobacterota（旧称 ε-变形菌/Epsilonproteobacteria）等。关键词: rTCA, reverse TCA, CO2 fixation, ATP-citrate lyase</desc>
