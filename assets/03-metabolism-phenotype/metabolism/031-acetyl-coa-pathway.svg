  <title id="t-31_acetyl_coa_pathway">乙酰-CoA/WL途径 / Wood-Ljungdahl Pathway</title>
  <desc id="d-31_acetyl_coa_pathway">乙酰-CoA/Wood-Ljungdahl途径。产甲烷与产乙酸共用。东部=甲基支路(CO₂→CH₃)，西部=羰基支路(CO₂→CO)，合并为乙酰-CoA。关键词: Wood-Ljungdahl, acetyl-CoA, CODH, ACS</desc>
