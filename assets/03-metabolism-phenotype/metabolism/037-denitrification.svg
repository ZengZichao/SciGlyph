<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-metabolism" role="img" aria-labelledby="t-37_denitrification d-37_denitrification" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-37_denitrification">反硝化 / Denitrification</title>
  <desc id="d-37_denitrification">NO₃⁻→NO₂⁻→NO→N₂O→N₂。Nar-Nir-Nor-Nos四步还原。Pseudomonas, Paracoccus。关键词: denitrification, Nar, Nir, Nor, Nos, N2O</desc>
  <defs>
    <marker id="pp37__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
    <text x="50" y="22" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">e⁻ donor: organic C</text>
        <circle cx="10" cy="55" r="6.5" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="10" y="41" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">NO₃⁻</text>
        <circle cx="30" cy="55" r="6.5" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="30" y="41" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">NO₂⁻</text>
        <circle cx="50" cy="55" r="6.5" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="50" y="41" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">NO</text>
        <circle cx="70" cy="55" r="6.5" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="70" y="41" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">N₂O</text>
        <circle cx="90" cy="55" r="6.5" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <text x="90" y="41" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">N₂</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
        <line x1="17" y1="55" x2="23" y2="55" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp37__ar)"/>
        <line x1="37" y1="55" x2="43" y2="55" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp37__ar)"/>
        <line x1="57" y1="55" x2="63" y2="55" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp37__ar)"/>
        <line x1="77" y1="55" x2="83" y2="55" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp37__ar)"/>
    <text x="20" y="72" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Nar</text>
    <text x="40" y="72" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Nir</text>
