<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-metabolism" role="img" aria-labelledby="t-38_dnra d-38_dnra" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-38_dnra">DNRA / DNRA (Dissimilatory Nitrate Reduction to Ammonium)</title>
  <desc id="d-38_dnra">异化硝酸盐还原为铵。NO₃⁻→NO₂⁻→NH₄⁺。NrfA五血红素(pentaheme)细胞色素c552。与反硝化竞争。关键词: DNRA, NrfA, ammonification, NO3 to NH4</desc>
  <defs>
    <marker id="pp38__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
        <circle cx="15" cy="50" r="7.5" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="15" y="36" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">NO₃⁻</text>
        <circle cx="50" cy="50" r="7.5" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="50" y="36" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">NO₂⁻</text>
        <circle cx="85" cy="50" r="7.5" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="85" y="36" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">NH₄⁺</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
        <line x1="23" y1="50" x2="42" y2="50" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp38__ar)"/>
        <line x1="58" y1="50" x2="77" y2="50" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp38__ar)"/>
    <text x="32.5" y="66" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Nar/Nap</text>
    <text x="67.5" y="66" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">NrfA</text>
    <text x="50" y="80" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">6e⁻ reduction</text>
    <text x="50" y="90" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">N retained (no N₂ loss)</text>
  </g>
</svg>
