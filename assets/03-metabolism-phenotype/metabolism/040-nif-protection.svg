  <title id="t-40_nif_protection">固氮酶保护 / Nitrogenase O₂ Protection</title>
  <desc id="d-40_nif_protection">三种策略: 异形胞(物理分隔)、时间分隔(夜间固氮)、呼吸保护(高呼吸速率耗氧)。关键词: heterocyst, temporal separation, respiratory protection</desc>
  <g id="layer-body" data-name="body">
        <circle cx="20" cy="30" r="10" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <circle cx="20" cy="30" r="6" fill="#00857A" data-pp="metabolism"/>
        <circle cx="50" cy="30" r="10" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <text x="50" y="32" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">night</text>
        <circle cx="80" cy="30" r="10" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <circle cx="80" cy="30" r="5" fill="#C42D2D" data-pp="alert" fill-opacity="0.4"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="22.2" y="50.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">heterocyst</text>
    <line x1="50.0" y1="47.9" x2="53.47" y2="54.46" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="54.88" y="57.55" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">temporal</text>
    <text x="74.22" y="49.01" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">respiratory</text>
    <text x="50" y="73" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">3 O₂ protection</text>
    <text x="50" y="81" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">strategies</text>
    <text x="50" y="89" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">for nitrogenase</text>
