<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-metabolism" role="img" aria-labelledby="t-42_anaerobic_methane_ox d-42_anaerobic_methane_ox" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-42_anaerobic_methane_ox">厌氧甲烷氧化 / Anaerobic Methane Oxidation (AOM)</title>
  <desc id="d-42_anaerobic_methane_ox">ANME古菌+SRB互营。DIET(直接种间电子传递)通过多血红素细胞色素。CH₄+SO₄²⁻→HCO₃⁻+HS⁻+H₂O。关键词: AOM, ANME, DIET, syntrophy</desc>
  <g id="layer-body" data-name="body">
    <text x="50" y="20" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">AOM: CH₄ + SO₄²⁻</text>
        <circle cx="24" cy="42" r="11.5" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="1"/>
    <text x="24" y="44.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">ANME</text>
        <circle cx="72" cy="42" r="11.5" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <text x="72" y="44.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">SRB</text>
    <line x1="36" y1="42" x2="60" y2="42" stroke="#E8871E" data-pp="mge" stroke-width="2" stroke-dasharray="2,1"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="48" y="36" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">e⁻</text>
    <text x="24" y="62" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">CH₄ → CO₂</text>
    <text x="72" y="62" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">SO₄²⁻ → HS</text>
    <text x="48" y="76" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">DIET / cytochromes</text>
    <text x="48" y="86" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">syntrophic consortium</text>
    <text x="48" y="95" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">anoxic sediments</text>
  </g>
</svg>
