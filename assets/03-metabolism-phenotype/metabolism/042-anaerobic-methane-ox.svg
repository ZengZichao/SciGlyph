<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-metabolism" role="img" aria-labelledby="t-42_anaerobic_methane_ox d-42_anaerobic_methane_ox" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-42_anaerobic_methane_ox">厌氧甲烷氧化 / Anaerobic Methane Oxidation (AOM)</title>
  <desc id="d-42_anaerobic_methane_ox">ANME古菌+SRB互营。DIET(直接种间电子传递)通过多血红素细胞色素。CH₄+SO₄²⁻→HCO₃⁻+HS⁻+H₂O。关键词: AOM, ANME, DIET, syntrophy</desc>
  <g id="layer-body" data-name="body">
        <circle cx="20" cy="40" r="10" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="1"/>
    <text x="20" y="41.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ANME</text>
        <circle cx="65" cy="40" r="10" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <text x="65" y="41.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">SRB</text>
    <line x1="30" y1="40" x2="55" y2="40" stroke="#E8871E" data-pp="mge" stroke-width="2" stroke-dasharray="2,1"/>
      <circle cx="10" cy="28" r="3" fill="#F4F1EA" data-pp="bg" stroke="#93A0AC" stroke-width="0.5"/>
    <circle cx="75" cy="28" r="3" fill="#F4F1EA" data-pp="bg" stroke="#93A0AC" stroke-width="0.5"/>
    <line x1="30" y1="45" x2="55" y2="45" stroke="#00857A" data-pp="metabolism" stroke-width="0.8" stroke-dasharray="1,1"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="42" y="35" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">e⁻</text>
    <text x="20" y="60" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">CH₄→CO₂</text>
    <text x="65" y="60" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">SO₄²⁻→HS⁻</text>
    <text x="42" y="75" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">DIET / cytochromes</text>
    <text x="42" y="88" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">consortium</text>
  </g>
</svg>