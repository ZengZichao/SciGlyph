  <title id="t-44_siderophore">铁载体摄取 / Siderophore Uptake</title>
  <desc id="d-44_siderophore">铁载体(肠杆菌素enterobactin/ferrioxamine)螯合Fe³⁺。外膜经TonB依赖性受体TBDT(如FepA/FhuA)，内膜经ABC转运体。关键词: siderophore, enterobactin, TonB, TBDT, ABC transporter, iron</desc>
  <g id="layer-body" data-name="body">
        <line x1="5" y1="55" x2="95" y2="55" stroke="#00857A" data-pp="metabolism" stroke-width="1.5"/>
    <line x1="5" y1="75" x2="95" y2="75" stroke="#00857A" data-pp="metabolism" stroke-width="1.5"/>
        <rect x="35" y="57" width="20" height="15" rx="1" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <text x="45.0" y="66.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">TBDT</text>
        <rect x="35" y="77" width="20" height="10" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="45.0" y="83.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ABC</text>
        <rect x="60" y="57" width="12" height="15" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="66.0" y="66.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">TonB</text>
        <circle cx="20" cy="35" r="8" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="20" y="36.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Fe³⁺</text>
    <path d="M20,43 Q30,50 45,57" fill="none" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
  </g>
