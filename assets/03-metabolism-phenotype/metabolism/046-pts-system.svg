<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-metabolism" role="img" aria-labelledby="t-46_pts_system d-46_pts_system" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-46_pts_system">PTS糖摄取 / PTS (Phosphotransferase System)</title>
  <desc id="d-46_pts_system">磷酸转移酶系统(PTS)。PEP→EnzI→HPr→EII→糖-P。糖摄取同时磷酸化。关键词: PTS, phosphotransferase, PEP, EnzI, HPr, EII, sugar uptake</desc>
  <defs>
    <marker id="pp46__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
        <line x1="5" y1="60" x2="95" y2="60" stroke="#00857A" data-pp="metabolism" stroke-width="1.5"/>
    <line x1="5" y1="75" x2="95" y2="75" stroke="#00857A" data-pp="metabolism" stroke-width="1.5"/>
        <rect x="8" y="28" width="20" height="14" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="18" y="38" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">EnzI</text>
        <rect x="34" y="28" width="18" height="14" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="43" y="38" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">HPr</text>
        <rect x="44" y="56" width="18" height="23" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="53" y="69.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">EII</text>
        <circle cx="84" cy="88" r="7" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="56" y="90" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">sugar</text>
    <text x="72" y="42" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">sugar-P</text>
    <text x="6" y="50" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">cytoplasm</text>
    <text x="6" y="70" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">periplasm</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="8" y="20" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">PEP → P</text>
        <line x1="18" y1="23" x2="18" y2="27" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp46__ar)"/>
        <line x1="28" y1="35" x2="34" y2="35" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp46__ar)"/>
        <line x1="43" y1="42" x2="50" y2="55" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp46__ar)"/>
        <line x1="78" y1="84" x2="64" y2="74" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp46__ar)"/>
        <line x1="58" y1="56" x2="66" y2="46" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp46__ar)"/>
  </g>
</svg>
