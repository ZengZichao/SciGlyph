<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-metabolism" role="img" aria-labelledby="t-46_pts_system d-46_pts_system" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-46_pts_system">PTS糖摄取 / PTS (Phosphotransferase System)</title>
  <desc id="d-46_pts_system">磷酸转移酶系统(PTS)。PEP→EnzI→HPr→EII→糖-P。糖摄取同时磷酸化。关键词: PTS, phosphotransferase, PEP, EnzI, HPr, EII, sugar uptake</desc>
  <defs>
    <marker id="pp46__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
        <line x1="5" y1="60" x2="95" y2="60" stroke="#00857A" data-pp="metabolism" stroke-width="1.5"/>
    <line x1="5" y1="75" x2="95" y2="75" stroke="#00857A" data-pp="metabolism" stroke-width="1.5"/>
        <rect x="10" y="30" width="12" height="10" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="16.0" y="36.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">EnzI</text>
        <rect x="28" y="30" width="10" height="10" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="33.0" y="36.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">HPr</text>
        <rect x="44" y="62" width="14" height="10" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="51.0" y="68.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">EII</text>
        <circle cx="80" cy="44" r="7" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="80" y="45.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">sug-P</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
        <line x1="22" y1="35" x2="28" y2="35" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp46__ar)"/>
        <line x1="38" y1="35" x2="51" y2="61" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp46__ar)"/>
        <line x1="58" y1="65" x2="72" y2="50" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp46__ar)"/>
    <text x="10" y="22" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">PEP→P</text>
    <text x="50" y="90" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">P~transfer → sugar-P</text>
  </g>
</svg>