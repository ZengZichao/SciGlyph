<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-metabolism" role="img" aria-labelledby="t-47_pmf_atp_synthase d-47_pmf_atp_synthase" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-47_pmf_atp_synthase">质子动力势PMF / Proton Motive Force (PMF)</title>
  <desc id="d-47_pmf_atp_synthase">跨膜质子动力势Δp=Δψ-2.3RT/F·ΔpH。Δψ(膜电位)+ΔpH(化学梯度)。驱动ATP合酶、鞭毛、转运。关键词: PMF, proton motive force, ΔpH, Δψ, chemiosmosis</desc>
  <defs>
    <marker id="pp47__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
        <line x1="5" y1="45" x2="95" y2="45" stroke="#00857A" data-pp="metabolism" stroke-width="1.5"/>
    <line x1="5" y1="65" x2="95" y2="65" stroke="#00857A" data-pp="metabolism" stroke-width="1.5"/>
    <text x="50" y="32" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">H⁺ (periplasm)</text>
    <text x="50" y="80" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">H⁺ (cytoplasm)</text>
        <rect x="38" y="47" width="24" height="16" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="50" y="56.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">F₀F₁</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
        <line x1="50" y1="36" x2="50" y2="46" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp47__ar)"/>
        <line x1="50" y1="63" x2="50" y2="72" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp47__ar)"/>
        <line x1="62" y1="55" x2="67" y2="55" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp47__ar)"/>
    <text x="69" y="57.5" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ATP</text>
    <text x="12" y="58" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">ΔpH</text>
    <text x="85" y="58" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">Δψ</text>
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Δp = Δψ − 2.3RT/F·ΔpH</text>
  </g>
</svg>
