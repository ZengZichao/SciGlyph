  <title id="t-48_carboxysome">羧酶体 / Carboxysome</title>
  <desc id="d-48_carboxysome">蛋白质外壳包裹的CO₂固定微区室。内部富含RuBisCO+碳酸酐酶。提高局部CO₂浓度。α/β两种类型。关键词: carboxysome, RuBisCO, BMC, CO2 concentrating</desc>
