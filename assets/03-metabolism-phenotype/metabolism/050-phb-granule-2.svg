    <circle cx="60" cy="48" r="8" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <path d="M54,45 Q57,43 60,45 Q63,47 66,45" fill="none" stroke="#1B2733" data-pp="ink" stroke-width="0.5"/>
    <circle cx="48" cy="58" r="6" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <path d="M35,30 Q30,25 25,30" fill="none" stroke="#00857A" data-pp="metabolism" stroke-width="1"/>
