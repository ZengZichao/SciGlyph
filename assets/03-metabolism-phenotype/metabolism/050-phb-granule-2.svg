  <title id="t-50_phb_granule">PHB颗粒 / PHB Granule (Poly-β-hydroxybutyrate)</title>
  <desc id="d-50_phb_granule">聚-β-羟基丁酸(PHB)碳源/能源储存颗粒。磷脂单层膜包裹。PhaC(合酶；PhaA/PhaB为上游合成步骤)/PhaZ(降解)。关键词: PHB, polyhydroxybutyrate, carbon storage, granule, inclusion</desc>
