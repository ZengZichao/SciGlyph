<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-metabolism" role="img" aria-labelledby="t-53_alkaliphile d-53_alkaliphile" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-53_alkaliphile">耐碱适应 / Alkaliphile Adaptation</title>
  <desc id="d-53_alkaliphile">Na⁺/H⁺反向转运体维持胞内pH约8(较外环境低约1.5-2.5单位)。胞外pH 10-11。Na⁺循环代替H⁺循环。关键词: alkaliphile, Na+/H+ antiporter, sodium cycle, pH homeostasis</desc>
  <defs>
    <marker id="pp53__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
        <line x1="5" y1="45" x2="95" y2="45" stroke="#00857A" data-pp="metabolism" stroke-width="1.5"/>
    <line x1="5" y1="65" x2="95" y2="65" stroke="#00857A" data-pp="metabolism" stroke-width="1.5"/>
        <rect x="38" y="47" width="22" height="16" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="49.0" y="56.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Na⁺/H⁺</text>
    <text x="50" y="30" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#A2305B" data-pp="archaea">pH 10+</text>
    <text x="50" y="80" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">pH ~8</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
        <line x1="35" y1="55" x2="35" y2="38" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp53__ar)"/>
        <line x1="65" y1="38" x2="65" y2="55" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp53__ar)"/>
    <text x="20" y="42" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Na⁺</text>
    <text x="75" y="42" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">H⁺</text>
    <text text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" font-size="7" x="28.71" y="92.0">Na⁺ cycle, pH</text><text text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" font-size="7" x="29.38" y="72.92">homeostasis</text>
  </g>
</svg>