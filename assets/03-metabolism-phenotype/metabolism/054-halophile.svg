<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-metabolism" role="img" aria-labelledby="t-54_halophile d-54_halophile" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-54_halophile">耐盐适应 / Halophile (Compatible Solutes)</title>
  <desc id="d-54_halophile">两条策略: 盐进(K⁺/KCl 积累, Halobacteriota)或相容性溶质(甜菜碱 glycine betaine、ectoine)。防止渗透脱水。关键词: halophile, compatible solutes, glycine betaine, ectoine, osmoprotection</desc>
  <g id="layer-body" data-name="body">
    <ellipse cx="50" cy="50" rx="30" ry="20" fill="#F4F1EA" data-pp="bg" stroke="#A2305B" stroke-width="1.5"/>
        <circle cx="35" cy="45" r="5" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="35" y="46.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ect</text>
        <circle cx="50" cy="55" r="5" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="50" y="56.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">bet</text>
        <circle cx="65" cy="45" r="5" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="65" y="46.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">K⁺</text>
      <circle cx="15" cy="35" r="2" fill="#C42D2D" data-pp="alert"/>
    <circle cx="85" cy="55" r="2" fill="#C42D2D" data-pp="alert"/>
    <circle cx="85" cy="35" r="2" fill="#C42D2D" data-pp="alert"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="15" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">high NaCl</text>
    <text x="50" y="82" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">compatible solutes</text>
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">ectoine, betaine, K⁺</text>
  </g>
</svg>