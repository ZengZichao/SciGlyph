  <title id="t-56_psychrophile">冷适应 / Psychrophile (Cold Adaptation)</title>
  <desc id="d-56_psychrophile">冷适应: 抗冻蛋白(AFP)、冷激蛋白(Csp)、不饱和脂肪酸增加膜流动性、冷活性酶(柔性结构)。图中标注的温度界限因生境与菌株而异, 为示意值。关键词: psychrophile, antifreeze, cold shock protein, unsaturated FA</desc>
  <g id="layer-body" data-name="body">
        <rect x="10" y="30" width="18" height="12" rx="1" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
    <text x="19.0" y="37.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">AFP</text>
        <rect x="33" y="30" width="18" height="12" rx="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
    <text x="42.0" y="37.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">Csp</text>
        <rect x="56" y="30" width="18" height="12" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="65.0" y="37.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">UFA</text>
        <rect x="79" y="30" width="14" height="12" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
    <text x="86.0" y="37.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">cold E</text>
      <line x1="50" y1="58" x2="50" y2="65" stroke="#3F8FBF" data-pp="eukaryote" stroke-width="1"/>
    <line x1="46" y1="61" x2="54" y2="61" stroke="#3F8FBF" data-pp="eukaryote" stroke-width="1"/>
    <line x1="47" y1="58" x2="53" y2="65" stroke="#3F8FBF" data-pp="eukaryote" stroke-width="0.8"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="72" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#3F8FBF" data-pp="eukaryote">&lt;15°C</text>
    <text x="50" y="90" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">cold-active enzymes</text>
  </g>
