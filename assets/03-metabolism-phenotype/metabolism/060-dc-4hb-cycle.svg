  <title id="t-60_dc_4hb_cycle">DC/4-HB循环 / DC/4-Hydroxybutyrate Cycle</title>
  <desc id="d-60_dc_4hb_cycle">二羧酸/4-羟基丁酸(DC/4-HB)循环。见于 Thermoproteales 与 Desulfurococcales(Thermoproteota, 旧称 Crenarchaeota)；Sulfolobales 走 3-HP/4-HB 循环。注: Caldicellulosiruptor 为异养菌，其 CO₂ 同化经 PFOR 等羧化反应(非自养循环)。乙酰-CoA+2CO₂→4-HB。关键词: DC/4-HB cycle, Thermoproteota, 4-hydroxybutyrate, Thermoproteales</desc>
  <defs>
    <marker id="pp60__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
