        <circle cx="50.0" cy="25.0" r="8" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1"/>
    <text x="50.0" y="26.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">AcCoA</text>
