        <circle cx="71.65063509461098" cy="62.5" r="8" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1"/>
    <text x="71.65063509461098" y="64.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">SucCoA</text>
        <circle cx="50.0" cy="75.0" r="8" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1"/>
    <text x="50.0" y="76.5" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">4HB</text>
