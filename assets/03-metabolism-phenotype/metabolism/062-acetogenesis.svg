  <title id="t-62_acetogenesis">产乙酸 / Acetogenesis (Wood-Ljungdahl)</title>
  <desc id="d-62_acetogenesis">产乙酸菌通过WL途径: 4H₂+2CO₂→CH₃COOH+2H₂O。同型产乙酸。Clostridium, Acetobacterium。关键词: acetogenesis, Wood-Ljungdahl, homoacetogen</desc>
  <defs>
    <marker id="pp62__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
    
  </defs>
  <g id="layer-body" data-name="body">
        <circle cx="12" cy="45" r="8" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
