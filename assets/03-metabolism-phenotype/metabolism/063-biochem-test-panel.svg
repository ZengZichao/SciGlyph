<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-metabolism" role="img" aria-labelledby="t-63_biochem_test_panel d-63_biochem_test_panel" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-63_biochem_test_panel">生化鉴定面板 / Biochemical Test Panel</title>
  <desc id="d-63_biochem_test_panel">常见生化鉴定反应: 脲酶(尿素水解)、触媒(H₂O₂→O₂)、氧化酶(O₂还原)、硝酸还原酶(NO₃⁻→NO₂⁻)。关键词: urease, catalase, oxidase, nitrate reductase, biochemical ID</desc>
  <g id="layer-body" data-name="body">
        <rect x="5" y="15" width="20" height="15" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1" />
    <text x="15.0" y="24.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">URE</text>
        <rect x="30" y="15" width="20" height="15" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1" />
    <text x="40.0" y="24.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="ink">CAT</text>
        <rect x="55" y="15" width="20" height="15" rx="1" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" />
    <text x="65.0" y="24.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">OX</text>
        <rect x="80" y="15" width="15" height="15" rx="1" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1" />
    <text x="87.5" y="24.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">NR</text>
      <circle cx="15" cy="55" r="3" fill="#00857A" data-pp="metabolism"/>
    <circle cx="40" cy="55" r="3" fill="#C42D2D" data-pp="alert"/>
    <circle cx="65" cy="55" r="3" fill="#00857A" data-pp="metabolism"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="17.86" y="42.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">urea→NH₃</text>
    <text x="25" y="50.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">H₂O₂→O₂</text>
    <text x="65" y="42.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">O₂→H₂O</text>
    <text x="79.97" y="50.0" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">NO₃⁻→NO₂⁻</text>
    <text x="50" y="65" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">+ / - tests</text>
    <text x="50" y="80" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">API / Enterotube</text>
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">for bacterial ID</text>
  </g>
