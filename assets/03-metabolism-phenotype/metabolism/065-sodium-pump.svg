<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-metabolism" role="img" aria-labelledby="t-65_sodium_pump d-65_sodium_pump" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-65_sodium_pump">钠离子泵 / Sodium Pump (Na⁺-SMF)</title>
  <desc id="d-65_sodium_pump">Na⁺泵代替H⁺泵建立钠动力势(SMF)。驱动鞭毛马达、ATP合酶(Na⁺-ATPase)、转运。见于嗜碱菌、海洋细菌。关键词: sodium pump, Na+-motive force, Na+-ATPase, Na+ efflux, ATP</desc>
  <defs>
    <marker id="pp65__ar" viewBox="0 0 5 5" refX="4" refY="2.5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1B2733" data-pp="ink"/>
    </marker>
  </defs>
  <g id="layer-body" data-name="body">
    <line x1="5" y1="40" x2="95" y2="40" stroke="#00857A" data-pp="metabolism" stroke-width="2"/>
    <line x1="5" y1="60" x2="95" y2="60" stroke="#00857A" data-pp="metabolism" stroke-width="2"/>
    <rect x="35" y="42" width="30" height="16" rx="3" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="4" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="0.5"/>
    <circle cx="50" cy="25" r="3" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.8"/>
    <line x1="50" y1="42" x2="50" y2="30" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp65__ar)"/>
    <circle cx="50" cy="75" r="3" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.8"/>
    <line x1="50" y1="72" x2="50" y2="62" stroke="#1B2733" data-pp="ink" stroke-width="1" marker-end="url(#pp65__ar)"/>
    <rect x="70" y="15" width="14" height="8" rx="1" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5"/>
    <line x1="77" y1="23" x2="60" y2="42" stroke="#1B2733" data-pp="ink" stroke-width="0.8" stroke-dasharray="2,1"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="55" y="22" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">Na+ out</text>
    <text x="55" y="80" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">Na+ in</text>
    <text x="71" y="13" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="start">ATP</text>
  </g>
</svg>
