<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="革兰氏阴性：薄层与外膜" data-name-en="Gram Negative Cell Wall" data-cat="03-phenotype" data-tags="革兰氏阴性,外膜,脂多糖,肽聚糖薄层,周质空间,球杆菌" role="img" aria-labelledby="t-03-gram-negative d-03-gram-negative" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-03-gram-negative">革兰氏阴性：薄层与外膜 / Gram Negative Cell Wall</title>
  <desc id="d-03-gram-negative">肽聚糖层薄（1–3 nm）位于周质空间，外侧有脂多糖外膜；脱色后被番红复染呈红色，剖面示内外膜与周质薄肽聚糖。关键词: 革兰氏阴性, 外膜, 脂多糖, 肽聚糖薄层, 周质空间, 球杆菌</desc>
<g stroke-linecap="round" stroke-linejoin="round">
