  <title id="t-05-acid-fast">抗酸染色：分枝菌 / Acid Fast Staining</title>
  <desc id="d-05-acid-fast">石炭酸复红经酸-酒精脱色后仍被含分枝菌酸（mycolic acid）的细胞壁保留而呈红色；非抗酸菌被复染剂亚甲蓝染成蓝色；菌体细长成索并分枝。关键词: 抗酸染色, 齐-尼法, 分枝杆菌, 抗酸菌, 索状菌体, 分枝</desc>
