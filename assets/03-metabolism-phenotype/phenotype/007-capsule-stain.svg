<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="荚膜染色负染" data-name-en="Capsule Negative Stain" data-cat="03-phenotype" data-tags="荚膜染色,负染,墨汁,炭粒,透明晕,肺炎链球菌" role="img" aria-labelledby="t-07-capsule-stain d-07-capsule-stain" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-07-capsule-stain">荚膜染色负染 / Capsule Negative Stain</title>
  <desc id="d-07-capsule-stain">墨汁或炭粒充满背景而显深色，荚膜排斥墨粒不被染色，菌体周围形成清晰透明晕环，是荚膜最直观的显示方法。关键词: 荚膜染色, 负染, 墨汁, 炭粒, 透明晕, 肺炎链球菌</desc>
<g stroke-linecap="round" stroke-linejoin="round">
