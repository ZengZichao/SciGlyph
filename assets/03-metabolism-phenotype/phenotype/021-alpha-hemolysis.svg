  <title id="t-21-alpha-hemolysis">α溶血绿晕 / Alpha Hemolysis</title>
  <desc id="d-21-alpha-hemolysis">红细胞仅部分溶解，血红蛋白氧化为胆绿素等，菌落周围呈半透明绿色/橄榄色晕环（α溶血）。关键词: α溶血, 部分溶血, 绿色晕环, 溶血性, 肺炎链球菌</desc>
