  <title id="t-24-macconkey-lactose">麦康凯乳糖发酵 / MacConkey Agar</title>
  <desc id="d-24-macconkey-lactose">胆盐与结晶紫抑制革兰氏阳性菌；乳糖发酵菌产酸使中性红指示剂变红，菌落深红并伴胆盐沉淀晕；非发酵菌菌落无色透明。关键词: 麦康凯, 选择培养基, 鉴别培养基, 乳糖发酵, 胆盐, 产酸菌</desc>
