<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="巧克力平板与X/V因子" data-name-en="Chocolate Agar" data-cat="03-phenotype" data-tags="巧克力平板,血液加热,嗜血杆菌,X因子,V因子,XV联合纸片" role="img" aria-labelledby="t-25-chocolate-plate d-25-chocolate-plate" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-25-chocolate-plate">巧克力平板与X/V因子 / Chocolate Agar</title>
  <desc id="d-25-chocolate-plate">血液加热使红细胞释放血红素（X 因子）与 NAD（V 因子），可培养嗜血杆菌等营养要求苛刻的细菌；在不含因子的培养基上，仅 X+V 联合纸片周围出现生长；血平板上围绕金黄色葡萄球菌菌苔生长的现象则称卫星现象。关键词: 巧克力平板, 血液加热, 嗜血杆菌, X因子, V因子, XV联合纸片</desc>
<g stroke-linecap="round" stroke-linejoin="round">
