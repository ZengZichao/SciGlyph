  <title id="t-27-turbidity-broth">液体培养基浑浊度 / Broth Turbidity</title>
  <desc id="d-27-turbidity-broth">液体培养中菌体增殖导致浊度增加，三支小管以菌体密度梯度对比无明显生长、中度浑浊与明显浑浊，用于半定量判断生长量。关键词: 液体培养基, 浑浊, 浊度, 比浊, 增菌, 生长梯度</desc>
