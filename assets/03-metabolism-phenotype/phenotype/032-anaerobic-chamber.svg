<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="厌氧手套箱" data-name-en="Anaerobic Glove Box" data-cat="03-phenotype" data-tags="厌氧手套箱,无氧操作,手套,传递舱,气体端口,厌氧指示剂" role="img" aria-labelledby="t-32-anaerobic-chamber d-32-anaerobic-chamber" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-32-anaerobic-chamber">厌氧手套箱 / Anaerobic Glove Box</title>
  <desc id="d-32-anaerobic-chamber">密闭手套箱内充入 N₂/H₂/CO₂ 混合气（H₂ 经钯催化剂清除残余氧）维持厌氧，通过手套直接操作，避免样品接触空气；箱内置厌氧指示剂与气体端口。关键词: 厌氧手套箱, 无氧操作, 手套, 传递舱, 气体端口, 厌氧指示剂</desc>
