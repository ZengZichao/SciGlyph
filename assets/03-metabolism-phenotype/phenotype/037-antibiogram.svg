<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="药敏扩散抑菌圈" data-name-en="Disk Diffusion Antibiogram" data-cat="03-phenotype" data-tags="药敏试验,纸片扩散法,抑菌圈,抑菌直径,敏感,耐药" role="img" aria-labelledby="t-37-antibiogram d-37-antibiogram" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-37-antibiogram">药敏扩散抑菌圈 / Disk Diffusion Antibiogram</title>
  <desc id="d-37-antibiogram">将抗菌药物纸片放在已接种细菌的琼脂平板上，药物扩散形成抑菌圈，测量圈径（mm）并与标准比对判定敏感/中介/耐药。关键词: 药敏试验, 纸片扩散法, 抑菌圈, 抑菌直径, 敏感, 耐药</desc>
