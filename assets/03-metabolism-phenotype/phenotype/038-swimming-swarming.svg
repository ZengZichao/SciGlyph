  <title id="t-38-swimming-swarming">游泳与集群运动对照 / Swimming vs Swarming</title>
  <desc id="d-38-swimming-swarming">游泳运动为单个细胞在半固体琼脂中沿任意方向的位移；集群运动是大量细胞协同在固体表面呈树突/树枝状快速扩展，依赖鞭毛与表面活性物质。关键词: 游泳运动, 集群运动, 运动性, 半固体, 表面扩展, 树突状</desc>
