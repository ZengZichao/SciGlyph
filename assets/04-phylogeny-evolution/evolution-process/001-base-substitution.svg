<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-evolution-process" role="img" aria-labelledby="t-base_substitution d-base_substitution" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-base_substitution">碱基替换 / Base Substitution (Transition &amp; Transversion)</title>
<desc id="d-base_substitution">转换与颠换示意。关键词: transition, transversion, substitution, mutation</desc>
<defs>
<marker id="pp01__ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#1B2733" data-pp="ink" />
</marker>
</defs>
<g data-name="body"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg" />
<text x="300" y="28" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">Base Substitution: Transition vs Transversion</text>
<text x="100" y="70" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Before:</text><rect x="150" y="55" width="30" height="30" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" />
<text x="165" y="75" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">A</text>
<line x1="200" y1="70" x2="250" y2="70" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp01__ar)" />
<text x="270" y="70" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Transition:</text><rect x="350" y="55" width="30" height="30" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1" />
<text x="365" y="75" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">G</text>
<text x="390" y="70" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">(purine→purine)</text>
<text x="100" y="130" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Before:</text><rect x="150" y="115" width="30" height="30" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" />
<text x="165" y="135" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">A</text>
<line x1="200" y1="130" x2="250" y2="130" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp01__ar)" />
<text x="270" y="130" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Transversion:</text><rect x="360" y="115" width="30" height="30" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1" />
<text x="375" y="135" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">C</text>
<text x="400" y="130" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">(purine→pyrimidine)</text>
<rect x="80" y="180" width="440" height="160" rx="5" fill="#FFFFFF" data-pp="white" stroke="#93A0AC" data-pp-stroke="muted" stroke-width="1" />
<text x="100" y="205" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">Transitions (more common):</text>
<text x="100" y="225" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">A ↔ G (purines)  |  C ↔ T (pyrimidines)</text>
<text x="100" y="255" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">Transversions (less common):</text>
<text x="100" y="275" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">A ↔ C, A ↔ T, G ↔ C, G ↔ T</text>
<text x="300" y="365" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Transitions occur ~2× more frequently than transversions</text></g></svg>
