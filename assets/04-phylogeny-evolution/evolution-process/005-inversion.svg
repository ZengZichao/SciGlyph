<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-evolution-process" role="img" aria-labelledby="t-inversion d-inversion" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-inversion">倒位突变 / Inversion Mutation</title>
<desc id="d-inversion">DNA 片段倒位。关键词: inversion, rearrangement, chromosome</desc>
<defs>
<marker id="pp05__ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#1B2733" data-pp="ink" />
</marker>
</defs>
<g data-name="body"><rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg" />
<text x="300" y="28" text-anchor="middle" font-size="14" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" font-weight="bold">Inversion Mutation</text>
<text x="80" y="80" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Before:</text><rect x="120" y="65" width="50" height="30" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" />
<text x="145" y="85" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">A</text><rect x="175" y="65" width="50" height="30" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1" />
<text x="200" y="85" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">B</text><rect x="230" y="65" width="50" height="30" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1" />
<text x="255" y="85" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">C</text><rect x="285" y="65" width="50" height="30" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1" />
<text x="310" y="85" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">D</text><rect x="340" y="65" width="50" height="30" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" />
<text x="365" y="85" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">E</text><rect x="175" y="60" width="165" height="40" fill="none" stroke="#C42D2D" data-pp="alert" stroke-width="2" stroke-dasharray="4,2" />
<line x1="300" y1="110" x2="300" y2="140" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp05__ar)" />
<text x="315" y="130" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">invert</text>
<text x="80" y="170" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">After:</text><rect x="120" y="155" width="50" height="30" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" />
<text x="145" y="175" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">A</text><rect x="175" y="155" width="50" height="30" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1" />
<text x="200" y="175" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">D</text><rect x="230" y="155" width="50" height="30" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1" />
<text x="255" y="175" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">C</text><rect x="285" y="155" width="50" height="30" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1" />
<text x="310" y="175" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">B</text><rect x="340" y="155" width="50" height="30" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" />
<text x="365" y="175" text-anchor="middle" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" font-weight="bold">E</text><rect x="175" y="150" width="165" height="40" fill="none" stroke="#C42D2D" data-pp="alert" stroke-width="2" stroke-dasharray="4,2" />
<text x="257" y="145" text-anchor="middle" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">inverted (DCB)</text>
<text x="300" y="240" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Inversion reverses orientation of a chromosomal segment</text>
<text x="300" y="270" text-anchor="middle" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Can disrupt genes at breakpoints or alter gene regulation</text></g></svg>
