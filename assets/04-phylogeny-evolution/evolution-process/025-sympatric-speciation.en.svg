<text x="60" y="280" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="start">Host shifts · polyploidy · sexual selection</text>
<text x="60" y="296" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="start">Niche partitioning · temporal isolation</text>
