<text x="300" y="24" font-size="13" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">Sympatric Speciation</text>
<rect x="40" y="45" width="280" height="180" fill="#FFFFFF" data-pp="white" stroke="#93A0AC" stroke-width="1" rx="5"/>
