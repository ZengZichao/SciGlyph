<title id="t-sympatric_speciation">Sympatric Speciation</title>
<desc id="d-sympatric_speciation">无地理隔离,通过宿主转移或生态位分裂在同域形成新种 关键词: sympatric, speciation, host shift, disruptive, niche</desc>
<defs>
<marker id="pp25__ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#1B2733" data-pp="ink"/>
</marker>
</defs>
<g data-name="body">
