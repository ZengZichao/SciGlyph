<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-evolution-process" role="img" aria-labelledby="t-endosymbiosis d-endosymbiosis" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-endosymbiosis">Endosymbiosis Genome Reduction</title>
<desc id="d-endosymbiosis">自由生活祖先(~4000基因)→早期内共生体(~1600)→现代细胞器(人线粒体~37基因)。基因向核转移(EGT, endosymbiotic gene transfer)。示意, 数值不按比例。关键词: endosymbiosis, genome reduction, organelle, EGT, mitochondrion</desc>
<defs>
<marker id="pp26__ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#1B2733" data-pp="ink"/>
</marker>
</defs>
<g data-name="body">
<rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
<text x="300" y="24" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">Endosymbiont Genome Reduction</text>
<text x="80" y="40" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">Free-living ancestor</text>
<circle cx="80" cy="110" r="45" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="2" fill-opacity="0.2"/>
<circle cx="80" cy="110" r="35" fill="none" data-pp="gene" stroke="#6C3FA0" stroke-width="2.5"/>
<text x="80" y="108" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">~4000</text>
<text x="80" y="122" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">gene</text>
<line x1="135" y1="110" x2="200" y2="110" stroke="#E8871E" data-pp="mge" stroke-width="2" marker-end="url(#pp26__ar)"/>
<text x="165" y="100" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#E8871E" data-pp="mge" text-anchor="middle">Endosymbiosis</text>
<text x="270" y="50" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">early symbiosis</text>
<circle cx="270" cy="110" r="35" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="2" fill-opacity="0.2"/>
<circle cx="270" cy="110" r="25" fill="none" data-pp="gene" stroke="#6C3FA0" stroke-width="2"/>
<text x="270" y="108" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">~1600</text>
<text x="270" y="122" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">gene</text>
<line x1="315" y1="110" x2="370" y2="110" stroke="#E8871E" data-pp="mge" stroke-width="2" marker-end="url(#pp26__ar)"/>
<text x="430" y="50" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">Modern organelle</text>
<circle cx="430" cy="110" r="25" fill="#3F8FBF" data-pp="eukaryote" stroke="#1B2733" stroke-width="2" fill-opacity="0.2"/>
<circle cx="430" cy="110" r="15" fill="none" data-pp="gene" stroke="#6C3FA0" stroke-width="1.5"/>
<text x="430" y="108" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">~37</text>
<text x="430" y="122" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">gene</text>
<text x="530" y="60" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene" text-anchor="middle" font-weight="bold">Nuclear genome</text>
<rect x="490" y="65" width="80" height="50" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1.5" rx="0.15"/>
<text x="530" y="95" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle" font-weight="bold">~20000</text>
<line x1="110" y1="80" x2="495" y2="80" stroke="#E8871E" data-pp="mge" stroke-width="1" stroke-linecap="round" stroke-dasharray="4,3"/>
<line x1="295" y1="85" x2="495" y2="85" stroke="#E8871E" data-pp="mge" stroke-width="1" stroke-linecap="round" stroke-dasharray="4,3"/>
<line x1="445" y1="90" x2="495" y2="90" stroke="#E8871E" data-pp="mge" stroke-width="1" stroke-linecap="round" stroke-dasharray="4,3"/>
<text x="350" y="75" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#E8871E" data-pp="mge" text-anchor="middle">Gene transfer (EGT)</text>
<text x="60" y="170" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start" font-weight="bold">Gene number decreases</text>
<rect x="80" y="60" width="60" height="200" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1"/>
<text x="110" y="275" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Free-living</text>
<text x="118" y="58" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">4000</text>
<rect x="220" y="180" width="60" height="80" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1"/>
<text x="250" y="275" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">early symbiosis</text>
<text x="250" y="175" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">1600</text>
<rect x="360" y="258" width="60" height="2" fill="#3F8FBF" data-pp="eukaryote" stroke="#1B2733" stroke-width="1"/>
<text x="390" y="275" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Mitochondrion</text>
<text x="390" y="254" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">37</text>
<line x1="70" y1="180" x2="70" y2="260" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
<text x="60" y="185" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end">gene count</text>
<rect x="60" y="295" width="480" height="80" fill="#FFFFFF" data-pp="white" stroke="#93A0AC" stroke-width="1" rx="4"/>
<text x="300" y="312" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">Lost/transferred gene classes</text>
<rect x="100" y="322" width="60" height="18" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5" rx="0.3"/>
<text x="130" y="336" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">metabolism</text>
<rect x="190" y="322" width="60" height="18" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5" rx="0.3"/>
<text x="220" y="336" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">replication</text>
<rect x="280" y="322" width="60" height="18" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5" rx="0.3"/>
<text x="310" y="336" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Transcription</text>
<rect x="370" y="322" width="60" height="18" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5" rx="0.3"/>
<text x="400" y="336" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Translation</text>
<rect x="460" y="322" width="60" height="18" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5" rx="0.3"/>
<text x="490" y="336" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">cell wall</text>
<text x="300" y="360" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism" text-anchor="middle">Retained: respiratory core · rRNA · tRNA</text>
</g>
</svg>