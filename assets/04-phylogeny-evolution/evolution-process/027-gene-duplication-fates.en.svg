<text x="439" y="184" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">E1</text>
<text x="470" y="184" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">E2</text>
<text x="501" y="184" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">E3</text>
<rect x="420" y="200" width="100" height="22" fill="#93A0AC" data-pp="muted" stroke="#1B2733" stroke-width="1" rx="3"/>
<line x1="420" y1="200" x2="520" y2="222" stroke="#C42D2D" data-pp="alert" stroke-width="1.5" stroke-linecap="round"/>
<line x1="520" y1="200" x2="420" y2="222" stroke="#C42D2D" data-pp="alert" stroke-width="1.5" stroke-linecap="round"/>
<text x="470" y="215" font-size="12" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="middle" font-weight="bold">ψ</text>
<text x="470" y="238" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Accumulating mutations</text>
<rect x="60" y="260" width="480" height="110" fill="#FFFFFF" data-pp="white" stroke="#93A0AC" stroke-width="1" rx="4"/>
<text x="300" y="280" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">Duplication is the source of innovation</text>
<text x="100" y="300" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism" text-anchor="start" font-weight="bold">Neofunctionalization:</text>
<text x="175.48" y="309.02" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="start">One copy free to mutate → new function</text>
<text x="100" y="318" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2E86AB" data-pp="bacteria" text-anchor="start" font-weight="bold">Subfunctionalization:</text>
<text x="175.48" y="327.02" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="start">Each copy loses part → complementation</text>
<text x="100" y="336" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="start" font-weight="bold">Pseudogenization:</text>
<text x="175.48" y="345.02" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="start">Redundant copy decays → silenced</text>
<text x="100" y="354" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start" font-weight="bold">Examples:</text>
<text x="125.48" y="363.02" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="start">Hox clusters · hemoglobin family · olfactory receptors</text>
