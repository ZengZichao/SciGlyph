<rect x="240" y="200" width="70" height="22" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1.5" rx="3"/>
<rect x="245" y="203" width="28" height="16" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="0.5"/>
<rect x="276" y="203" width="28" height="16" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="0.5"/>
<text x="259" y="214" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">E2</text>
<text x="290" y="214" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">E3</text>
<text x="275" y="238" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Complementary partitioning</text>
