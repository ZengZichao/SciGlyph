<rect x="120" y="85" width="20" height="8" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5"/>
<rect x="108" y="95" width="20" height="8" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5"/>
<circle cx="155" cy="85" r="18" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1.5" fill-opacity="0.3"/>
<line x1="135" y1="85" x2="140" y2="85" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5" marker-end="url(#pp29__ar)"/>
<text x="210" y="50" font-size="10" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#5B8C3E" data-pp="virus" text-anchor="start" font-weight="bold">转导</text>
