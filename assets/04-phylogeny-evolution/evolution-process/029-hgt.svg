<circle cx="250" cy="80" r="5" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5"/>
<circle cx="225" cy="85" r="15" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" fill-opacity="0.2"/>
