<line x1="160" y1="240" x2="160" y2="305" stroke="#E8871E" data-pp="mge" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,3"/>
<text x="168" y="275" font-size="9" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#E8871E" data-pp="mge" text-anchor="start">HGT</text>
<text x="220" y="145" font-size="10" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#6C3FA0" data-pp="gene" text-anchor="start" font-weight="bold">基因树</text>
<line x1="240" y1="310" x2="240" y2="180" stroke="#6C3FA0" data-pp="gene" stroke-width="1.5" stroke-linecap="round"/>
