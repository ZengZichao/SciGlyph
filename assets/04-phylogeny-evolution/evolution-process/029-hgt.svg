<line x1="240" y1="280" x2="320" y2="310" stroke="#6C3FA0" data-pp="gene" stroke-width="2" stroke-linecap="round"/>
<circle cx="320" cy="310" r="5" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1"/>
<rect x="350" y="155" width="120" height="50" fill="#FFFFFF" data-pp="white" stroke="#93A0AC" stroke-width="1" rx="4"/>
<text x="410" y="172" font-size="9" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="middle" font-weight="bold">拓扑冲突</text>
<text x="410" y="190" font-size="9" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">基因树 ≠ 物种树</text>
<rect x="350" y="220" width="210" height="100" fill="#FFFFFF" data-pp="white" stroke="#93A0AC" stroke-width="1" rx="4"/>
<text x="455" y="240" font-size="9" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">HGT 的演化意义</text>
<text x="365" y="258" font-size="9" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="start">抗生素耐药传播</text>
<text x="365" y="275" font-size="9" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#00857A" data-pp="metabolism" text-anchor="start">代谢途径组装</text>
<text x="365" y="292" font-size="9" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#6C3FA0" data-pp="gene" text-anchor="start">基因组嵌合性</text>
<text x="365" y="309" font-size="9" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#E8871E" data-pp="mge" text-anchor="start">泛基因组扩张</text>
</g>
