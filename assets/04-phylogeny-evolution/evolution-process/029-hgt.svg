<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" class="pp-diagram pp-evolution-process" role="img" aria-labelledby="t-hgt d-hgt" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-hgt">水平基因转移 / Horizontal Gene Transfer</title>
<desc id="d-hgt">转化/转导/接合三种机制及基因在物种树上的跨枝转移 关键词: HGT, transformation, transduction, conjugation, plasmid</desc>
<defs>
<marker id="pp29__ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#1B2733" data-pp="ink"/>
</marker>
</defs>
<g data-name="body">
<rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
<text x="300" y="24" font-size="13" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">Horizontal Gene Transfer</text>
<text x="60" y="50" font-size="10" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#2E86AB" data-pp="bacteria" text-anchor="start" font-weight="bold">转化</text>
<circle cx="80" cy="85" r="18" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5" fill-opacity="0.3"/>
