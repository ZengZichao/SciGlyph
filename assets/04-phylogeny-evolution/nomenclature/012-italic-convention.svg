<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-nomenclature" role="img" aria-labelledby="t-12_italic_convention d-12_italic_convention" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-12_italic_convention">斜体规范 / Italic rule</title>
  <desc id="d-12_italic_convention">属名和种加词用斜体，科以上用正体。关键词: italic, nomenclature, convention</desc>
  <g id="layer-body" data-name="body">
    <text x="50" y="32" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="middle" font-style="italic">E. coli</text>
    <line x1="20" y1="36" x2="80" y2="36" stroke="#C42D2D" data-pp="alert" stroke-width="0.5" stroke-linecap="round" />
    <text x="51.41" y="44.00" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="middle">italic ✓</text>
    <text x="50.60" y="54.00" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Enterobacteriaceae</text>
    <line x1="20" y1="58" x2="80" y2="58" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-linecap="round" />
    <text x="52.82" y="65" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">roman ✓</text>
    <text x="50" y="74" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">≥ family: roman</text>
      <rect x="12" y="18" width="76" height="28" rx="2" fill="none" stroke="#C42D2D" data-pp="alert" stroke-width="0.8"/>
    <rect x="12" y="48" width="76" height="19" rx="2" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.8"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Italic rule</text>
  </g>
</svg>