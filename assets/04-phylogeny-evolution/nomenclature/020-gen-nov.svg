<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-nomenclature" role="img" aria-labelledby="t-gen_nov d-gen_nov" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-gen_nov">新属 / gen. nov.</title>
  <desc id="d-gen_nov">命名行为: gen. nov.(genus novum)——描述发表一个新属名；与 comb. nov.(旧组合转移)和 nom. nov.(替换名)不同，gen. nov. 不涉及旧名的改名转移。关键词: gen. nov., genus novum, nomenclatural act</desc>
  
  <g id="layer-body" data-name="body">
    <rect x="35" y="38" width="30" height="14" rx="2" fill="#E8871E" stroke="#1B2733" stroke-width="1.5" data-pp="mge"/>
    <text x="50" y="47" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#FFFFFF" data-pp="white">gen.</text>
    <line x1="70" y1="30" x2="70" y2="38" stroke="#C42D2D" stroke-width="1" data-pp="alert" stroke-linecap="round"/>
    <line x1="66" y1="34" x2="74" y2="34" stroke="#C42D2D" stroke-width="1" data-pp="alert" stroke-linecap="round"/>
    <line x1="67" y1="31" x2="73" y2="37" stroke="#C42D2D" stroke-width="1" data-pp="alert" stroke-linecap="round"/>
    <line x1="73" y1="31" x2="67" y2="37" stroke="#C42D2D" stroke-width="1" data-pp="alert" stroke-linecap="round"/>
  </g>
  
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#1B2733" data-pp="ink">新属</text>
  </g>
</svg>