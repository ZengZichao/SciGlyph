<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-nomenclature" role="img" aria-labelledby="t-16s_species d-16s_species" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-16s_species">16S定种 / 16S species</title>
  <desc id="d-16s_species">16S rRNA gene similarity threshold for species delineation ~98.65% (Yarza et al. 2014; 常操作化为98.7%) 关键词: 16S, species, threshold, 98.65%</desc>
  
  <g id="layer-body" data-name="body">
    <rect x="20" y="35" width="60" height="8" rx="2" fill="#6C3FA0" stroke="#1B2733" stroke-width="1.5" data-pp="gene"/>
    <text x="50" y="41" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#FFFFFF" data-pp="white">16S rRNA</text>
    <line x1="20" y1="55" x2="80" y2="55" stroke="#C42D2D" stroke-width="1.5" stroke-linecap="round" data-pp="alert" stroke-dasharray="3,2"/>
    <text x="50" y="62" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#C42D2D" data-pp="alert">~98.65%</text>
    <rect x="25" y="68" width="20" height="5" rx="1" fill="#2E86AB" stroke="#1B2733" stroke-width="1" data-pp="bacteria"/>
    <rect x="55" y="68" width="20" height="5" rx="1" fill="#2E86AB" stroke="#1B2733" stroke-width="1" data-pp="bacteria"/>
  <circle cx="50" cy="55" r="2" fill="#C42D2D" stroke="#1B2733" stroke-width="0.6" data-pp="alert"/></g>
  
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#1B2733" data-pp="ink">16S定种</text>
  </g>
</svg>