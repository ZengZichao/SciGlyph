    <rect x="55" y="30" width="30" height="8" rx="2" fill="#2E86AB" stroke="#1B2733" stroke-width="1.5" data-pp="bacteria"/>
    <line x1="45" y1="34" x2="55" y2="34" stroke="#00857A" stroke-width="1" stroke-linecap="round" data-pp="metabolism"/>
