  <line x1="30" y1="30" x2="30" y2="38" stroke="#93A0AC" stroke-width="1" data-pp="muted" stroke-linecap="round"/><line x1="70" y1="30" x2="70" y2="38" stroke="#93A0AC" stroke-width="1" data-pp="muted" stroke-linecap="round"/><path d="M50,36 L50,44" fill="none" stroke="#00857A" stroke-width="1" data-pp="metabolism" stroke-linecap="round"/><circle cx="50" cy="34" r="2" fill="#00857A" stroke="#1B2733" stroke-width="0.6" data-pp="metabolism"/></g>
  
