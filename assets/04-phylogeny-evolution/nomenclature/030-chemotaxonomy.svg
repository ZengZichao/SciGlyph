  <title id="t-30_chemotaxonomy">化学分类 / Chemotaxonomy</title>
  <desc id="d-30_chemotaxonomy">化学分类学：脂肪酸(FA)、醌(QL)、极性脂(PL)等化学标记。关键词: chemotaxonomy, fatty acid, quinone, polar lipid</desc>
  <g id="layer-body" data-name="body">
    <rect x="8" y="16" width="28" height="22" rx="3" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.2" stroke="#2E86AB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="30" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2E86AB" data-pp="bacteria" text-anchor="middle">FA</text>
    <rect x="36" y="16" width="28" height="22" rx="3" fill="#00857A" data-pp="metabolism" fill-opacity="0.2" stroke="#00857A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="30" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism" text-anchor="middle">QL</text>
    <rect x="64" y="16" width="28" height="22" rx="3" fill="#6C3FA0" data-pp="gene" fill-opacity="0.2" stroke="#6C3FA0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="30" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene" text-anchor="middle">PL</text>
    <text x="50" y="56" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">chemo-</text>
    <text x="50" y="66" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">taxonomy</text>
      <line x1="12" y1="42" x2="32" y2="42" stroke="#2E86AB" data-pp="bacteria" stroke-width="1"/>
    <circle cx="50" cy="45" r="4" fill="none" stroke="#00857A" data-pp="metabolism" stroke-width="0.8"/>
    <ellipse cx="78" cy="44" rx="6" ry="3" fill="#6C3FA0" data-pp="gene" fill-opacity="0.2" stroke="#6C3FA0" stroke-width="0.5"/>
    <line x1="22" y1="42" x2="22" y2="48" stroke="#2E86AB" data-pp="bacteria" stroke-width="0.8"/>

