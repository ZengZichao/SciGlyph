<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-nomenclature" role="img" aria-labelledby="t-33_species_card d-33_species_card" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-33_species_card">菌种卡片 / Species card</title>
  <desc id="d-33_species_card">菌种卡片四要素：学名(属名+种加词斜体, sp. nov.正体)+来源+革兰氏结果+需氧性。关键词: species card, gram, aerobic, sp. nov.</desc>
  <g id="layer-body" data-name="body">
    <rect x="8" y="10" width="84" height="70" rx="5" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="24" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle"><tspan font-style="italic">Genus species</tspan> sp. nov.</text>
    <line x1="16" y1="28" x2="84" y2="28" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-linecap="round"/>
    <text x="24" y="40" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="start">source</text>
    <text x="76" y="40" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#8C6D3F" data-pp="host" text-anchor="end">soil</text>
    <text x="24" y="52" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="start">Gram</text>
    <rect x="60" y="46" width="16" height="8" rx="2" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.3" stroke="#2E86AB" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="53" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2E86AB" data-pp="bacteria" text-anchor="middle">−</text>
    <text x="24" y="64" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="start">O2</text>
    <text x="76" y="64" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism" text-anchor="end">aerobe</text>
    <text x="24" y="76" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="start">16S</text>
    <text x="76" y="76" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene" text-anchor="end">≥98.65%</text>
      <line x1="16" y1="44" x2="84" y2="44" stroke="#93A0AC" data-pp="muted" stroke-width="0.3"/>
    <line x1="16" y1="56" x2="84" y2="56" stroke="#93A0AC" data-pp="muted" stroke-width="0.3"/>
    <line x1="16" y1="68" x2="84" y2="68" stroke="#93A0AC" data-pp="muted" stroke-width="0.3"/>
    <circle cx="14" cy="17" r="3" fill="#2E86AB" data-pp="bacteria"/>

  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Species card</text>
  </g>
