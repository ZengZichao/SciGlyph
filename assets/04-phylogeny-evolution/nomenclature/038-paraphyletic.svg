  <title id="t-38_paraphyletic">并系 / Paraphyletic</title>
  <desc id="d-38_paraphyletic">并系群(paraphyletic group)：包含共同祖先与部分后代，但排除了一个后代（红色 excluded 末端），故非单系。关键词: paraphyletic, clade, common ancestor, excluded descendant, group</desc>
