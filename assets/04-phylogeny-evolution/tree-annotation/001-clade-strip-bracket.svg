<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
     role="img" aria-labelledby="t-01 d-01" class="pp-diagram pp-tree-decor" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-01">枝杈条带 / Clade Strip Bracket</title>
  <desc id="d-01">装饰零件，贴到树上用。枝杈条带(clade strip/bracket)，标记进化枝。 关键词: tree decoration, clade strip, bracket, monophyly, iTOL</desc>
  <rect x="0" y="0" width="400" height="400" fill="#F4F1EA" data-pp="bg"/>
  <g data-name="bracket">
    <path d="M 50 80 L 30 80 L 30 320 L 50 320" fill="none" stroke="#1B2733" stroke-width="2" data-pp="ink" stroke-linecap="round"/>
    <line x1="30" y1="200" x2="20" y2="200" stroke="#1B2733" stroke-width="2" data-pp="ink"/>
    <text x="35" y="205" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">Clade A</text>
  </g>
  <g data-name="clade-strip">
    <rect x="80" y="80" width="8" height="240" fill="#2E86AB" fill-opacity="0.4" stroke="#2E86AB" stroke-width="1" data-pp="bacteria"/>
  </g>
  <g data-name="example-branches">
    <line x1="120" y1="100" x2="350" y2="100" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="120" y1="150" x2="350" y2="150" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="120" y1="200" x2="350" y2="200" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="120" y1="250" x2="350" y2="250" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="120" y1="300" x2="350" y2="300" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
  </g>
  <g data-name="annotation">
    <path d="M 50 330 L 30 330 L 30 380 L 50 380" fill="none" stroke="#A2305B" stroke-width="2" data-pp="archaea" stroke-linecap="round"/>
    <line x1="30" y1="355" x2="20" y2="355" stroke="#A2305B" stroke-width="2" data-pp="archaea"/>
    <rect x="80" y="330" width="8" height="50" fill="#A2305B" fill-opacity="0.4" stroke="#A2305B" stroke-width="1" data-pp="archaea"/>
    <circle cx="120" cy="340" r="3" fill="#A2305B" data-pp="archaea"/>
    <circle cx="120" cy="360" r="3" fill="#A2305B" data-pp="archaea"/>
    <circle cx="120" cy="380" r="3" fill="#A2305B" data-pp="archaea"/>
  </g>
</svg>