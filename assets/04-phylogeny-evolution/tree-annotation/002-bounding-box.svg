<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
     role="img" aria-labelledby="t-02 d-02" class="pp-diagram pp-tree-decor" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-02">外框包围盒 / Bounding Box</title>
  <desc id="d-02">装饰零件，贴到树上用。外框包围盒，高亮显示特定分组。 关键词: tree decoration, bounding box, highlight group, clade, iTOL</desc>
  <rect x="0" y="0" width="400" height="400" fill="#F4F1EA" data-pp="bg"/>
  <g data-name="bounding-box">
    <rect x="50" y="80" width="300" height="240" fill="none" stroke="#C42D2D" stroke-width="2" data-pp="alert" stroke-dasharray="5 3" rx="8"/>
    <text x="200" y="70" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="middle">Group of interest</text>
  </g>
  <g data-name="example-content">
    <circle cx="100" cy="120" r="8" fill="#2E86AB" fill-opacity="0.5" stroke="#1B2733" stroke-width="1" data-pp="bacteria"/>
    <line x1="120" y1="120" x2="320" y2="120" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <circle cx="100" cy="180" r="8" fill="#2E86AB" fill-opacity="0.5" stroke="#1B2733" stroke-width="1" data-pp="bacteria"/>
    <line x1="120" y1="180" x2="320" y2="180" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <circle cx="100" cy="240" r="8" fill="#2E86AB" fill-opacity="0.5" stroke="#1B2733" stroke-width="1" data-pp="bacteria"/>
    <line x1="120" y1="240" x2="320" y2="240" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <circle cx="100" cy="300" r="8" fill="#2E86AB" fill-opacity="0.5" stroke="#1B2733" stroke-width="1" data-pp="bacteria"/>
    <line x1="120" y1="300" x2="320" y2="300" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
  </g>
  <g data-name="annotation">
    <circle cx="100" cy="300" r="8" fill="#A2305B" fill-opacity="0.5" stroke="#1B2733" stroke-width="1" data-pp="archaea"/>
    <line x1="120" y1="300" x2="320" y2="300" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <rect x="330" y="100" width="30" height="220" fill="none" stroke="#00857A" stroke-width="1.5" data-pp="metabolism" stroke-dasharray="4 2" rx="4"/>
    <circle cx="345" cy="150" r="5" fill="#00857A" fill-opacity="0.4" stroke="#1B2733" stroke-width="1" data-pp="metabolism"/>
    <circle cx="345" cy="250" r="5" fill="#00857A" fill-opacity="0.4" stroke="#1B2733" stroke-width="1" data-pp="metabolism"/>
  </g>
</svg>