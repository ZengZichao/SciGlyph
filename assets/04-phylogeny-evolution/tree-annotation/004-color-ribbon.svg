<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
     role="img" aria-labelledby="t-04 d-04" class="pp-diagram pp-tree-decor" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-04">色带 / Color Ribbon</title>
  <desc id="d-04">装饰零件，贴到树上用。色带标记，显示分类或属性。 关键词: tree decoration, color ribbon, bacteria, archaea, eukaryote, virus, metabolism</desc>
  <rect x="0" y="0" width="400" height="400" fill="#F4F1EA" data-pp="bg"/>
  <g data-name="color-ribbon">
    <rect x="50" y="80" width="20" height="50" fill="#2E86AB" fill-opacity="0.6" stroke="#2E86AB" stroke-width="1" data-pp="bacteria"/>
    <rect x="50" y="130" width="20" height="50" fill="#A2305B" fill-opacity="0.6" stroke="#A2305B" stroke-width="1" data-pp="archaea"/>
    <rect x="50" y="180" width="20" height="50" fill="#3F8FBF" fill-opacity="0.6" stroke="#3F8FBF" stroke-width="1" data-pp="eukaryote"/>
    <rect x="50" y="230" width="20" height="50" fill="#5B8C3E" fill-opacity="0.6" stroke="#5B8C3E" stroke-width="1" data-pp="virus"/>
    <rect x="50" y="280" width="20" height="50" fill="#00857A" fill-opacity="0.6" stroke="#00857A" stroke-width="1" data-pp="metabolism"/>
  </g>
  <g data-name="labels">
    <text x="80" y="109.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">bacteria</text>
    <text x="80" y="159.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">archaea</text>
    <text x="80" y="209.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">eukaryote</text>
    <text x="80" y="259.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">virus</text>
    <text x="80" y="309.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">metabolism</text>
  </g>
  <g data-name="example-branches">
    <line x1="150" y1="105" x2="350" y2="105" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="150" y1="155" x2="350" y2="155" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="150" y1="205" x2="350" y2="205" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="150" y1="255" x2="350" y2="255" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="150" y1="305" x2="350" y2="305" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
  </g>
  <g data-name="annotation">
    <line x1="150" y1="105" x2="150" y2="305" stroke="#93A0AC" stroke-width="0.5" data-pp="muted" stroke-dasharray="2 2"/>
    <circle cx="350" cy="105" r="3" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="350" cy="155" r="3" fill="#A2305B" data-pp="archaea"/>
    <circle cx="350" cy="305" r="3" fill="#00857A" data-pp="metabolism"/>
  </g>
</svg>