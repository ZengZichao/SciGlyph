    <line x1="70.1" y1="125.0" x2="78.8" y2="130.0" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
    <text x="57.1" y="117.5" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">1000 Ma</text>
    <line x1="125.0" y1="70.1" x2="130.0" y2="78.8" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
