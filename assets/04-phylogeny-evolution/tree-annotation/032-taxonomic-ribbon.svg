<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
     role="img" aria-labelledby="t-32 d-32" class="pp-diagram pp-tree-decor" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-32">分类等级嵌套矩形 / Taxonomic Ribbon</title>
  <desc id="d-32">装饰零件，贴到树上用。分类等级嵌套矩形: Domain→Phylum→Class→Order→Family→Genus→Species→Strain 共8级嵌套；颜色=等级层级，不表示域。 关键词: tree decoration, taxonomic ribbon, Domain, Phylum, Class, Order, Family, Genus, Species, Strain, nested, levels</desc>
  <rect x="0" y="0" width="400" height="400" fill="#F4F1EA" data-pp="bg"/>
  <g data-name="taxonomic-ribbon">
    <rect x="50" y="180" width="350" height="40" fill="#1B2733" fill-opacity="0.2" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
    <text x="55" y="176" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Domain</text>
    <rect x="80" y="180" width="280" height="40" fill="#00857A" fill-opacity="0.2" stroke="#00857A" stroke-width="1" data-pp="metabolism"/>
    <text x="85" y="236" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism">Phylum</text>
    <rect x="110" y="180" width="210" height="40" fill="#8C6D3F" fill-opacity="0.2" stroke="#8C6D3F" stroke-width="1" data-pp="host"/>
    <text x="115" y="176" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#8C6D3F" data-pp="host">Class</text>
    <rect x="140" y="180" width="160" height="40" fill="#6C3FA0" fill-opacity="0.2" stroke="#6C3FA0" stroke-width="1" data-pp="gene"/>
    <text x="145" y="236" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">Order</text>
    <rect x="170" y="180" width="120" height="40" fill="#E8871E" fill-opacity="0.2" stroke="#E8871E" stroke-width="1" data-pp="mge"/>
    <text x="175" y="176" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#E8871E" data-pp="mge">Family</text>
    <rect x="200" y="180" width="85" height="40" fill="#C42D2D" fill-opacity="0.2" stroke="#C42D2D" stroke-width="1" data-pp="alert"/>
    <text x="205" y="236" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">Genus</text>
    <rect x="230" y="180" width="50" height="40" fill="#93A0AC" fill-opacity="0.2" stroke="#93A0AC" stroke-width="1" data-pp="muted"/>
    <text x="235" y="176" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">Species</text>
    <rect x="260" y="180" width="15" height="40" fill="#1B2733" fill-opacity="0.35" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
    <text x="265" y="236" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Strain</text>
  </g>
  <g data-name="annotation">
    <line x1="50" y1="250" x2="350" y2="250" stroke="#1B2733" stroke-width="1" data-pp="ink" stroke-linecap="round"/>
    <line x1="50" y1="180" x2="50" y2="250" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
    <text x="50" y="269" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">nested ranks: Domain &#8594; Strain (colour = rank)</text>
  </g>
</svg>