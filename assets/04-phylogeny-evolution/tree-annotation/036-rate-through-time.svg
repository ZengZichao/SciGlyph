<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
     role="img" aria-labelledby="t-36 d-36" class="pp-diagram pp-tree-decor" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-36">分化速率色带 / Rate-through-time Band</title>
  <desc id="d-36">装饰零件，贴到树上用。把一棵树的时间轴切成等宽区间，柱高=该区间内平均分化速率(相对值，示意数据，未按真实速率标定)。红色柱表示高于全树均值的区间，青柱表示等于或低于均值。区间序号从左到右代表由深到浅的时间深度，不标注绝对地质年代。 关键词: rate through time, RTT, diversification rate, lineage-through-time, LTT, decoration, bar band, speciation</desc>
  <rect x="0" y="0" width="400" height="400" fill="#F4F1EA" data-pp="bg"/>
  <g data-name="body">
    <text x="200" y="28" font-size="13" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">Rate through Time</text>
    <line x1="60" y1="300" x2="360" y2="300" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="60" y1="100" x2="60" y2="300" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="60" y1="250" x2="360" y2="250" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-dasharray="3 2"/>
    <line x1="60" y1="200" x2="360" y2="200" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-dasharray="3 2"/>
    <line x1="60" y1="150" x2="360" y2="150" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-dasharray="3 2"/>
    <line x1="60" y1="100" x2="360" y2="100" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text x="54" y="303" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="end">0.0</text>
    <text x="54" y="253" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="end">0.25</text>
    <text x="54" y="203" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="end">0.50</text>
    <text x="54" y="153" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="end">0.75</text>
    <text x="54" y="103" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="end">1.00</text>
    <text x="20" y="205" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" transform="rotate(-90 20 205)">relative rate</text>
  </g>
  <g data-name="rate-band">
    <rect x="66" y="244" width="28" height="56" fill="#00857A" fill-opacity="0.6" stroke="#1B2733" stroke-width="0.5" data-pp="metabolism"/>
    <rect x="99" y="176" width="28" height="124" fill="#C42D2D" fill-opacity="0.6" stroke="#1B2733" stroke-width="0.5" data-pp="alert"/>
    <rect x="132" y="160" width="28" height="140" fill="#C42D2D" fill-opacity="0.6" stroke="#1B2733" stroke-width="0.5" data-pp="alert"/>
    <rect x="165" y="168" width="28" height="132" fill="#C42D2D" fill-opacity="0.6" stroke="#1B2733" stroke-width="0.5" data-pp="alert"/>
    <rect x="198" y="196" width="28" height="104" fill="#C42D2D" fill-opacity="0.6" stroke="#1B2733" stroke-width="0.5" data-pp="alert"/>
    <rect x="231" y="210" width="28" height="90" fill="#00857A" fill-opacity="0.6" stroke="#1B2733" stroke-width="0.5" data-pp="metabolism"/>
    <rect x="264" y="224" width="28" height="76" fill="#00857A" fill-opacity="0.6" stroke="#1B2733" stroke-width="0.5" data-pp="metabolism"/>
    <rect x="297" y="240" width="28" height="60" fill="#00857A" fill-opacity="0.6" stroke="#1B2733" stroke-width="0.5" data-pp="metabolism"/>
    <rect x="330" y="252" width="28" height="48" fill="#00857A" fill-opacity="0.6" stroke="#1B2733" stroke-width="0.5" data-pp="metabolism"/>
    <line x1="60" y1="207.8" x2="360" y2="207.8" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-dasharray="5 3"/>
  </g>
  <g data-name="annotation">
    <text x="80" y="316" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">1</text>
    <text x="113" y="316" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">2</text>
    <text x="146" y="316" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">3</text>
    <text x="179" y="316" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">4</text>
    <text x="212" y="316" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">5</text>
    <text x="245" y="316" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">6</text>
    <text x="278" y="316" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">7</text>
    <text x="311" y="316" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">8</text>
    <text x="344" y="316" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">9</text>
    <text x="210" y="334" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">time interval (deep to present)</text>
    <text x="366" y="211" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">mean</text>
  </g>
  <g data-name="legend">
    <rect x="90" y="352" width="10" height="10" fill="#C42D2D" fill-opacity="0.6" stroke="#1B2733" stroke-width="0.5" data-pp="alert"/>
    <text x="104" y="361" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">&gt; mean rate</text>
    <rect x="200" y="352" width="10" height="10" fill="#00857A" fill-opacity="0.6" stroke="#1B2733" stroke-width="0.5" data-pp="metabolism"/>
    <text x="214" y="361" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">&#8804; mean rate</text>
  </g>
</svg>
