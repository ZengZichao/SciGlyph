  <defs>
    <pattern id="pp39__hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#93A0AC" stroke-width="1.4"/>
