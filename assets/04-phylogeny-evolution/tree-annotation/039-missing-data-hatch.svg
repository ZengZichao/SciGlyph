<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
     role="img" aria-labelledby="t-39 d-39" class="pp-diagram pp-tree-decor" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-39">缺失数据斜纹 / Missing Data Hatching</title>
  <desc id="d-39">装饰零件，贴到树上用。缺失数据用斜纹填充。 关键词: tree decoration, missing data hatch, observed vs missing, hatching, incomplete data</desc>
  <rect x="0" y="0" width="400" height="400" fill="#F4F1EA" data-pp="bg"/>
  <defs>
    <pattern id="pp39__hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#93A0AC" stroke-width="1"/>
    </pattern>
  </defs>
  <g data-name="missing-data">
    <rect x="100" y="100" width="50" height="40" fill="#93A0AC" stroke="#1B2733" stroke-width="1" data-pp="muted"/>
    <rect x="100" y="200" width="50" height="40" fill="#93A0AC" stroke="#1B2733" stroke-width="1" data-pp="muted"/>
    <rect x="200" y="150" width="50" height="40" fill="#93A0AC" stroke="#1B2733" stroke-width="1" data-pp="muted"/>
    <rect x="200" y="250" width="50" height="40" fill="#93A0AC" stroke="#1B2733" stroke-width="1" data-pp="muted"/>
    <rect x="300" y="180" width="50" height="40" fill="#93A0AC" stroke="#1B2733" stroke-width="1" data-pp="muted"/>
  </g>
  <g data-name="annotation">
    <rect x="100" y="100" width="50" height="40" fill="url(#pp39__hatch)" stroke="#1B2733" stroke-width="1" data-pp="muted"/>
    <rect x="200" y="150" width="50" height="40" fill="url(#pp39__hatch)" stroke="#1B2733" stroke-width="1" data-pp="muted"/>
    <rect x="300" y="180" width="50" height="40" fill="url(#pp39__hatch)" stroke="#1B2733" stroke-width="1" data-pp="muted"/>
    <line x1="100" y1="310" x2="350" y2="310" stroke="#1B2733" stroke-width="1" data-pp="ink" stroke-linecap="round"/>
    <line x1="100" y1="80" x2="100" y2="310" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
    <rect x="100" y="330" width="15" height="15" fill="#93A0AC" stroke="#1B2733" stroke-width="1" data-pp="muted"/>
    <rect x="120" y="330" width="15" height="15" fill="url(#pp39__hatch)" stroke="#1B2733" stroke-width="1" data-pp="muted"/>
    <text x="142" y="342" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">observed / missing</text>
    <circle cx="350" cy="280" r="4" fill="#93A0AC" data-pp="muted"/>
  </g>
</svg>