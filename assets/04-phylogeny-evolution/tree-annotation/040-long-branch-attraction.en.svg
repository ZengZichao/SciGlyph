<text x="383.0" y="93.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">A</text>
<text x="325.0" y="173.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">C</text>
<line x1="250.0" y1="270.0" x2="278.0" y2="270.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="278.0" y1="230.0" x2="278.0" y2="310.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="278.0" y1="230.0" x2="376.0" y2="230.0" stroke="#C42D2D" stroke-width="3" data-pp="alert" stroke-linecap="round"/>
<line x1="278.0" y1="310.0" x2="318.0" y2="310.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<circle cx="376.0" cy="230.0" r="4.0" fill="#C42D2D" data-pp="alert"/>
<circle cx="318.0" cy="310.0" r="3.0" fill="#1B2733" data-pp="ink"/>
<text x="383.0" y="233.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">B</text>
<text x="325.0" y="313.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">D</text>
</g>
<g data-name="annotation">
<line x1="120.0" y1="356.0" x2="150.0" y2="356.0" stroke="#C42D2D" stroke-width="3" data-pp="alert" stroke-linecap="round"/>
<text x="158.0" y="359.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">long branch (many changes)</text>
<line x1="120.0" y1="374.0" x2="150.0" y2="374.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<text x="158.0" y="377.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">short branch</text>
<text x="200.0" y="392.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Long branches attract spuriously; true tree pairs long with short</text>
</g>
</svg>
