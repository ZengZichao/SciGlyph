<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
     class="pp-diagram pp-tree-decor" role="img" aria-labelledby="t-40 d-40" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-40">Long-branch Attraction</title>
<desc id="d-40">同一组 4 个分类单元(A、B 枝长, C、D 枝短)的两种推断结果对照:左=长枝吸引造成的错误拓扑((A,B)聚在一起),右=正确拓扑((A,C)(B,D),每条长枝与一条短枝配对)。红枝=长枝,墨色枝=短枝;枝长按示意绘制,不代表真实替换数。 关键词: LBA, long branch attraction, artifact, topology error, phylogenetic artifact, maximum likelihood, parsimony</desc>
<g data-name="body">
<rect x="0.0" y="0.0" width="400.0" height="400.0" fill="#F4F1EA" data-pp="bg"/>
<text x="110.0" y="35.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="middle" font-weight="bold">Wrong (LBA)</text>
<line x1="30.0" y1="200.0" x2="60.0" y2="200.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="60.0" y1="130.0" x2="60.0" y2="270.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="60.0" y1="130.0" x2="90.0" y2="130.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="90.0" y1="90.0" x2="90.0" y2="170.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="90.0" y1="90.0" x2="130.0" y2="90.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="90.0" y1="170.0" x2="130.0" y2="170.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<circle cx="130.0" cy="90.0" r="3.0" fill="#1B2733" data-pp="ink"/>
<circle cx="130.0" cy="170.0" r="3.0" fill="#1B2733" data-pp="ink"/>
<text x="137.0" y="93.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">C</text>
<text x="137.0" y="173.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">D</text>
<line x1="60.0" y1="270.0" x2="90.0" y2="270.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="90.0" y1="230.0" x2="90.0" y2="310.0" stroke="#C42D2D" stroke-width="1.5" data-pp="alert" stroke-linecap="round"/>
<line x1="90.0" y1="230.0" x2="200.0" y2="230.0" stroke="#C42D2D" stroke-width="3" data-pp="alert" stroke-linecap="round"/>
<line x1="90.0" y1="310.0" x2="200.0" y2="310.0" stroke="#C42D2D" stroke-width="3" data-pp="alert" stroke-linecap="round"/>
<circle cx="200.0" cy="230.0" r="4.0" fill="#C42D2D" data-pp="alert"/>
<circle cx="200.0" cy="310.0" r="4.0" fill="#C42D2D" data-pp="alert"/>
<text x="208.0" y="233.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">A</text>
<text x="208.0" y="313.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">B</text>
<circle cx="90.0" cy="270.0" r="8.0" fill="#C42D2D" data-pp="alert" fill-opacity="0.3" stroke="#C42D2D" stroke-width="2"/>
<text x="104.0" y="273.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">artifact</text>
</g>
<g data-name="correct-tree">
<text x="300.0" y="35.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-weight="bold">Correct</text>
<line x1="220.0" y1="200.0" x2="250.0" y2="200.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="250.0" y1="130.0" x2="250.0" y2="270.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
