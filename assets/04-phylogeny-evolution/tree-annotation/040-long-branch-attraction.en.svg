<line x1="278.0" y1="170.0" x2="318.0" y2="170.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<circle cx="376.0" cy="90.0" r="4.0" fill="#C42D2D" data-pp="alert"/>
