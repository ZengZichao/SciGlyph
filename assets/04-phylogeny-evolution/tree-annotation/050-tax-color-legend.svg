<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
     class="pp-diagram pp-tree-decor" role="img" aria-labelledby="t-50 d-50" data-license="CC-BY-4.0" data-copyright="ZengZichao">
<title id="t-50">分类颜色图例带 / Taxonomic Color Legend</title>
<desc id="d-50">迷你跨域树按更高分类单元着色示意(非按比例, 丰度百分比为示例值)。四类颜色对应细菌/古菌/真核/病毒, 命名用 GTDB 现行门名: Pseudomonadota(旧称 Proteobacteria)、Methanobacteriota(旧称 Euryarchaeota 拆分而来)、Caudoviricetes(旧称 Caudovirales 目), Ascomycota 为真核。关键词: taxonomy, color, legend, phylum, abundance, GTDB</desc>
<g data-name="body">
<rect x="0.0" y="0.0" width="400.0" height="400.0" fill="#F4F1EA" data-pp="bg"/>
<line x1="30.0" y1="200.0" x2="70.0" y2="200.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="70.0" y1="120.0" x2="70.0" y2="280.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="70.0" y1="120.0" x2="110.0" y2="120.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="110.0" y1="78.4" x2="110.0" y2="161.6" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="110.0" y1="40.0" x2="180.0" y2="40.0" stroke="#2E86AB" stroke-width="2" data-pp="bacteria" stroke-linecap="round"/>
