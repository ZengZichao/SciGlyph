<text x="252.0" y="187.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Ascomycota</text>
<rect x="230.0" y="195.0" width="18.0" height="6.0" fill="#3F8FBF" data-pp="eukaryote" fill-opacity="0.4" stroke="#3F8FBF" stroke-width="1"/>
<text x="253.0" y="201.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">18%</text>
<rect x="230.0" y="225.0" width="16.0" height="16.0" fill="#5B8C3E" data-pp="virus" fill-opacity="0.7" stroke="#5B8C3E" stroke-width="0.5"/>
<text x="252.0" y="237.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Caudoviricetes</text>
<rect x="230.0" y="245.0" width="7.0" height="6.0" fill="#5B8C3E" data-pp="virus" fill-opacity="0.4" stroke="#5B8C3E" stroke-width="1"/>
<text x="242.0" y="251.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">7%</text>
<text x="200.0" y="390.0" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Color = phylum (schematic)</text>
</g>
