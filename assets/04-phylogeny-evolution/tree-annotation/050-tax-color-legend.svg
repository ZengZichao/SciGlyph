<line x1="110.0" y1="177.1" x2="180.0" y2="177.1" stroke="#5B8C3E" stroke-width="2" data-pp="virus" stroke-linecap="round"/>
<line x1="70.0" y1="280.0" x2="110.0" y2="280.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="110.0" y1="238.4" x2="110.0" y2="321.6" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
<line x1="110.0" y1="222.9" x2="180.0" y2="222.9" stroke="#2E86AB" stroke-width="2" data-pp="bacteria" stroke-linecap="round"/>
<line x1="110.0" y1="268.6" x2="180.0" y2="268.6" stroke="#A2305B" stroke-width="2" data-pp="archaea" stroke-linecap="round"/>
<line x1="110.0" y1="314.3" x2="180.0" y2="314.3" stroke="#3F8FBF" stroke-width="2" data-pp="eukaryote" stroke-linecap="round"/>
<line x1="110.0" y1="360.0" x2="180.0" y2="360.0" stroke="#5B8C3E" stroke-width="2" data-pp="virus" stroke-linecap="round"/>
<circle cx="180.0" cy="40.0" r="3.0" fill="#2E86AB" data-pp="bacteria"/>
<circle cx="180.0" cy="85.7" r="3.0" fill="#A2305B" data-pp="archaea"/>
<circle cx="180.0" cy="131.4" r="3.0" fill="#3F8FBF" data-pp="eukaryote"/>
<circle cx="180.0" cy="177.1" r="3.0" fill="#5B8C3E" data-pp="virus"/>
