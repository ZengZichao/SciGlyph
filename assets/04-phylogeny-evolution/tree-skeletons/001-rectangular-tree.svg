<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" font-family="Inter,Helvetica,Arial,sans-serif" role="img" data-name-zh="矩形树" data-name-en="Rectangular cladogram" data-cat="04-phylo" data-tags="矩形树,直角折线,系统发育,拓扑,cladogram" aria-labelledby="t-01-rectangular-tree d-01-rectangular-tree" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-01-rectangular-tree">矩形树 / Rectangular cladogram</title>
