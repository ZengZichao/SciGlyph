      <circle cx="104" cy="18" r="3"/>
      <circle cx="104" cy="34" r="3"/>
      <circle cx="104" cy="58" r="3"/>
      <circle cx="104" cy="74" r="3"/>
      <circle cx="104" cy="90" r="3"/>
