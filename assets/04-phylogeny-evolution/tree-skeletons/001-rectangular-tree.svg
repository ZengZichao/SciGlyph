      <path d="M 16 98 H 60"/>
      <path d="M 44 18 V 34"/>
      <path d="M 44 18 H 104"/>
      <path d="M 44 34 H 104"/>
      <path d="M 44 58 V 74"/>
      <path d="M 44 58 H 104"/>
      <path d="M 44 74 H 104"/>
      <path d="M 60 90 V 106"/>
      <path d="M 60 90 H 104"/>
      <path d="M 60 106 H 104"/>
    </g>
    <g fill="#5B4B8A">
      <circle cx="16" cy="26" r="2.2"/>
      <circle cx="16" cy="66" r="2.2"/>
      <circle cx="16" cy="98" r="2.2"/>
      <circle cx="44" cy="26" r="1.8"/>
      <circle cx="44" cy="66" r="1.8"/>
      <circle cx="60" cy="98" r="1.8"/>
