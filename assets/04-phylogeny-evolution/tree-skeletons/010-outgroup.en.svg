<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" font-family="Inter,Helvetica,Arial,sans-serif" role="img" data-name-zh="外群与虚线基部" data-name-en="Outgroup rooting" data-cat="04-phylo" data-tags="外群,outgroup,基部,虚线,定根" aria-labelledby="t-10-outgroup d-10-outgroup" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-10-outgroup">Outgroup rooting</title>
  <desc id="d-10-outgroup">外群分支以灰色虚线自根节点向下绘出并加空心三角标记；虚线外群支与实线内群干在根节点处交汇，该交汇点即系统发育根，虚线基部强调根位置的不确定性。关键词: 外群, outgroup, 基部, 虚线, 定根</desc>
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="112" height="100" rx="4" fill="#F7FAF8" stroke="#DCEEE4" stroke-width="1.2"/>
    <!-- 实线内群：根干 → 根节点(24,48) → 内群 → 4 个叶端 -->
    <g fill="none" stroke="#5B4B8A" stroke-width="2">
      <path d="M 4 48 H 24"/>
      <path d="M 24 48 H 32"/>
      <path d="M 32 28 V 68"/>
      <path d="M 32 28 H 40"/>
      <path d="M 32 68 H 40"/>
      <path d="M 40 18 V 38"/>
      <path d="M 40 18 H 100"/>
      <path d="M 40 38 H 100"/>
      <path d="M 40 58 V 78"/>
      <path d="M 40 58 H 100"/>
      <path d="M 40 78 H 100"/>
    </g>
    <!-- 虚线外群支：自根节点(24,48)向下再向右，末端空心三角 -->
    <path d="M 24 48 V 90 H 100" fill="none" stroke="#7A8B93" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 100 90 V 94" fill="none" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 3"/>
    <path d="M 93 94 L 107 94 L 100 104 Z" fill="#FFFFFF" stroke="#7A8B93" stroke-width="2"/>
    <!-- 节点标记：根节点用较大实心点标出 -->
    <g fill="#5B4B8A">
      <circle cx="24" cy="48" r="2.8"/>
      <circle cx="32" cy="28" r="2"/>
      <circle cx="32" cy="68" r="2"/>
      <circle cx="40" cy="28" r="1.8"/>
      <circle cx="40" cy="68" r="1.8"/>
    </g>
    <g fill="#B7D7E8" stroke="#5B4B8A" stroke-width="1.2">
      <circle cx="100" cy="18" r="3"/>
      <circle cx="100" cy="38" r="3"/>
      <circle cx="100" cy="58" r="3"/>
      <circle cx="100" cy="78" r="3"/>
    </g>
    <text font-family="Inter,Helvetica,Arial,sans-serif" x="17" y="43" text-anchor="middle" font-size="9" fill="#2B3A42">Root</text>
    <text font-family="Inter,Helvetica,Arial,sans-serif" x="62" y="100" text-anchor="middle" font-size="9" fill="#5B6B73">OUTGROUP</text>
  </g>
</svg>
