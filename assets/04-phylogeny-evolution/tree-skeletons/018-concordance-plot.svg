<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" data-name-zh="基因树与物种树一致性" data-name-en="Gene-species tree concordance" data-cat="04-phylo" data-tags="一致性,基因树,物种树,拓扑一致性,tanglegram" aria-labelledby="t-18-concordance-plot d-18-concordance-plot" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-18-concordance-plot">基因树与物种树一致性 / Gene-species tree concordance</title>
  <desc id="d-18-concordance-plot">左右两棵树（物种树、基因树）以连线配对类群，连线交叉处以红色虚线标出不一致关系，用于量化拓扑一致性比例（tanglegram）</desc>
