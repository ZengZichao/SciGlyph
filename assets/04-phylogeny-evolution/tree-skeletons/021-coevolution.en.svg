      <path d="M 40 120 H 74"/>
    </g>
    <g fill="none" stroke="#5B4B8A" stroke-width="2">
      <path d="M 222 62 H 212"/>
      <path d="M 212 40 V 106"/>
      <path d="M 212 40 H 200"/>
      <path d="M 212 106 H 200"/>
      <path d="M 200 30 V 48"/>
      <path d="M 200 30 H 166"/>
      <path d="M 200 48 H 166"/>
      <path d="M 200 90 V 120"/>
      <path d="M 200 90 H 166"/>
      <path d="M 200 120 H 166"/>
    </g>
    <g fill="none" stroke="#5B4B8A" stroke-width="1.4">
      <path d="M 74 30 H 166"/>
      <path d="M 74 120 H 166"/>
    </g>
    <g fill="none" stroke="#C0504D" stroke-width="1.6" stroke-dasharray="4 2">
