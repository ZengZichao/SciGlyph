<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" font-family="Inter,Helvetica,Arial,sans-serif" role="img" data-name-zh="宿主-病原共演化对比树" data-name-en="Host-parasite coevolution" data-cat="04-phylo" data-tags="共演化,宿主,病原,共谱系,水平转移" aria-labelledby="t-21-coevolution d-21-coevolution" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-21-coevolution">Host-parasite coevolution</title>
  <desc id="d-21-coevolution">左右相对的宿主树与病原树以连线一一配对（每个宿主叶端对应唯一病原叶端），实线为共谱系（cospeciation）事件，交叉的红色虚线表示宿主转换或水平转移造成的宿主—病原错配。关键词: 共演化, 宿主, 病原, 共谱系, 水平转移</desc>
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="224" height="144" rx="6" fill="#F7FAF8" stroke="#DCEEE4" stroke-width="1.2"/>
    <text font-family="Inter,Helvetica,Arial,sans-serif" x="20" y="22" font-size="10" fill="#2B3A42">Host tree</text>
    <text font-family="Inter,Helvetica,Arial,sans-serif" x="220" y="22" text-anchor="end" font-size="10" fill="#2B3A42">Pathogen tree</text>
    <g fill="none" stroke="#5B4B8A" stroke-width="2">
      <path d="M 18 62 H 28"/>
