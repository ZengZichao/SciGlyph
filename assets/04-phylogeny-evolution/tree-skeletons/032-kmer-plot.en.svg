<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" font-family="Inter,Helvetica,Arial,sans-serif" role="img" data-name-zh="k-mer 深度散点与 ANI 曲线" data-name-en="k-mer depth plot" data-cat="04-phylo" data-tags="k-mer,深度,ANI,散点,基因组比对" aria-labelledby="t-32-kmer-plot d-32-kmer-plot" data-license="CC-BY-4.0" data-copyright="ZengZichao">
