<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t-21 d-21" class="pp-diagram pp-trees" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-21">基因树vs物种树不一致 / Gene-Species Discordance</title>
  <desc id="d-21">骨架，配合ASTRAL/Notung使用。左：基因树（每个物种两份拷贝）把 B、C 聚为一支；右：物种树把 A、B 聚为一支——拓扑冲突提示 ILS 或 HGT。紫色底=基因树中的冲突并系。 关键词: phylogenetic tree, gene species discord, Gene-Species, Discordance, ASTRAL, Notung, ILS, HGT, skeleton template</desc>
  <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  <text x="120" y="14" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">Gene tree</text>
  <g id="pp21__clades" data-name="clade-shading">
    <rect x="133.3" y="88.0" width="34.6" height="76.0" fill="#6C3FA0" data-pp="gene" fill-opacity="0.12" data-name="clade-BC-copy1"/>
    <rect x="133.3" y="280.0" width="34.6" height="76.0" fill="#6C3FA0" data-pp="gene" fill-opacity="0.12" data-name="clade-AC-copy2"/>
  </g>
