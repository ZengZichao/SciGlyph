<title id="t-24">压缩长枝树 / Collapsed Long Branch</title>
<desc id="d-24">低分辨/冗余的 clade(进化枝)被折叠为三角形，并标注该 clade 包含的 tip 数目(~5 tips)，右上角小窗是同一 clade 展开后的 5 个 tip，两者数目一致。schematic, not to scale. 关键词: phylogenetic tree, collapsed clade, triangle, clade collapse, tip count annotation, expanded inset, ggtree, iTOL</desc>
<rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
<g data-name="branches">
