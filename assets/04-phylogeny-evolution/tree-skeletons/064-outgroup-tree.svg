  <title id="t-32">带外群树 / Tree with Outgroup</title>
  <desc id="d-32">骨架，配合IQ-TREE/RAxML使用。外群 Out_A 最先分出、其枝以虚线标示，用于确定树根。 关键词: phylogenetic tree, outgroup tree, IQ-TREE, RAxML, Out_A, skeleton template</desc>
  <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  <g id="pp32__clades" data-name="clade-shading">
    <rect x="116.7" y="114.0" width="34.6" height="72.0" fill="#6C3FA0" data-pp="gene" fill-opacity="0.12" data-name="clade-AB"/>
    <rect x="116.7" y="274.0" width="34.6" height="72.0" fill="#00857A" data-pp="metabolism" fill-opacity="0.12" data-name="clade-CD"/>
  </g>
  <g id="pp32__branches" data-name="branches">
