    <line x1="90.0" y1="310.0" x2="116.7" y2="310.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="116.7" y1="280.0" x2="116.7" y2="340.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="116.7" y1="120.0" x2="143.3" y2="120.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="116.7" y1="180.0" x2="143.3" y2="180.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="116.7" y1="280.0" x2="143.3" y2="280.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="116.7" y1="340.0" x2="143.3" y2="340.0" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
  </g>
  <g id="pp32__nodes" data-name="nodes">
    <circle cx="60.0" cy="150.0" r="2.5" fill="#C42D2D" stroke="#1B2733" stroke-width="1" data-pp="alert" data-name="root"/>
