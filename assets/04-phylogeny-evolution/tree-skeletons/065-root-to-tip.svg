<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t-33 d-33" class="pp-diagram pp-trees" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-33">Root-to-tip回归 / Root-to-tip Regression</title>
  <desc id="d-33">骨架，配合TempEst/BEAST使用。根到tip距离对采样时间的回归线，用于分子钟检验。 关键词: phylogenetic tree, root to tip, Root-to-tip, Regression, TempEst, BEAST, Sampling, time, dist, skeleton template, molecular clock</desc>
  <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  <g data-name="tree">
    <line x1="40" y1="200" x2="120" y2="200" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="120" y2="280" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="220" y2="120" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="120" y1="200" x2="200" y2="200" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="120" y1="280" x2="240" y2="280" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
  </g>
  <g data-name="regression-plot">
    <line x1="300" y1="350" x2="560" y2="350" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
    <line x1="300" y1="350" x2="300" y2="50" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
    <circle cx="320" cy="310" r="3" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="350" cy="280" r="3" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="380" cy="250" r="3" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="410" cy="210" r="3" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="440" cy="180" r="3" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="470" cy="140" r="3" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="500" cy="110" r="3" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="530" cy="90" r="3" fill="#2E86AB" data-pp="bacteria"/>
    <line x1="310" y1="320" x2="540" y2="85" stroke="#C42D2D" stroke-width="1.5" data-pp="alert" stroke-dasharray="4 2"/>
    <text x="430" y="375" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">Sampling time</text>
    <text x="285" y="200" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" transform="rotate(-90 285 200)">Root-to-tip dist</text>
  </g>
</svg>