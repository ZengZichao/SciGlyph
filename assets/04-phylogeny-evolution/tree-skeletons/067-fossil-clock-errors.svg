<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t-35 d-35" class="pp-diagram pp-trees" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-35">化石分子钟误差棒 / Fossil Clock Error Bars</title>
  <desc id="d-35">骨架，配合BEAST/MCMCTree使用。节点分歧时间带化石校准误差棒。 关键词: phylogenetic tree, fossil clock errors, BEAST, MCMCTree, skeleton template, time calibration</desc>
  <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  <g data-name="branches">
    <line x1="60" y1="200" x2="180" y2="200" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="180" y1="120" x2="180" y2="280" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="180" y1="120" x2="350" y2="120" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="180" y1="280" x2="350" y2="280" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
  </g>
  <g data-name="error-bars">
    <line x1="150" y1="200" x2="210" y2="200" stroke="#C42D2D" stroke-width="2" data-pp="alert"/>
    <line x1="150" y1="195" x2="150" y2="205" stroke="#C42D2D" stroke-width="2" data-pp="alert"/>
    <line x1="210" y1="195" x2="210" y2="205" stroke="#C42D2D" stroke-width="2" data-pp="alert"/>
    <line x1="155" y1="120" x2="205" y2="120" stroke="#C42D2D" stroke-width="2" data-pp="alert"/>
    <line x1="155" y1="115" x2="155" y2="125" stroke="#C42D2D" stroke-width="2" data-pp="alert"/>
    <line x1="205" y1="115" x2="205" y2="125" stroke="#C42D2D" stroke-width="2" data-pp="alert"/>
  </g>
  <g data-name="tip-labels">
    <text x="360" y="123" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Sp A</text>
    <text x="360" y="283" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Sp B</text>
  </g>
  <g data-name="fossil-markers">
    <rect x="165" y="185" width="30" height="8" fill="#00857A" fill-opacity="0.5" stroke="#00857A" stroke-width="0.5" data-pp="metabolism"/>
    <text x="180" y="178" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism" text-anchor="middle">fossil</text>
    <circle cx="180" cy="120" r="4" fill="#E8871E" data-pp="mge"/>
    <circle cx="180" cy="280" r="4" fill="#E8871E" data-pp="mge"/>
    <rect x="100" y="340" width="80" height="20" fill="none" stroke="#93A0AC" stroke-width="0.5" stroke-dasharray="2,2" data-pp="muted"/>
  </g>
</svg>