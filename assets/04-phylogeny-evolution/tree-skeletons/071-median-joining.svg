  <title id="t-39">中介连接网络 / Median-Joining Network</title>
  <desc id="d-39">骨架，配合Network/PopART使用。中介连接法(MJ)构建的单倍型网络。 关键词: phylogenetic tree, median joining, Median-Joining, Network, PopART, MV1, MV2, MV3, skeleton template</desc>
