  <title id="t-41">系统发育网络(重组) / Phylogenetic Network</title>
  <desc id="d-41">骨架，配合PhyloNet/SplitsTree使用。显示重组/水平转移事件的系统发育网络。 关键词: phylogenetic tree, phylo network recomb, PhyloNet, SplitsTree, skeleton template, phylogenetics</desc>
