  <title id="t-42">有尾病毒分类树 / Tailed viruses (Caudoviricetes)</title>
  <desc id="d-42">骨架，配合ICTV/PhaGCNS使用。有尾病毒(class Caudoviricetes)分类树，tip 按尾型分组：Myo=肌尾型、Siph=长尾型、Pod=短尾型、Auto=Autographiviridae。旧称“目 Caudovirales”已被 ICTV 废止，仅作历史名保留在本描述中。绿色带=形态群 A(肌尾/长尾)，紫色带=形态群 B(短尾/自转录型)，色带仅区分分支群，不表示宿主域。 关键词: tailed virus, Caudoviricetes, Caudovirales obsolete, ICTV, phage taxonomy, Myoviridae, Siphoviridae, Podoviridae, Autographiviridae, skeleton template</desc>
