    <text x="133.3" y="18" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#5B8C3E" data-pp="virus" text-anchor="middle">Morphotype A</text>
    <text x="133.3" y="201" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene" text-anchor="middle">Morphotype B</text>
  </g>
  <g data-name="code-key">
    <text x="250" y="140" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#5B8C3E" data-pp="virus">Myo = Myoviridae, contractile tail</text>
    <text x="250" y="154" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#5B8C3E" data-pp="virus">Siph = Siphoviridae, long non-contractile tail</text>
    <text x="250" y="168" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">Pod = Podoviridae, short non-contractile tail</text>
    <text x="250" y="182" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">Auto = Autographiviridae, T7-like</text>
