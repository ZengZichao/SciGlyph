<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t-44 d-44" class="pp-diagram pp-trees" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-44">ANI基因组种簇树 / ANI Genome Species Cluster Tree</title>
  <desc id="d-44">骨架，配合fastANI/GTDB-Tk使用。ANI阈值(95%)下的基因组种簇状树。 关键词: phylogenetic tree, ani species tree, Cluster, fastANI, GTDB-Tk, skeleton template</desc>
  <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  <g data-name="cluster-bands">
    <rect x="350" y="50" width="200" height="100" fill="#2E86AB" fill-opacity="0.1" stroke="#2E86AB" stroke-width="0.5" data-pp="bacteria" rx="5"/>
    <rect x="350" y="170" width="200" height="80" fill="#A2305B" fill-opacity="0.1" stroke="#A2305B" stroke-width="0.5" data-pp="archaea" rx="5"/>
    <rect x="350" y="270" width="200" height="90" fill="#00857A" fill-opacity="0.1" stroke="#00857A" stroke-width="0.5" data-pp="metabolism" rx="5"/>
  </g>
  <g data-name="branches">
    <line x1="60" y1="200" x2="180" y2="200" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
