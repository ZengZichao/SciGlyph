    <line x1="320" y1="190" x2="450" y2="190" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="320" y1="230" x2="450" y2="230" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="320" y1="290" x2="320" y2="340" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="320" y1="290" x2="450" y2="290" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="320" y1="310" x2="450" y2="310" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="320" y1="340" x2="450" y2="340" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
  </g>
  <g data-name="ani-threshold">
    <line x1="300" y1="40" x2="300" y2="370" stroke="#C42D2D" stroke-width="1" data-pp="alert" stroke-dasharray="4 2"/>
    <text x="305" y="385" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">95% ANI</text>
  </g>
