    <line x1="320" y1="70" x2="320" y2="130" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="320" y1="70" x2="450" y2="70" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="320" y1="90" x2="450" y2="90" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="320" y1="110" x2="450" y2="110" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
