<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t-45 d-45" class="pp-diagram pp-trees" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-45">16S+MAGs混合树 / 16S+MAGs Mixed Tree</title>
  <desc id="d-45">骨架，配合GTDB-Tk/SILVA使用。16S rRNA与MAGs混合树，未培养分支用虚线表示。 关键词: phylogenetic tree, 16s mags mixed, 16S+MAGs, GTDB-Tk, SILVA, rRNA, skeleton template</desc>
  <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  <g data-name="branches">
    <line x1="60" y1="200" x2="180" y2="200" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="180" y1="120" x2="180" y2="280" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="180" y1="120" x2="350" y2="120" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="180" y1="280" x2="300" y2="280" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="350" y1="80" x2="350" y2="160" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="350" y1="80" x2="480" y2="80" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="350" y1="160" x2="480" y2="160" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-linecap="round"/>
    <line x1="300" y1="240" x2="300" y2="320" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-dasharray="4 2" stroke-linecap="round"/>
    <line x1="300" y1="240" x2="480" y2="240" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-dasharray="4 2" stroke-linecap="round"/>
    <line x1="300" y1="320" x2="480" y2="320" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-dasharray="4 2" stroke-linecap="round"/>
  </g>
  <g data-name="tips">
    <circle cx="480" cy="80" r="4" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="480" cy="160" r="4" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="480" cy="240" r="4" fill="#93A0AC" data-pp="muted"/>
    <circle cx="480" cy="320" r="4" fill="#2E86AB" data-pp="bacteria"/>
  </g>
  <g data-name="tip-labels">
    <text x="490" y="83" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Sp A</text>
    <text x="490" y="163" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Sp B</text>
    <text x="490" y="243" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">MAG C</text>
    <text x="490" y="323" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Sp D</text>
  </g>
  <g data-name="legend">
    <line x1="60" y1="370" x2="90" y2="370" stroke="#1B2733" stroke-width="1.5" data-pp="ink"/>
    <text x="95" y="374" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">cultured</text>
    <line x1="180" y1="370" x2="210" y2="370" stroke="#1B2733" stroke-width="1.5" data-pp="ink" stroke-dasharray="4 2"/>
    <text x="215" y="374" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted">MAG (uncultured)</text>
    <circle cx="480" cy="80" r="4" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="480" cy="160" r="4" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="480" cy="240" r="4" fill="#93A0AC" data-pp="muted"/>
    <circle cx="480" cy="320" r="4" fill="#2E86AB" data-pp="bacteria"/>
  </g>
