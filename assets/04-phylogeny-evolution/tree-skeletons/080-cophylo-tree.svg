<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t-48 d-48" class="pp-diagram pp-trees" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-48">共树(宿主-寄生虫) / Cophylogenetic Tree</title>
  <desc id="d-48">骨架，配合Jane/CoRe-PA使用。宿主-寄生虫共系统发育双树配对图。 关键词: phylogenetic tree, cophylo tree, Cophylogenetic, Jane, CoRe-PA, Host, Parasite, skeleton template, phylogenetics</desc>
  <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  <g data-name="host-tree">
    <text x="100" y="25" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#8C6D3F" data-pp="host" text-anchor="middle">Host</text>
    <line x1="40" y1="200" x2="100" y2="200" stroke="#8C6D3F" stroke-width="1.5" data-pp="host"/>
    <line x1="100" y1="120" x2="100" y2="280" stroke="#8C6D3F" stroke-width="1.5" data-pp="host"/>
    <line x1="100" y1="120" x2="180" y2="120" stroke="#8C6D3F" stroke-width="1.5" data-pp="host"/>
    <line x1="100" y1="280" x2="180" y2="280" stroke="#8C6D3F" stroke-width="1.5" data-pp="host"/>
    <line x1="180" y1="80" x2="180" y2="160" stroke="#8C6D3F" stroke-width="1.5" data-pp="host"/>
    <line x1="180" y1="80" x2="240" y2="80" stroke="#8C6D3F" stroke-width="1.5" data-pp="host"/>
    <line x1="180" y1="160" x2="240" y2="160" stroke="#8C6D3F" stroke-width="1.5" data-pp="host"/>
    <text x="250" y="83" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#8C6D3F" data-pp="host">H1</text>
    <text x="250" y="163" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#8C6D3F" data-pp="host">H2</text>
    <text x="250" y="283" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#8C6D3F" data-pp="host">H3</text>
  </g>
  <g data-name="parasite-tree">
    <text x="500" y="25" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#5B8C3E" data-pp="virus" text-anchor="middle">Parasite</text>
    <line x1="560" y1="200" x2="500" y2="200" stroke="#5B8C3E" stroke-width="1.5" data-pp="virus"/>
    <line x1="500" y1="120" x2="500" y2="280" stroke="#5B8C3E" stroke-width="1.5" data-pp="virus"/>
    <line x1="500" y1="120" x2="420" y2="120" stroke="#5B8C3E" stroke-width="1.5" data-pp="virus"/>
    <line x1="500" y1="280" x2="420" y2="280" stroke="#5B8C3E" stroke-width="1.5" data-pp="virus"/>
    <line x1="420" y1="80" x2="420" y2="160" stroke="#5B8C3E" stroke-width="1.5" data-pp="virus"/>
    <line x1="420" y1="80" x2="360" y2="80" stroke="#5B8C3E" stroke-width="1.5" data-pp="virus"/>
    <line x1="420" y1="160" x2="360" y2="160" stroke="#5B8C3E" stroke-width="1.5" data-pp="virus"/>
    <text x="340" y="83" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#5B8C3E" data-pp="virus" text-anchor="end">P1</text>
    <text x="340" y="163" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#5B8C3E" data-pp="virus" text-anchor="end">P2</text>
    <text x="340" y="283" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#5B8C3E" data-pp="virus" text-anchor="end">P3</text>
  </g>
  <g data-name="cospeciation-links">
    <line x1="245" y1="80" x2="355" y2="80" stroke="#93A0AC" stroke-width="0.8" data-pp="muted" stroke-dasharray="3 2"/>
    <line x1="245" y1="160" x2="355" y2="160" stroke="#93A0AC" stroke-width="0.8" data-pp="muted" stroke-dasharray="3 2"/>
    <line x1="185" y1="280" x2="415" y2="280" stroke="#93A0AC" stroke-width="0.8" data-pp="muted" stroke-dasharray="3 2"/>
  </g>
</svg>