<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="污水生物处理" data-name-en="Biological Wastewater Treatment" data-cat="05-eco-seq" data-tags="污水处理,活性污泥,曝气,二沉池,生物膜,固液分离" role="img" aria-labelledby="t-32-wastewater-treatment d-32-wastewater-treatment" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-32-wastewater-treatment">污水生物处理 / Biological Wastewater Treatment</title>
  <desc id="d-32-wastewater-treatment">曝气池中活性污泥絮体与生物膜填料降解有机物，二沉池完成固液分离，污泥沉降排出、上清液达标排放。关键词: 污水处理, 活性污泥, 曝气, 二沉池, 生物膜, 固液分离</desc>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 进水管与污染物 -->
  <path d="M6 16 H30 V30 H6 Z" fill="#7A8B93" fill-opacity="0.4" stroke="#2B3A42" stroke-width="1.2"/>
  <path d="M9 23 H20 m-3 -2.5 l3 2.5 l-3 2.5" stroke="#2B3A42" stroke-width="1.4"/>
  <circle cx="24" cy="21" r="2" fill="#7A8B93" stroke="none"/>
  <circle cx="28" cy="26" r="1.6" fill="#7A8B93" stroke="none"/>
  <!-- 曝气池 -->
  <rect x="8" y="32" width="50" height="54" rx="3" fill="#B7D7E8" fill-opacity="0.3" stroke="#1F6F8B" stroke-width="1.4"/>
  <path d="M8 42 H58" stroke="#1F6F8B" stroke-width="1.4"/>
  <!-- 曝气头与上升气泡 -->
  <path d="M12 80 H54" stroke="#7A8B93" stroke-width="2.4"/>
  <path d="M16 80 v4 M24 80 v4 M32 80 v4 M40 80 v4 M48 80 v4" stroke="#7A8B93" stroke-width="1.4"/>
  <circle cx="16" cy="72" r="3" fill="#DCEEE4" stroke="#1F6F8B" stroke-width="1.2"/>
  <circle cx="24" cy="60" r="4" fill="#DCEEE4" stroke="#1F6F8B" stroke-width="1.2"/>
  <circle cx="32" cy="68" r="2.6" fill="#DCEEE4" stroke="#1F6F8B" stroke-width="1.2"/>
  <circle cx="40" cy="56" r="3.4" fill="#DCEEE4" stroke="#1F6F8B" stroke-width="1.2"/>
  <circle cx="48" cy="70" r="3" fill="#DCEEE4" stroke="#1F6F8B" stroke-width="1.2"/>
  <circle cx="20" cy="50" r="2.4" fill="#DCEEE4" stroke="#1F6F8B" stroke-width="1.2"/>
  <!-- 活性污泥絮体与微生物 -->
  <circle cx="18" cy="76" r="5" fill="#DCEEE4" fill-opacity="0.8" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="35" cy="78" r="4" fill="#DCEEE4" fill-opacity="0.8" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="46" cy="77" r="3.4" fill="#DCEEE4" fill-opacity="0.8" stroke="#2E7D5B" stroke-width="1.2"/>
  <rect x="26" y="74" width="9" height="4.5" rx="2.2" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <path d="M12 56 C22 48 34 64 50 54 m-4 -2 l4 2 l-3 3" stroke="#5FA8C7" stroke-width="1.4"/>
  <!-- 溢流去二沉池 -->
  <path d="M58 40 H70 m-3 -2.5 l3 2.5 l-3 2.5" stroke="#1F6F8B" stroke-width="1.4"/>
  <path d="M64 40 V36" stroke="#1F6F8B" stroke-width="1.4" stroke-dasharray="2 2"/>
  <!-- 二沉池 -->
  <circle cx="90" cy="60" r="24" fill="#B7D7E8" fill-opacity="0.25" stroke="#1F6F8B" stroke-width="1.6"/>
  <rect x="83" y="38" width="14" height="7" rx="1.5" fill="#DCEEE4" stroke="#1F6F8B" stroke-width="1.2"/>
  <path d="M90 45 V60" stroke="#7A8B93" stroke-width="1.4"/>
  <path d="M70 60 H110" stroke="#7A8B93" stroke-width="1.4"/>
  <path d="M76 60 v5 M84 60 v5 M96 60 v5 M104 60 v5" stroke="#7A8B93" stroke-width="1.2"/>
  <path d="M68 74 Q90 94 112 74 L112 80 Q90 100 68 80 Z" fill="#2B3A42" fill-opacity="0.35" stroke="none"/>
  <path d="M76 80 h5 M86 84 h5 M98 79 h5" stroke="#2B3A42" stroke-width="1.4" stroke-opacity="0.5"/>
  <!-- 出水堰 -->
  <path d="M102 40 H113 m-3 -2.5 l3 2.5 l-3 2.5" stroke="#2E7D5B" stroke-width="1.4"/>
  <circle cx="112" cy="32" r="2" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <!-- 剩余污泥排放 -->
  <path d="M90 92 V104 m-3 -3 l3 3 l3 -3" stroke="#2B3A42" stroke-width="1.4" stroke-dasharray="3 2"/>
  <!-- 附着生物膜填料 -->
  <path d="M12 46 h14 M12 46 v6 M19 46 v6 M26 46 v6" stroke="#B57A17" stroke-width="1.4"/>
  <circle cx="12" cy="43" r="1.8" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="19" cy="43" r="1.6" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="26" cy="43" r="1.6" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <text x="33" y="98" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="9" fill="#2B3A42" stroke="none" text-anchor="middle">曝气池</text>
  <text x="90" y="112" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="9" fill="#2B3A42" stroke="none" text-anchor="middle">二沉池</text>
</g>
</svg>
