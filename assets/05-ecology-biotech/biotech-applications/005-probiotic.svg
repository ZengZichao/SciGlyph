<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="益生菌制剂" data-name-en="Probiotic Formulation" data-cat="05-eco-seq" data-tags="益生菌,制剂,微囊包埋,活菌,定植,低温储存" role="img" aria-labelledby="t-35-probiotic d-35-probiotic" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-35-probiotic">益生菌制剂 / Probiotic Formulation</title>
  <desc id="d-35-probiotic">活菌经微囊包埋与低温储存保持活性，进入肠道后脱囊释放并通过竞争排斥形成定殖优势</desc>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 制剂瓶 -->
  <path d="M12 56 q1 -10 9 -12 h10 q8 2 9 12" fill="#E8B04B" fill-opacity="0.45" stroke="#B57A17" stroke-width="1.6"/>
  <rect x="12" y="56" width="28" height="42" rx="6" fill="#E8B04B" fill-opacity="0.45" stroke="#B57A17" stroke-width="1.6"/>
  <rect x="20" y="36" width="12" height="10" fill="#E8B04B" fill-opacity="0.45" stroke="#B57A17" stroke-width="1.4"/>
  <rect x="16" y="28" width="20" height="9" rx="2" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
  <path d="M20 31 h12 M20 34 h12" stroke="#2E7D5B" stroke-width="1.2"/>
  <!-- 瓶身标签 -->
  <rect x="15" y="64" width="22" height="24" rx="2" fill="#DCEEE4" stroke="#5FA8C7" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="19" y="70" width="14" height="6" rx="3" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <path d="M22 73 A3 2.4 0 0 0 28 73" stroke="#1F6F8B" stroke-width="1.2"/>
  <circle cx="32" cy="80" r="3" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <!-- 活菌标记 -->
  <path d="M26 24 l1.6 1.6 l3.4 -3.4 M26 24 l-1.6 1.6 l-3.4 -3.4" stroke="#B57A17" stroke-width="1.4"/>
  <path d="M40 40 l1.4 1.4 l3 -3 M40 40 l-1.4 1.4 l-3 -3" stroke="#B57A17" stroke-width="1.2"/>
  <!-- 独立包装小袋 -->
  <path d="M54 40 l0 5 l4 -3 l4 3 l4 -3 l4 3 l0 -5 Z" fill="#DCEEE4" stroke="#B57A17" stroke-width="1.2"/>
  <path d="M54 40 H74 V94 H54 Z" fill="#DCEEE4" stroke="#B57A17" stroke-width="1.4"/>
  <path d="M56 46 H72" stroke="#B57A17" stroke-width="1.2" stroke-dasharray="2 2"/>
  <rect x="58" y="60" width="12" height="6" rx="3" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="64" cy="76" r="4" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="64" cy="86" r="3" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <path d="M54 52 l-3 3 M74 52 l3 3" stroke="#B57A17" stroke-width="1.2"/>
  <!-- 微囊包埋颗粒（肠溶保护） -->
  <circle cx="97" cy="58" r="17" fill="#B7D7E8" fill-opacity="0.3" stroke="#B57A17" stroke-width="1.4" stroke-dasharray="4 2"/>
  <rect x="88" y="52" width="12" height="6" rx="3" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="105" cy="54" r="3.4" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="98" cy="63" r="3.6" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <path d="M110 66 c3 1 4 3 4 5" stroke="#2E7D5B" stroke-width="1.2"/>
  <path d="M84 58 h-3 M110 58 h4 M97 39 v-3 M97 77 v3" stroke="#B57A17" stroke-width="1.2"/>
  <!-- 定植后释放的活菌 -->
  <path d="M78 74 l1.4 1.4 l3 -3 M78 74 l-1.4 1.4 l-3 -3" stroke="#B57A17" stroke-width="1.2"/>
  <!-- 低温储存 -->
  <path d="M97 20 v-10 M97 20 l-5 -4 M97 20 l5 -4 M97 20 l-5 4 M97 20 l5 4" stroke="#1F6F8B" stroke-width="1.4"/>
  <!-- 避免高温 -->
  <path d="M90 96 c2 -4 4 4 6 0 c2 -4 4 4 6 0" stroke="#C0504D" stroke-width="1.4"/>
  <path d="M86 88 l18 16 M104 88 l-18 16" stroke="#C0504D" stroke-width="1.4"/>
</g>
</svg>
