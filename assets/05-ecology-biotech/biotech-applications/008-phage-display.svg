  <path d="M105 91.5 H111 L112.5 93.5 L111 95.5 H105 L103.5 93.5 Z" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <path d="M108 95.5 V99" stroke="#1F6F8B" stroke-width="1.2"/>
  <path d="M97 100.5 H103 L104.5 102.5 L103 104.5 H97 L95.5 102.5 Z" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <path d="M100 104.5 V107" stroke="#1F6F8B" stroke-width="1.2"/>
