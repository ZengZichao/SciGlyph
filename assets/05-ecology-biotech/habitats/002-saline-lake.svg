<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="盐湖与嗜盐菌" data-name-en="Saline Lake Halophiles" data-cat="05-eco-seq" data-tags="盐湖,嗜盐菌,古菌,结晶盐,卤水" role="img" aria-labelledby="t-02-saline-lake d-02-saline-lake" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-02-saline-lake">盐湖与嗜盐菌 / Saline Lake Halophiles</title>
  <desc id="d-02-saline-lake">高盐卤水底部堆叠 NaCl 结晶盐格架，嗜盐古菌具类胡萝卜素红色膜与高渗适应机制维持细胞内外离子平衡</desc>
