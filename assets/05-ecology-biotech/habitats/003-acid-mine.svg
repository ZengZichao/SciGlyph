<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="酸性矿山与嗜酸菌" data-name-en="Acid Mine Drainage Acidophiles" data-cat="05-eco-seq" data-tags="酸性矿山,嗜酸菌,酸性矿排水,低pH,硫化物" role="img" aria-labelledby="t-03-acid-mine d-03-acid-mine" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-03-acid-mine">酸性矿山与嗜酸菌 / Acid Mine Drainage Acidophiles</title>
  <desc id="d-03-acid-mine">含硫岩层氧化生成酸性矿排水，坑木支护下的酸性滴液落入矿坑水潭，嗜酸菌以耐酸细胞壁抵抗 pH 1–3</desc>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 围岩顶板 -->
  <path d="M5 24 L20 17 L38 24 L56 16 L74 23 L92 16 L115 24 L115 5 L5 5 Z" fill="#7A8B93" fill-opacity="0.35" stroke="#2B3A42" stroke-width="1.4"/>
  <!-- 岩层 -->
  <path d="M5 48 L115 44" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 3"/>
  <path d="M5 66 L115 62" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 3"/>
  <!-- 坑木支护 -->
  <rect x="20" y="28" width="62" height="6" rx="1.5" fill="#E8B04B" stroke="#B57A17" stroke-width="1.4"/>
  <rect x="25" y="34" width="6" height="44" fill="#E8B04B" stroke="#B57A17" stroke-width="1.4"/>
  <rect x="71" y="34" width="6" height="44" fill="#E8B04B" stroke="#B57A17" stroke-width="1.4"/>
  <path d="M31 44 l40 26 M71 44 l-40 26" stroke="#B57A17" stroke-width="1.2"/>
  <!-- 酸性滴液：三段液滴轨迹 -->
  <path d="M38 36 c3 5 4 7 4 9 a4 4 0 0 1 -8 0 c0 -2 1 -4 4 -9 Z" fill="#F6DADA" stroke="#C0504D" stroke-width="1.4"/>
  <path d="M88 36 c3 5 4 7 4 9 a4 4 0 0 1 -8 0 c0 -2 1 -4 4 -9 Z" fill="#F6DADA" stroke="#C0504D" stroke-width="1.4"/>
  <path d="M52 48 v6 m-2 -3 l2 3 l2 -3" stroke="#C0504D" stroke-width="1.2" stroke-dasharray="2 2"/>
  <path d="M54 58 c3 5 4 7 4 9 a4 4 0 0 1 -8 0 c0 -2 1 -4 4 -9 Z" fill="#F6DADA" stroke="#C0504D" stroke-width="1.4"/>
  <!-- 酸性矿坑水潭 -->
  <path d="M5 86 Q30 79 60 84 T115 81 L115 97 L5 97 Z" fill="#F6DADA" fill-opacity="0.6" stroke="#C0504D" stroke-width="1.4"/>
  <!-- 嗜酸菌：厚壁 + 内部硫粒 -->
  <rect x="36" y="86" width="30" height="13" rx="6.5" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="2"/>
  <rect x="39" y="88.5" width="24" height="8" rx="4" fill="none" stroke="#B57A17" stroke-width="1.4"/>
  <circle cx="47" cy="92.5" r="2" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <circle cx="56" cy="92.5" r="2" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <path d="M66 89 C72 85 74 97 81 92" stroke="#2E7D5B" stroke-width="1.4"/>
  <!-- 硫化物析出 -->
  <circle cx="90" cy="70" r="2.4" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <circle cx="99" cy="60" r="2" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <circle cx="22" cy="72" r="2.2" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <!-- 坑内轨道 -->
  <path d="M5 78 H115" stroke="#2B3A42" stroke-width="1.4"/>
  <path d="M14 74 v8 M40 74 v8 M66 74 v8 M92 74 v8" stroke="#7A8B93" stroke-width="1.2"/>
</g>
</svg>
