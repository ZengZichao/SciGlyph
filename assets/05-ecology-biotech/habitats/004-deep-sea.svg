<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="深海高压环境" data-name-en="Deep-Sea High-Pressure Habitat" data-cat="05-eco-seq" data-tags="深海,高压,嗜压菌,水体分层,沉积物" role="img" aria-labelledby="t-04-deep-sea d-04-deep-sea" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-04-deep-sea">深海高压环境 / Deep-Sea High-Pressure Habitat</title>
  <desc id="d-04-deep-sea">水柱随深度压强递增、光照逐层衰减，嗜压菌受向心压力挤压并以细胞膜成分调整等机制适应深海高压</desc>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 水柱分层：自上而下压强递增、光照衰减 -->
  <path d="M5 5 H115 V26 H5 Z" fill="#B7D7E8" fill-opacity="0.5" stroke="none"/>
  <path d="M5 26 H115 V50 H5 Z" fill="#B7D7E8" fill-opacity="0.34" stroke="none"/>
  <path d="M5 50 H115 V76 H5 Z" fill="#B7D7E8" fill-opacity="0.22" stroke="none"/>
  <path d="M5 76 H115 V100 H5 Z" fill="#B7D7E8" fill-opacity="0.13" stroke="none"/>
  <path d="M5 26 H115" stroke="#5FA8C7" stroke-width="1.2" stroke-dasharray="2 3"/>
  <path d="M5 50 H115" stroke="#5FA8C7" stroke-width="1.2" stroke-dasharray="2 3"/>
  <path d="M5 76 H115" stroke="#5FA8C7" stroke-width="1.2" stroke-dasharray="2 3"/>
  <!-- 深度轴 -->
  <path d="M12 12 V96 m-3 -3 l3 3 l3 -3" stroke="#2B3A42" stroke-width="1.4"/>
  <path d="M9 26 h6 M9 50 h6 M9 76 h6 M9 96 h6" stroke="#2B3A42" stroke-width="1.2"/>
  <!-- 海面波光 -->
  <path d="M5 8 Q20 4 35 8 T65 8 T95 8 T115 8" stroke="#5FA8C7" stroke-width="1.2"/>
  <!-- 内外压力箭头（向心挤压） -->
  <path d="M23 50 l7 8 l-7 8" stroke="#C0504D" stroke-width="1.4"/>
  <path d="M97 50 l-7 8 l7 8" stroke="#C0504D" stroke-width="1.4"/>
  <path d="M60 22 v8 m-3 -3 l3 3 l3 -3" stroke="#C0504D" stroke-width="1.4"/>
  <path d="M60 86 v-8 m-3 3 l3 -3 l3 3" stroke="#C0504D" stroke-width="1.4"/>
  <!-- 嗜压杆菌（受压形态） -->
  <path d="M41 58 C41 48 79 48 79 58 C79 68 41 68 41 58 Z" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="2"/>
  <path d="M48 58 A8 6 0 0 0 66 58" stroke="#1F6F8B" stroke-width="1.4"/>
  <path d="M79 54 C88 48 90 66 100 60" stroke="#2E7D5B" stroke-width="1.4"/>
  <path d="M41 62 C34 58 32 70 24 66" stroke="#2E7D5B" stroke-width="1.4"/>
  <!-- 海洋雪颗粒 -->
  <circle cx="24" cy="34" r="2" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2"/>
  <circle cx="96" cy="40" r="1.8" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2"/>
  <circle cx="100" cy="70" r="2" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2"/>
  <circle cx="20" cy="82" r="1.8" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2"/>
  <circle cx="46" cy="24" r="1.6" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2"/>
  <!-- 深海沉积物 -->
  <path d="M5 100 Q30 96 60 99 T115 97 L115 114 L5 114 Z" fill="#7A8B93" fill-opacity="0.4" stroke="#2B3A42" stroke-width="1.4"/>
  <path d="M5 107 Q40 103 70 106 T115 104" stroke="#2B3A42" stroke-width="1.2" stroke-dasharray="2 3"/>
  <circle cx="20" cy="110" r="1.6" fill="#7A8B93" stroke="none"/>
  <circle cx="44" cy="111" r="1.6" fill="#7A8B93" stroke="none"/>
  <circle cx="72" cy="109" r="1.6" fill="#7A8B93" stroke="none"/>
  <circle cx="98" cy="111" r="1.6" fill="#7A8B93" stroke="none"/>
  <!-- 沉积物中的深层休眠细胞 -->
  <rect x="30" y="103" width="13" height="6" rx="3" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <rect x="80" y="102" width="13" height="6" rx="3" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
</g>
</svg>
