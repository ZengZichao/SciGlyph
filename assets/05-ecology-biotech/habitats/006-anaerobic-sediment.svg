<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="沉积物厌氧层" data-name-en="Anaerobic Sediment Zones" data-cat="05-eco-seq" data-tags="沉积物,厌氧层,硫酸盐还原,产甲烷,氧化还原界面" role="img" aria-labelledby="t-06-anaerobic-sediment d-06-anaerobic-sediment" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-06-anaerobic-sediment">沉积物厌氧层 / Anaerobic Sediment Zones</title>
  <desc id="d-06-anaerobic-sediment">沉积物自上而下由含氧层过渡到硫酸盐还原带与产甲烷带，硫粒沉积、甲烷与硫化氢气泡向上逸散。关键词: 沉积物, 厌氧层, 硫酸盐还原, 产甲烷, 氧化还原界面</desc>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 上覆水体 -->
  <path d="M5 5 H115 V22 H5 Z" fill="#B7D7E8" fill-opacity="0.4" stroke="none"/>
  <path d="M5 22 Q30 19 60 22 T115 20" stroke="#5FA8C7" stroke-width="1.4"/>
  <!-- 含氧层 -->
  <path d="M5 21 Q30 18 60 21 T115 19 L115 40 L5 40 Z" fill="#DCEEE4" fill-opacity="0.7" stroke="none"/>
  <circle cx="24" cy="29" r="2.2" fill="none" stroke="#5FA8C7" stroke-width="1.2"/>
  <circle cx="42" cy="25" r="2.8" fill="none" stroke="#5FA8C7" stroke-width="1.2"/>
  <circle cx="80" cy="28" r="2.2" fill="none" stroke="#5FA8C7" stroke-width="1.2"/>
  <circle cx="98" cy="24" r="2.6" fill="none" stroke="#5FA8C7" stroke-width="1.2"/>
  <!-- 氧化还原界面 -->
  <path d="M5 40 Q30 37 60 40 T115 38" stroke="#B57A17" stroke-width="1.4" stroke-dasharray="4 3"/>
  <!-- 厌氧（硫酸盐还原带） -->
  <path d="M5 40 Q30 37 60 40 T115 38 L115 80 L5 80 Z" fill="#7A8B93" fill-opacity="0.18" stroke="none"/>
  <!-- 深层产甲烷带 -->
  <path d="M5 80 H115 L115 104 L5 104 Z" fill="#2B3A42" fill-opacity="0.14" stroke="none"/>
  <path d="M5 80 H115" stroke="#2B3A42" stroke-width="1.2" stroke-dasharray="2 3"/>
  <path d="M5 104 Q30 100 60 103 T115 101 L115 114 L5 114 Z" fill="#7A8B93" fill-opacity="0.4" stroke="#2B3A42" stroke-width="1.4"/>
  <!-- 深度轴 -->
  <path d="M11 8 V100 m-3 -3 l3 3 l3 -3" stroke="#2B3A42" stroke-width="1.4"/>
  <path d="M8 22 h6 M8 40 h6 M8 80 h6 M8 104 h6" stroke="#2B3A42" stroke-width="1.2"/>
  <!-- 硫酸根离子 -->
  <rect x="86" y="46" width="5" height="5" fill="none" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="22" y="52" width="5" height="5" fill="none" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="100" y="60" width="5" height="5" fill="none" stroke="#1F6F8B" stroke-width="1.2"/>
  <!-- 硫酸盐还原杆菌 -->
  <rect x="40" y="56" width="32" height="13" rx="6.5" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="2"/>
  <path d="M48 62.5 A8 6 0 0 1 64 62.5" stroke="#1F6F8B" stroke-width="1.4"/>
  <circle cx="53" cy="62.5" r="2" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <circle cx="61" cy="62.5" r="2" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <path d="M72 60 C80 54 82 70 90 64" stroke="#2E7D5B" stroke-width="1.4"/>
  <!-- 硫化氢 -->
  <circle cx="78" cy="76" r="2.2" fill="#F6DADA" stroke="#C0504D" stroke-width="1.2"/>
  <circle cx="30" cy="72" r="2" fill="#F6DADA" stroke="#C0504D" stroke-width="1.2"/>
  <!-- 甲烷气泡上逸 -->
  <circle cx="98" cy="30" r="3" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="102" cy="40" r="2.4" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="96" cy="50" r="3.4" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <path d="M96 50 v-8 m-2.5 3 l2.5 -3 l2.5 3" stroke="#2E7D5B" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- 底层产甲烷古菌 -->
  <circle cx="32" cy="92" r="6" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
  <path d="M32 89.5 a2.5 2.5 0 0 1 0 5 a2.5 2.5 0 0 1 0 -5" stroke="#1F6F8B" stroke-width="1.2"/>
  <rect x="76" y="88" width="22" height="10" rx="5" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
  <path d="M84 93 a5 3.5 0 0 0 6 0" stroke="#1F6F8B" stroke-width="1.2"/>
</g>
</svg>
