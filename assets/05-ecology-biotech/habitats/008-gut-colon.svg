  <rect x="12" y="20" width="16" height="7" rx="3.5" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
  <circle cx="40" cy="18" r="4" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
  <circle cx="48" cy="23" r="3.4" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
