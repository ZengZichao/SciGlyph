  <rect x="96" y="23" width="14" height="6" rx="3" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
  <circle cx="26" cy="52" r="3.4" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="56" cy="52" r="3" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="84" cy="52" r="3.2" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
