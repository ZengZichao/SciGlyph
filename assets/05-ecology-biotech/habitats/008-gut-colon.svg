  <rect x="44" y="76" width="11" height="5.5" rx="2.75" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="71" cy="70" r="3.2" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <rect x="92" y="62" width="12" height="6" rx="3" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
  <circle cx="99" cy="76" r="3.2" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.2"/>
