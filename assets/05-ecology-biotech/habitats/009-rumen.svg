<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="瘤胃发酵" data-name-en="Rumen Fermentation" data-cat="05-eco-seq" data-tags="瘤胃,反刍动物,发酵,网状组织,纤维降解" role="img" aria-labelledby="t-09-rumen d-09-rumen" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-09-rumen">瘤胃发酵 / Rumen Fermentation</title>
