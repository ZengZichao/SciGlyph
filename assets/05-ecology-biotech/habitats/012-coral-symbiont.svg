<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="珊瑚共生虫黄藻" data-name-en="Coral–Symbiodinium Symbiosis" data-cat="05-eco-seq" data-tags="珊瑚,共生,虫黄藻,刺胞,光合共生" role="img" aria-labelledby="t-12-coral-symbiont d-12-coral-symbiont" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-12-coral-symbiont">珊瑚共生虫黄藻 / Coral–Symbiodinium Symbiosis</title>
  <desc id="d-12-coral-symbiont">虫黄藻寄居于珊瑚虫胃循环腔的光合细胞内，向宿主输出光合产物，并随卵垂直传递给后代。关键词: 珊瑚, 共生, 虫黄藻, 刺胞, 光合共生</desc>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
