  <path d="M10 16 V100 m-3 -3 l3 3 l3 -3" stroke="#2B3A42" stroke-width="1.4"/>
  <path d="M7 14 h6 M7 46 h6 M7 66 h6 M7 88 h6" stroke="#2B3A42" stroke-width="1.2"/>
  <path d="M110 12 v8 m-2.5 -2.5 l2.5 2.5 l2.5 -2.5" stroke="#E8B04B" stroke-width="1.4"/>
