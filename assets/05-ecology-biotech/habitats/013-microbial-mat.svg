  <rect x="56" y="52" width="18" height="8" rx="4" fill="#F6DADA" stroke="#C0504D" stroke-width="1.4"/>
  <circle cx="86" cy="56" r="4.4" fill="#F6DADA" stroke="#C0504D" stroke-width="1.4"/>
  <circle cx="98" cy="59" r="3.4" fill="#F6DADA" stroke="#C0504D" stroke-width="1.4"/>
  <path d="M5 66 H115" stroke="#C0504D" stroke-width="1.4"/>
  <!-- 第 3 层：硫酸盐还原菌（黑层） -->
  <path d="M5 66 H115 V88 H5 Z" fill="#2B3A42" fill-opacity="0.55" stroke="none"/>
  <path d="M5 66 H115" stroke="#C0504D" stroke-width="1.4"/>
  <rect x="24" y="72" width="18" height="8" rx="4" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
