  <circle cx="46" cy="60" r="2.6" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2"/>
  <circle cx="44" cy="50" r="2" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2"/>
  <circle cx="70" cy="58" r="2.4" fill="#DCEEE4" stroke="#7A8B93" stroke-width="1.2"/>
