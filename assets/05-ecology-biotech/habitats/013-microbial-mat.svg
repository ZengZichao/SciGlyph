  <circle cx="86" cy="76" r="5" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
  <circle cx="52" cy="80" r="2" fill="#E8B04B" stroke="#B57A17" stroke-width="1.2"/>
  <path d="M5 88 H115" stroke="#2B3A42" stroke-width="1.4"/>
  <!-- 底层沉积物 -->
  <path d="M5 88 H115 V104 L5 104 Z" fill="#7A8B93" fill-opacity="0.45" stroke="none"/>
  <path d="M5 104 Q30 100 60 103 T115 101 L115 114 L5 114 Z" fill="#7A8B93" fill-opacity="0.5" stroke="#2B3A42" stroke-width="1.4"/>
  <circle cx="24" cy="97" r="1.8" fill="#7A8B93" stroke="none"/>
  <circle cx="70" cy="96" r="1.6" fill="#7A8B93" stroke="none"/>
  <circle cx="96" cy="98" r="1.6" fill="#7A8B93" stroke="none"/>
