<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="微生物垫分层" data-name-en="Microbial Mat Stratification" data-cat="05-eco-seq" data-tags="微生物垫,分层,蓝细菌,硫化物,光衰减" role="img" aria-labelledby="t-13-microbial-mat d-13-microbial-mat" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-13-microbial-mat">微生物垫分层 / Microbial Mat Stratification</title>
  <desc id="d-13-microbial-mat">微生物垫由表层产氧蓝细菌、紫硫细菌、硫酸盐还原黑层至沉积物逐层堆叠，光照与代谢底物随深度递减</desc>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 表层絮状物与逸气 -->
  <path d="M5 12 Q22 6 40 11 Q60 4 80 10 Q100 5 115 11" stroke="#E8B04B" stroke-width="1.4" stroke-opacity="0.7"/>
  <circle cx="30" cy="16" r="3" fill="#DCEEE4" stroke="#5FA8C7" stroke-width="1.2"/>
  <circle cx="72" cy="15" r="2.4" fill="#DCEEE4" stroke="#5FA8C7" stroke-width="1.2"/>
  <circle cx="96" cy="17" r="2.8" fill="#DCEEE4" stroke="#5FA8C7" stroke-width="1.2"/>
  <!-- 第 1 层：产氧型蓝细菌（表层） -->
  <path d="M5 14 Q30 11 60 14 T115 13 L115 46 L5 46 Z" fill="#DCEEE4" fill-opacity="0.75" stroke="none"/>
  <path d="M22 18 C20 28 24 36 22 44" stroke="#2E7D5B" stroke-width="1.4"/>
  <path d="M34 17 C32 28 36 36 34 45" stroke="#2E7D5B" stroke-width="1.4"/>
