  <circle cx="56" cy="26" r="4" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
  <circle cx="66" cy="34" r="3.4" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
  <rect x="44" y="36" width="14" height="7" rx="3.5" fill="#DCEEE4" stroke="#2E7D5B" stroke-width="1.4"/>
  <path d="M5 46 H115" stroke="#2E7D5B" stroke-width="1.4"/>
  <!-- 第 2 层：光合硫细菌（紫硫细菌） -->
  <path d="M5 46 H115 V66 H5 Z" fill="#C0504D" fill-opacity="0.2" stroke="none"/>
  <path d="M5 46 H115" stroke="#2E7D5B" stroke-width="1.4"/>
  <circle cx="26" cy="55" r="4.6" fill="#F6DADA" stroke="#C0504D" stroke-width="1.4"/>
