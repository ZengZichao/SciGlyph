<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="冰雪微生物" data-name-en="Snow and Ice Microbiome" data-cat="05-eco-seq" data-tags="冰雪,嗜冷菌,冰晶,雪藻,融化" role="img" aria-labelledby="t-14-snow-ice d-14-snow-ice" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-14-snow-ice">冰雪微生物 / Snow and Ice Microbiome</title>
  <desc id="d-14-snow-ice">嗜冷菌与产色素雪藻封存于冰晶六方晶格中，融化时借冰核颗粒表面迅速恢复代谢活动。关键词: 冰雪, 嗜冷菌, 冰晶, 雪藻, 融化</desc>
