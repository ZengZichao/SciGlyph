    <line x1="5" y1="50" x2="95" y2="50" stroke="#C42D2D" stroke-width="0.8" stroke-linecap="round" data-pp="alert" stroke-dasharray="3,2"/>
    <line x1="5" y1="60" x2="95" y2="60" stroke="#93A0AC" stroke-width="0.8" stroke-linecap="round" data-pp="muted" stroke-dasharray="3,2"/>
    <rect x="20" y="65" width="5" height="5" rx="1" fill="#A2305B" stroke="#1B2733" stroke-width="0.8" data-pp="archaea"/>
    <rect x="40" y="68" width="5" height="5" rx="1" fill="#A2305B" stroke="#1B2733" stroke-width="0.8" data-pp="archaea"/>
