    <rect x="5" y="30" width="90" height="45" rx="2" fill="#A2305B" stroke="#1B2733" stroke-width="1.5" data-pp="archaea" fill-opacity="0.2"/>
    <line x1="5" y1="30" x2="95" y2="30" stroke="#A2305B" stroke-width="1.5" stroke-linecap="round" data-pp="archaea"/>
    <rect x="20" y="40" width="8" height="8" rx="0.5" fill="#A2305B" stroke="#1B2733" stroke-width="1.2" data-pp="archaea"/>
    <rect x="45" y="45" width="8" height="8" rx="0.5" fill="#A2305B" stroke="#1B2733" stroke-width="1.2" data-pp="archaea"/>
    <rect x="65" y="38" width="8" height="8" rx="0.5" fill="#A2305B" stroke="#1B2733" stroke-width="1.2" data-pp="archaea"/>
    <circle cx="30" cy="35" r="2" fill="#F4F1EA" stroke="#1B2733" stroke-width="0.5" data-pp="bg"/>
    <circle cx="55" cy="33" r="1.5" fill="#F4F1EA" stroke="#1B2733" stroke-width="0.5" data-pp="bg"/>
