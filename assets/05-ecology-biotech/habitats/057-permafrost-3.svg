    <line x1="5" y1="30" x2="95" y2="30" stroke="#93A0AC" stroke-width="1.5" stroke-linecap="round" data-pp="muted" stroke-dasharray="4,2"/>
    <path d="M25,30 L28,70 L22,70 Z" fill="#F4F1EA" stroke="#1B2733" stroke-width="0.8" stroke-linecap="round" data-pp="bg"/>
    <path d="M65,30 L68,65 L62,65 Z" fill="#F4F1EA" stroke="#1B2733" stroke-width="0.8" stroke-linecap="round" data-pp="bg"/>
    <path d="M15,18 Q25,15 35,18 Q40,20 45,18" fill="#2E86AB" stroke="#2E86AB" stroke-width="1.2" stroke-linecap="round" data-pp="bacteria"/>
    <path d="M55,20 Q65,17 75,20" fill="#2E86AB" stroke="#2E86AB" stroke-width="1.2" stroke-linecap="round" data-pp="bacteria"/>
    <circle cx="45" cy="17" r="1.5" fill="#2E86AB" stroke="none" stroke-width="0" data-pp="bacteria"/>
    <circle cx="47" cy="16" r="1.5" fill="#2E86AB" stroke="none" stroke-width="0" data-pp="bacteria"/>
