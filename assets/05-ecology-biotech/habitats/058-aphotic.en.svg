    <line x1="15" y1="15" x2="25" y2="25" stroke="#93A0AC" stroke-width="1" stroke-linecap="round" data-pp="muted"/>
    <line x1="25" y1="15" x2="15" y2="25" stroke="#93A0AC" stroke-width="1" stroke-linecap="round" data-pp="muted"/>
    <rect x="35" y="40" width="8" height="3" rx="1.5" fill="#2E86AB" stroke="#1B2733" stroke-width="1" data-pp="bacteria" transform="rotate(15,39,42)"/>
