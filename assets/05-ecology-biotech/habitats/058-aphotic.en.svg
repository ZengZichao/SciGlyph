    <circle cx="45" cy="35" r="1.5" fill="#00857A" stroke="none" stroke-width="0" data-pp="metabolism"/>
    <circle cx="50" cy="55" r="1.5" fill="#00857A" stroke="none" stroke-width="0" data-pp="metabolism"/>
    <circle cx="65" cy="60" r="1.5" fill="#00857A" stroke="none" stroke-width="0" data-pp="metabolism"/>
    <circle cx="30" cy="55" r="1.5" fill="#00857A" stroke="none" stroke-width="0" data-pp="metabolism"/>
