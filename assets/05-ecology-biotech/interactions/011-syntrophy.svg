<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-eco-interactions" role="img" aria-labelledby="t-syntrophy d-syntrophy" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-syntrophy">互营 / Syntrophy</title>
  <desc id="d-syntrophy">Syntrophy: butyrate-oxidizing bacterium (C₄) transfers H₂/formate to methanogen (CH₄), keeping H₂ partial pressure low; mutual benefit 关键词: syntrophy, H2, methanogenesis</desc>

  <g id="layer-body" data-name="body">
    <circle cx="30" cy="45" r="12" fill="#2E86AB" stroke="#1B2733" stroke-width="1.5" data-pp="bacteria"/>
    <text x="30" y="48" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#FFFFFF" data-pp="white">C₄</text>
    <rect x="58" y="33" width="24" height="24" rx="2" fill="#A2305B" stroke="#1B2733" stroke-width="1.5" data-pp="archaea"/>
    <text x="70" y="50" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#FFFFFF" data-pp="white">CH₄</text>
    <line x1="42" y1="42" x2="58" y2="42" stroke="#00857A" stroke-width="1.5" stroke-linecap="round" data-pp="metabolism"/>
    <path d="M56,40 L60,42 L56,44" fill="#00857A" stroke="#00857A" stroke-width="1" stroke-linecap="round" data-pp="metabolism"/>
    <text x="50" y="38" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#00857A" data-pp="metabolism">H₂</text>
  </g>
  
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#1B2733" data-pp="ink">互营</text>
  </g>
</svg>