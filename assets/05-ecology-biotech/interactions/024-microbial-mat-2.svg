<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-eco-interactions" role="img" aria-labelledby="t-microbial_mat d-microbial_mat" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-microbial_mat">微生物席 / Microbial Mat</title>
  <desc id="d-microbial_mat">Stratified microbial mat with photosynthetic, SRB and methanogen layers 关键词: microbial mat, stratification, layers</desc>
  
  <g id="layer-body" data-name="body">
    <rect x="15" y="25" width="70" height="12" rx="2" fill="#00857A" stroke="#1B2733" stroke-width="1" data-pp="metabolism"/>
    <text x="50" y="33" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#FFFFFF" data-pp="white">光合</text>
    <rect x="15" y="37" width="70" height="12" rx="2" fill="#2E86AB" stroke="#1B2733" stroke-width="1" data-pp="bacteria"/>
    <text x="50" y="45" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#FFFFFF" data-pp="white">硫酸盐还原</text>
    <rect x="15" y="49" width="70" height="12" rx="2" fill="#A2305B" stroke="#1B2733" stroke-width="1" data-pp="archaea"/>
    <text x="50" y="57" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#FFFFFF" data-pp="white">产甲烷</text>
    <rect x="15" y="61" width="70" height="10" rx="2" fill="#8C6D3F" stroke="#1B2733" stroke-width="1" data-pp="host" fill-opacity="0.5"/>
    <line x1="30" y1="37" x2="30" y2="49" stroke="#00857A" stroke-width="0.8" stroke-linecap="round" data-pp="metabolism" stroke-dasharray="2,2"/>
    <line x1="70" y1="49" x2="70" y2="37" stroke="#00857A" stroke-width="0.8" stroke-linecap="round" data-pp="metabolism" stroke-dasharray="2,2"/>
  </g>
  
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#1B2733" data-pp="ink">微生物席</text>
  </g>
</svg>