    <line x1="40" y1="55" x2="60" y2="55" stroke="#1B2733" stroke-width="1.5" stroke-linecap="round" data-pp="ink"/>
    <path d="M37,46 L35,50 L39,48" fill="#1B2733" stroke="#1B2733" stroke-width="1" stroke-linecap="round" data-pp="ink"/>
    <path d="M63,46 L65,50 L61,48" fill="#1B2733" stroke="#1B2733" stroke-width="1" stroke-linecap="round" data-pp="ink"/>
