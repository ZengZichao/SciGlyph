<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     class="pp-diagram pp-workflow" role="img" aria-labelledby="t-01_16s_amplicon_pipeline d-01_16s_amplicon_pipeline" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-01_16s_amplicon_pipeline">16S 扩增子分析全流程 / 16S Amplicon Pipeline</title>
  <desc id="d-01_16s_amplicon_pipeline">骨架流程：样本→DNA提取→V4区扩增→Illumina双端测序→DADA2/QIIME2质控去噪→SILVA/GTDB分类注释→Alpha/Beta多样性→统计检验。工具：DADA2, QIIME2, SILVA, GTDB。输入：FASTQ；输出：ASV表、多样性指数、统计结果。 关键词: bioinformatics workflow, 16s amplicon pipeline, DNA, Illumina, DADA2, QIIME2, SILVA, skeleton template, diversity</desc>
<defs>
  <marker id="pp01__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
