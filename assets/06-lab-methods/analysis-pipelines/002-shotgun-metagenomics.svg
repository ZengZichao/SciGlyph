  <title id="t-02_shotgun_metagenomics">宏基因组鸟枪法流程 / Shotgun Metagenomics Pipeline</title>
  <desc id="d-02_shotgun_metagenomics">骨架流程：样本→DNA提取→建库→鸟枪法测序→MEGAHIT组装→MetaBAT2分箱→CheckM2质量评估→Prokka注释→Bin比较分析。工具：MEGAHIT, MetaBAT2, CheckM2, Prokka。输入：FASTQ；输出：MAGs、注释GFF。 关键词: bioinformatics workflow, shotgun metagenomics, DNA, MEGAHIT, MetaBAT2, CheckM2, Prokka, skeleton template</desc>
