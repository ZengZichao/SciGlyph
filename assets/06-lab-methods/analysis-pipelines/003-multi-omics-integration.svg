  <title id="t-03_multi_omics_integration">多组学整合流程 / Multi-Omics Integration</title>
  <desc id="d-03_multi_omics_integration">骨架流程：宏基因组+宏转录组+宏蛋白组+代谢组四组学联用整合分析。工具：Trinity/Salmon(宏转录组), MaxQuant, MetaboAnalyst, mixOmics。输入：各组学数据矩阵；输出：整合通路图、关联网络。 关键词: bioinformatics workflow, multi omics integration, Multi-Omics, Trinity, Salmon, MaxQuant, MetaboAnalyst, mixOmics, Metagenomics, DNA, skeleton template</desc>
