  <title id="t-04_single_cell_genomics">单细胞基因组学流程 / Single-Cell Genomics</title>
  <desc id="d-04_single_cell_genomics">骨架流程：样本→FACS分选→WGA多重置换扩增→质控→组装→注释→SAG分析。工具：FACS, Phi29 MDA, SPAdes, Prokka。输入：单细胞；输出：SAG基因组。 关键词: bioinformatics workflow, single cell genomics, Single-Cell, FACS, WGA, SAG, MDA, SPAdes, Prokka, skeleton template</desc>
<defs>
  <marker id="pp04__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
  <g id="pp04__bg" data-name="background">
