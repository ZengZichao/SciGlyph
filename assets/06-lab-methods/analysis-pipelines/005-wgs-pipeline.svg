<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     class="pp-diagram pp-workflow" role="img" aria-labelledby="t-05_wgs_pipeline d-05_wgs_pipeline" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-05_wgs_pipeline">全基因组测序流程 / WGS Pipeline</title>
  <desc id="d-05_wgs_pipeline">骨架流程：培养→DNA提取→全基因组测序→质控修剪→组装→注释→系统发育分析→树可视化。工具：SPAdes, Prokka, IQ-TREE, FigTree。输入：纯培养物；输出：完整基因组、系统发育树。 关键词: bioinformatics workflow, wgs pipeline, DNA, SPAdes, Prokka, IQ-TREE, FigTree, Culture, skeleton template, phylogenetics</desc>
