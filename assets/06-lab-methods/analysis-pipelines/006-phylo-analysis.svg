<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     class="pp-diagram pp-workflow" role="img" aria-labelledby="t-06_phylo_analysis d-06_phylo_analysis" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-06_phylo_analysis">系统发育分析流程 / Phylogenetic Analysis Pipeline</title>
  <desc id="d-06_phylo_analysis">骨架流程：选择标记基因→MAFFT多序列比对→trimAl修剪→IQ-TREE/FastTree建树→Bootstrap支持度→FigTree/iTOL可视化。工具：MAFFT, trimAl, IQ-TREE, FastTree, FigTree, iTOL。输入：FASTA比对；输出：系统发育树。 关键词: bioinformatics workflow, phylo analysis, MAFFT, trimAl, IQ-TREE, FastTree, Bootstrap, skeleton template, phylogenetics</desc>
<defs>
  <marker id="pp06__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
  <g id="pp06__bg" data-name="background">
    <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  </g>
  <g id="pp06__labels" data-name="labels">
  <rect x="20" y="70" width="105" height="48" rx="8" ry="8"
        fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1.5"/>
    <text x="72.5" y="98.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Marker Gene</text>

  <rect x="145" y="70" width="105" height="48" rx="8" ry="8"
