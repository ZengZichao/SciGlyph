    <text x="197.5" y="236.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Bootstrap</text>

  <rect x="270" y="208" width="105" height="48" rx="8" ry="8"
