    <text x="72.5" y="236.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">FastTree</text>

  <rect x="145" y="208" width="105" height="48" rx="8" ry="8"
