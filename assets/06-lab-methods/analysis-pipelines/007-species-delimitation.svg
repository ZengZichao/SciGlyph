  <title id="t-07_species_delimitation">物种界定流程 / Species Delimitation Pipeline</title>
  <desc id="d-07_species_delimitation">骨架流程：基因组对→ANI计算→dDDH计算→阈值判定→GTDB-Tk归类→分类→是否新种判定。工具：FastANI, GTDB-Tk, dDDH。输入：基因组FASTA；输出：物种分类、ANI矩阵。 关键词: bioinformatics workflow, species delimitation, dDDH, GTDB-Tk, FastANI, skeleton template</desc>
<defs>
  <marker id="pp07__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
  <g id="pp07__bg" data-name="background">
