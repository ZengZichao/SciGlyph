  <title id="t-08_pangenome_analysis">泛基因组分析流程 / Pangenome Analysis Pipeline</title>
  <desc id="d-08_pangenome_analysis">骨架流程：收集基因组→注释→Roary/Panaroo泛基因组分析→核心基因/附属基因→核心基因树→热图可视化。工具：Roary, Panaroo, Prokka。输入：GFF文件集；输出：泛基因组矩阵、核心基因树。 关键词: bioinformatics workflow, pangenome analysis, Roary, Panaroo, Prokka, GFF, skeleton template, heatmap</desc>
