  <rect x="320" y="80" width="110" height="50" rx="8" ry="8"
        fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1.5"/>
    <text x="375.0" y="109.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">CARD DB</text>

  <rect x="40" y="220" width="110" height="50" rx="8" ry="8"
        fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1.5"/>
    <text x="95.0" y="249.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">BLAST Search</text>

  <rect x="180" y="220" width="110" height="50" rx="8" ry="8"
