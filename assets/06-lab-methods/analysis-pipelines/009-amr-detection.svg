<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     class="pp-diagram pp-workflow" role="img" aria-labelledby="t-09_amr_detection d-09_amr_detection" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-09_amr_detection">抗药基因检测流程 / AMR Detection Pipeline</title>
  <desc id="d-09_amr_detection">骨架流程：基因组→AMRFinderPlus/CARD数据库搜索→BLAST比对→抗性组分析→耐药谱。工具：AMRFinderPlus, CARD, BLAST。输入：基因组FASTA；输出：AMR基因列表、耐药谱。 关键词: bioinformatics workflow, amr detection, AMRFinderPlus, CARD, BLAST, FASTA, skeleton template, antimicrobial resistance</desc>
<defs>
  <marker id="pp09__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
  <g id="pp09__bg" data-name="background">
    <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  </g>
  <g id="pp09__labels" data-name="labels">
  <rect x="40" y="80" width="110" height="50" rx="8" ry="8"
        fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5"/>
    <text x="95.0" y="109.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Genome</text>

  <rect x="180" y="80" width="110" height="50" rx="8" ry="8"
