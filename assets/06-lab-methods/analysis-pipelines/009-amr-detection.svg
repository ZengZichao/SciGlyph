    <text x="235.0" y="249.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Resistome</text>

  <rect x="320" y="220" width="110" height="50" rx="8" ry="8"
        fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1.5"/>
    <text x="375.0" y="249.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Profile</text>

  <line x1="150" y1="105.0" x2="180" y2="105.0" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp09__arrow)" stroke-linecap="round"/>
  <line x1="290" y1="105.0" x2="320" y2="105.0" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp09__arrow)" stroke-linecap="round"/>
  <path d="M 375.0 130 L 375.0 175.0 L 95.0 175.0 L 95.0 220" fill="none" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp09__arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="150" y1="245.0" x2="180" y2="245.0" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp09__arrow)" stroke-linecap="round"/>
  <line x1="290" y1="245.0" x2="320" y2="245.0" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp09__arrow)" stroke-linecap="round"/>
  <text x="40" y="65" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">AMR Gene Detection Pipeline</text>
    <rect x="20" y="370" width="12" height="12" rx="2" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5"/>
  <text x="36" y="380" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">AMR</text>
