<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     class="pp-diagram pp-workflow" role="img" aria-labelledby="t-10_virulence_detection d-10_virulence_detection" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-10_virulence_detection">毒力因子检测流程 / Virulence Factor Detection</title>
  <desc id="d-10_virulence_detection">骨架流程：基因组→VFDB数据库搜索→Blast比对毒力基因→分泌系统分型→毒素查找→黏附素鉴定→报告。工具：VFDB, BLAST, EffectorP, ToxinPred。输入：基因组FASTA；输出：毒力因子列表。 关键词: bioinformatics workflow, virulence detection, Factor, VFDB, BLAST, EffectorP, ToxinPred, FASTA, skeleton template, typing</desc>
<defs>
  <marker id="pp10__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
  <g id="pp10__bg" data-name="background">
    <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  </g>
  <g id="pp10__labels" data-name="labels">
  <rect x="20" y="70" width="105" height="48" rx="8" ry="8"
        fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5"/>
    <text x="72.5" y="98.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Genome</text>

