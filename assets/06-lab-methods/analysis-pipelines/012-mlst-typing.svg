  <title id="t-12_mlst_typing">MLST 分型流程 / MLST Typing Pipeline</title>
  <desc id="d-12_mlst_typing">骨架流程：基因组→MLST扫描→等位基因调用→ST型别分配→cgMLST/wgMLST→聚类分析→暴发追踪。工具：mlst, chewBBACA, PubMLST。输入：基因组FASTA；输出：ST型、聚类树。 关键词: bioinformatics workflow, mlst typing, cgMLST, wgMLST, chewBBACA, PubMLST, FASTA, skeleton template</desc>
<defs>
  <marker id="pp12__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
