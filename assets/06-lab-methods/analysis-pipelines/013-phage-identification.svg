    <text x="447.5" y="98.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">CheckV</text>

  <rect x="20" y="208" width="105" height="48" rx="8" ry="8"
