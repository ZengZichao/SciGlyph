<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     class="pp-diagram pp-workflow" role="img" aria-labelledby="t-13_phage_identification d-13_phage_identification" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-13_phage_identification">噬菌体鉴定流程 / Phage Identification Pipeline</title>
  <desc id="d-13_phage_identification">骨架流程：组装重叠群→VirSorter2/DeepVirFinder病毒鉴定→CheckV质量评估→噬菌体分类→宿主预测→报告。工具：VirSorter2, DeepVirFinder, CheckV, WIsH。输入：metagenomic contigs；输出：viral genomes、宿主预测。 关键词: bioinformatics workflow, phage identification, VirSorter2, DeepVirFinder, CheckV, WIsH, metagenomic, skeleton template</desc>
<defs>
  <marker id="pp13__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
  <g id="pp13__bg" data-name="background">
    <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  </g>
  <g id="pp13__labels" data-name="labels">
  <rect x="20" y="70" width="105" height="48" rx="8" ry="8"
        fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5"/>
    <text x="72.5" y="98.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Contigs</text>

  <rect x="145" y="70" width="105" height="48" rx="8" ry="8"
        fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1.5"/>
