  <rect x="270" y="70" width="105" height="48" rx="8" ry="8"
        fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1.5"/>
    <text x="322.5" y="98.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">DeepVirFinder</text>

  <rect x="395" y="70" width="105" height="48" rx="8" ry="8"
