  <title id="t-14_plasmid_typing">质粒组装与分型流程 / Plasmid Assembly and Typing</title>
  <desc id="d-14_plasmid_typing">骨架流程：测序reads→PlasmidSPAdes组装→MOB扫描→MOB分型→复制子分型→AMR检查→质粒报告。工具：PlasmidSPAdes, MOB-suite, PlasmidFinder。输入：测序reads；输出：质粒序列、分型结果。 关键词: bioinformatics workflow, plasmid typing, Assembly, reads, PlasmidSPAdes, AMR, MOB-suite, skeleton template</desc>
<defs>
  <marker id="pp14__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
  <g id="pp14__bg" data-name="background">
