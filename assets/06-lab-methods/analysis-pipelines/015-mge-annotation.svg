<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     class="pp-diagram pp-workflow" role="img" aria-labelledby="t-15_mge_annotation d-15_mge_annotation" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-15_mge_annotation">移动元件注释流程 / MGE Annotation Pipeline</title>
  <desc id="d-15_mge_annotation">骨架流程：基因组→ISfinder插入序列搜索→IntegronFinder整合子检测→转座子鉴定→ICE检测→MGE报告。工具：ISfinder, IntegronFinder, ICEfinder。输入：基因组FASTA；输出：MGE注释列表。 关键词: bioinformatics workflow, mge annotation, ISfinder, IntegronFinder, ICEfinder, FASTA, skeleton template</desc>
<defs>
  <marker id="pp15__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
  <g id="pp15__bg" data-name="background">
    <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  </g>
  <g id="pp15__labels" data-name="labels">
  <rect x="40" y="80" width="110" height="50" rx="8" ry="8"
        fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5"/>
    <text x="95.0" y="109.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Genome</text>

  <rect x="180" y="80" width="110" height="50" rx="8" ry="8"
        fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1.5"/>
    <text x="235.0" y="109.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">ISfinder</text>

  <rect x="320" y="80" width="110" height="50" rx="8" ry="8"
        fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1.5"/>
    <text x="375.0" y="109.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">IntegronFinder</text>

  <rect x="40" y="220" width="110" height="50" rx="8" ry="8"
        fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1.5"/>
    <text x="95.0" y="249.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Transposon</text>

  <rect x="180" y="220" width="110" height="50" rx="8" ry="8"
        fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1.5"/>
    <text x="235.0" y="249.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">ICE Detect</text>

  <rect x="320" y="220" width="110" height="50" rx="8" ry="8"
        fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1.5"/>
    <text x="375.0" y="249.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">MGE Report</text>

  <line x1="150" y1="105.0" x2="180" y2="105.0" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp15__arrow)" stroke-linecap="round"/>
  <line x1="290" y1="105.0" x2="320" y2="105.0" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp15__arrow)" stroke-linecap="round"/>
  <path d="M 375.0 130 L 375.0 175.0 L 95.0 175.0 L 95.0 220" fill="none" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp15__arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="150" y1="245.0" x2="180" y2="245.0" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp15__arrow)" stroke-linecap="round"/>
  <line x1="290" y1="245.0" x2="320" y2="245.0" stroke="#1B2733" data-pp="ink" stroke-width="1.5" marker-end="url(#pp15__arrow)" stroke-linecap="round"/>
  <text x="40" y="65" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">MGE Annotation Pipeline</text>
    <rect x="20" y="370" width="12" height="12" rx="2" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="0.5"/>
  <text x="36" y="380" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">MGE Tools</text>
  <rect x="111" y="370" width="12" height="12" rx="2" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.5"/>
  <text x="127" y="380" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Genome</text>
  <rect x="181" y="370" width="12" height="12" rx="2" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="0.5"/>
  <text x="197" y="380" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Transposon</text>
  <rect x="279" y="370" width="12" height="12" rx="2" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5"/>
  <text x="295" y="380" font-size="9" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">ICE</text>
  </g>
</svg>