    <text x="235.0" y="115.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Condition</text>

  <rect x="320" y="80" width="110" height="50" rx="8" ry="8"
        fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1.5"/>
    <text x="375.0" y="109.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Culture</text>

  <rect x="40" y="220" width="110" height="50" rx="8" ry="8"
        fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1.5"/>
    <text x="95.0" y="249.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">MALDI-TOF</text>

  <rect x="180" y="220" width="110" height="50" rx="8" ry="8"
