<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     class="pp-diagram pp-workflow" role="img" aria-labelledby="t-16_culturomics d-16_culturomics" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-16_culturomics">培养组学流程 / Culturomics Pipeline</title>
  <desc id="d-16_culturomics">骨架流程：样本→多条件培养→培养物→MALDI-TOF鉴定→16S rRNA鉴定→分离株库。工具：MALDI-TOF MS, 16S测序。输入：临床/环境样本；输出：可培养分离株库。 关键词: bioinformatics workflow, culturomics, MALDI-TOF, rRNA, Multi, Condition, Culture, Isolate, Bank, skeleton template</desc>
<defs>
  <marker id="pp16__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
  <g id="pp16__bg" data-name="background">
    <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  </g>
  <g id="pp16__labels" data-name="labels">
  <rect x="40" y="80" width="110" height="50" rx="8" ry="8"
        fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5"/>
    <text x="95.0" y="109.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Sample</text>

  <rect x="180" y="80" width="110" height="50" rx="8" ry="8"
        fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1.5"/>
