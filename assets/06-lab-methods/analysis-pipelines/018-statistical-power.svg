  <title id="t-18_statistical_power">实验设计统计功效流程 / Statistical Power Design</title>
  <desc id="d-18_statistical_power">骨架流程：假设→效应量估计→统计功效计算→样本量确定→重复数→随机化→数据采集。工具：G*Power, pwr R包。输入：先验效应量；输出：实验设计方案。 关键词: bioinformatics workflow, statistical power, pwr, Hypothesis, Effect, Calc, Replicates, skeleton template</desc>
