  <title id="t-21_microfluidics">微流控单细胞培养流程 / Microfluidics Single-Cell Culture</title>
  <desc id="d-21_microfluidics">骨架流程：细胞悬液→芯片加载→单细胞捕获→灌流培养→生长监测→裂解PCR→鉴定。工具：微流控芯片、显微镜。输入：混合细胞悬液；输出：单细胞培养+鉴定。 关键词: bioinformatics workflow, microfluidics, Single-Cell, Culture, PCR, Susp, Chip, Load, Trap, skeleton template</desc>
