  <title id="t-22_dna_sip_nanosims">原位活性检测流程 / In Situ Activity Detection (DNA-SIP)</title>
  <desc id="d-22_dna_sip_nanosims">骨架流程：样本→13C标记底物→incubation→DNA提取→超离心分离→收集重馏分→测序重DNA→NanoSIMS验证→活性类群鉴定。工具：DNA-SIP, NanoSIMS。输入：环境样本+13C底物；输出：活性微生物鉴定。 关键词: bioinformatics workflow, dna sip nanosims, Situ, Activity, DNA-SIP, incubation, Incubate, skeleton template</desc>
<defs>
  <marker id="pp22__arrow" viewBox="0 0 10 10" refX="9" refY="5"
