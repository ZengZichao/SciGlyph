  <title id="t-25_network_inference">网络推断与 keystone 分析 / Network Inference and Keystone Analysis</title>
  <desc id="d-25_network_inference">骨架流程：ASV表→SparCC共现相关→共现网络构建→Hub节点检测→Keystone物种鉴定→可视化。工具：SparCC, igraph R, Cytoscape。输入：ASV表；输出：共现网络、keystone物种列表。 关键词: bioinformatics workflow, network inference, Keystone, ASV, SparCC, Hub, igraph, skeleton template</desc>
<defs>
