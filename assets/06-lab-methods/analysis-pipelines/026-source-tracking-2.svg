  <title id="t-26_source_tracking">源追踪与扩散过程建模 / Source Tracking and Dispersal Modeling</title>
  <desc id="d-26_source_tracking">骨架流程：源样本→汇样本→SourceTracker2/FEAST源追踪→扩散模型→通量估计→结果映射。工具：SourceTracker2, FEAST。输入：源/汇群落数据；输出：源贡献比例、扩散通量。 关键词: bioinformatics workflow, source tracking, Dispersal, Modeling, SourceTracker2, FEAST, Sink, skeleton template</desc>
