  <title id="t-27_species_distribution">物种分布/生态位模型 / Species Distribution Modeling</title>
  <desc id="d-27_species_distribution">骨架流程：物种出现点→环境图层→BioClim/MaxEnt模型→生态位宽度→未来投影→适宜性地图。工具：MaxEnt, biomod2 R。输入：出现坐标+环境变量；输出：适宜性地图、生态位参数。 关键词: bioinformatics workflow, species distribution, Modeling, BioClim, MaxEnt, biomod2, Occurrence, Layers, skeleton template</desc>
