  <title id="t-28_molecular_clock">分子钟定年流程 / Molecular Clock Dating Pipeline</title>
  <desc id="d-28_molecular_clock">骨架流程：序列比对→树拓扑→校准点设置→BEAST2/TreeTime分子钟分析→MCC树→HPD可信区间(95% CrI)→可视化。工具：BEAST2, TreeTime。输入：比对+校准信息；输出：时间校准树。 关键词: bioinformatics workflow, molecular clock, Dating, BEAST2, TreeTime, MCC, HPD, skeleton template, time calibration, confidence interval</desc>
