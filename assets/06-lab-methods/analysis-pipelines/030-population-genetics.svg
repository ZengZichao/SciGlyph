  <title id="t-30_population_genetics">种群遗传学流程 / Population Genetics Pipeline</title>
  <desc id="d-30_population_genetics">骨架流程：直系同源基因→CDS比对→dN/dS计算→PAML密码子模型→HyPhy选择检验→选择压力检验→报告。工具：PAML (codeml), HyPhy (MEME/FEL)。输入：CDS比对+树；输出：选择压力结果。 关键词: bioinformatics workflow, population genetics, CDS, PAML, HyPhy, codeml, MEME, skeleton template</desc>
