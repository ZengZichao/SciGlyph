  <title id="t-32_mag_refinement">MAG 完善与去污染流程 / MAG Refinement and Decontamination</title>
  <desc id="d-32_mag_refinement">骨架流程：原始bin→CheckM2质控→去污染→精细化→重新组装→最终质控→干净MAG。工具：CheckM2, DAS Tool, metaWRAP。输入：bins；输出：高质量MAG。 关键词: bioinformatics workflow, mag refinement, Decontamination, bin, CheckM2, DAS, Tool, metaWRAP, skeleton template</desc>
<defs>
  <marker id="pp32__arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2733" data-pp="ink"/>
  </marker>
</defs>
  <g id="pp32__bg" data-name="background">
    <rect x="0" y="0" width="600" height="400" fill="#F4F1EA" data-pp="bg"/>
  </g>
  <g id="pp32__labels" data-name="labels">
  <rect x="20" y="70" width="105" height="48" rx="8" ry="8"
        fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1.5"/>
    <text x="72.5" y="98.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Raw Bin</text>

  <rect x="145" y="70" width="105" height="48" rx="8" ry="8"
        fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1.5"/>
    <text x="197.5" y="98.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">CheckM2</text>

  <rect x="270" y="70" width="105" height="48" rx="8" ry="8"
        fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1.5"/>
    <text x="322.5" y="98.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Decontam</text>

  <rect x="395" y="70" width="105" height="48" rx="8" ry="8"
        fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="1.5"/>
    <text x="447.5" y="98.0" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">Refine</text>

  <rect x="20" y="208" width="105" height="48" rx="8" ry="8"
