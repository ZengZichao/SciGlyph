  <title id="t-33_visualization">结果可视化与出图流程 / Results Visualization Pipeline</title>
  <desc id="d-33_visualization">骨架流程：原始结果→R/ggplot2绑图→iTOL树装饰→Cytoscape网络→热图→面板排版→最终出图。工具：ggplot2, iTOL, Cytoscape, Adobe Illustrator。输入：分析结果；输出：出版级图表。 关键词: bioinformatics workflow, visualization, ggplot2, iTOL, Cytoscape, Adobe, Illustrator, Raw, skeleton template, heatmap</desc>
