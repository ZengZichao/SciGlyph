  <title id="t-stab_culture">穿刺培养 / Stab Culture</title>
  <desc id="d-stab_culture">穿刺接种于半固体琼脂深层, 用于观察动力或保藏菌种。关键词: stab culture, deep agar, motility</desc>
  <g id="layer-body" data-name="body">
    <rect x="38" y="15" width="24" height="65" rx="3" fill="#F4F1EA" stroke="#1B2733" stroke-width="1.5" data-pp="bg"/>
    <rect x="40" y="40" width="20" height="38" rx="2" fill="#00857A" fill-opacity="0.2" stroke="#93A0AC" stroke-width="0.5" data-pp="metabolism"/>
    <line x1="50" y1="40" x2="50" y2="75" stroke="#2E86AB" stroke-width="1.5" stroke-linecap="round" data-pp="bacteria"/>
    <circle cx="48" cy="50" r="1" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="52" cy="58" r="1" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="47" cy="65" r="1" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="53" cy="70" r="1.5" fill="#2E86AB" data-pp="bacteria"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#1B2733" data-pp="ink">穿刺</text>
  </g>
