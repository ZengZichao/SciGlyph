<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-methods" role="img" aria-labelledby="t-microaerophilic d-microaerophilic" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-microaerophilic">微需氧培养 / Microaerophilic</title>
  <desc id="d-microaerophilic">蜡烛缸: 蜡烛耗氧使O2下降、CO2升至约3-10%(蜡烛在O2约16-17%即熄灭，达不到5% O2)；明确限定的微需氧条件(如5% O2/10% CO2)用气体发生袋。关键词: microaerophilic, candle jar, gas pack, O2, CO2</desc>
  
  <g id="layer-body" data-name="body">
    <rect x="25" y="25" width="50" height="50" rx="3" fill="#F4F1EA" stroke="#1B2733" stroke-width="1.5" data-pp="bg"/>
    <rect x="45" y="55" width="10" height="15" rx="1" fill="#C42D2D" stroke="#1B2733" stroke-width="1" data-pp="alert"/>
    <path d="M50,55 Q48,50 50,45 Q52,50 50,55 Z" fill="#E8871E" stroke="#1B2733" stroke-width="0.8" stroke-linecap="round" data-pp="mge"/>
    <rect x="27" y="27" width="46" height="10" rx="1" fill="#2E86AB" stroke="none" stroke-width="0" data-pp="bacteria" fill-opacity="0.1"/>
    <rect x="27" y="37" width="46" height="10" rx="1" fill="#2E86AB" stroke="none" stroke-width="0" data-pp="bacteria" fill-opacity="0.2"/>
    <rect x="27" y="47" width="46" height="10" rx="1" fill="#2E86AB" stroke="none" stroke-width="0" data-pp="bacteria" fill-opacity="0.3"/>
    <circle cx="35" cy="42" r="2" fill="#2E86AB" stroke="#1B2733" stroke-width="1" data-pp="bacteria"/>
    <circle cx="65" cy="42" r="2" fill="#2E86AB" stroke="#1B2733" stroke-width="1" data-pp="bacteria"/>
    <text x="50" y="32" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#2E86AB" data-pp="bacteria">low O₂</text>
  </g>
  
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#1B2733" data-pp="ink">微需氧</text>
  </g>
</svg>