<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-methods" role="img" aria-labelledby="t-incubator d-incubator" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-incubator">Incubator</title>
  <desc id="d-incubator">Temperature-controlled incubator with shelves and plates</desc>
  
  <g id="layer-body" data-name="body">
    <rect x="20" y="20" width="60" height="55" rx="3" fill="#93A0AC" stroke="#1B2733" stroke-width="1.5" data-pp="muted"/>
    <rect x="30" y="30" width="40" height="35" rx="2" fill="#F4F1EA" stroke="#1B2733" stroke-width="1" data-pp="bg"/>
    <line x1="30" y1="45" x2="70" y2="45" stroke="#93A0AC" stroke-width="1" stroke-linecap="round" data-pp="muted"/>
    <line x1="30" y1="55" x2="70" y2="55" stroke="#93A0AC" stroke-width="1" stroke-linecap="round" data-pp="muted"/>
    <circle cx="40" cy="40" r="4" fill="#F4F1EA" stroke="#1B2733" stroke-width="0.8" data-pp="bg"/>
    <circle cx="60" cy="40" r="4" fill="#F4F1EA" stroke="#1B2733" stroke-width="0.8" data-pp="bg"/>
    <circle cx="50" cy="50" r="4" fill="#F4F1EA" stroke="#1B2733" stroke-width="0.8" data-pp="bg"/>
    <rect x="61" y="25" width="18" height="8" rx="1" fill="#C42D2D" stroke="#1B2733" stroke-width="1" data-pp="alert"/>
    <text x="70" y="31" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white">37°C</text>
  </g>
  
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Incubator</text>
