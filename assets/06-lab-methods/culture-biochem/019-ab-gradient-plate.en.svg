  <title id="t-ab_gradient_plate">Diffusion Gradient</title>
  <desc id="d-ab_gradient_plate">抗生素扩散梯度平板: 类似Etest原理, 测定MIC。关键词: antibiotic gradient, diffusion, MIC, Etest</desc>
  <g id="layer-body" data-name="body">
    <circle cx="50" cy="48" r="28" fill="#F4F1EA" stroke="#1B2733" stroke-width="1.5" data-pp="bg"/>
    <rect x="47" y="22" width="6" height="52" rx="1" fill="#E8871E" fill-opacity="0.4" stroke="#E8871E" stroke-width="1" data-pp="mge"/>
    <ellipse cx="50" cy="55" rx="18" ry="12" fill="#FFFFFF" stroke="#93A0AC" stroke-width="0.5" stroke-dasharray="2,2" data-pp="white"/>
    <circle cx="35" cy="40" r="1.5" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="65" cy="40" r="1.5" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="40" cy="60" r="1.5" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="60" cy="60" r="1.5" fill="#2E86AB" data-pp="bacteria"/>
    <text x="50" y="80" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">MIC</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="92" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">diffusion gradient</text>
  </g>
