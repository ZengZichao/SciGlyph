  <title id="t-capsule_stain">荚膜负染 / Capsule Stain</title>
  <desc id="d-capsule_stain">墨汁负染显示荚膜: 背景暗, 菌体着色, 荚膜呈透明晕圈。关键词: capsule, India ink, negative stain, halo, Klebsiella</desc>
  <g id="layer-body" data-name="body">
    <rect x="15" y="20" width="70" height="55" rx="3" fill="#1B2733" data-pp="ink"/>
    <circle cx="40" cy="45" r="14" fill="#1B2733" data-pp="ink"/>
    <circle cx="40" cy="45" r="10" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="65" cy="50" r="12" fill="#1B2733" data-pp="ink"/>
    <circle cx="65" cy="50" r="8" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="40" cy="45" r="14" fill="none" stroke="#FFFFFF" stroke-width="0.5" data-pp="white"/>
    <circle cx="65" cy="50" r="12" fill="none" stroke="#FFFFFF" stroke-width="0.5" data-pp="white"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="90" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#1B2733" data-pp="ink">荚膜</text>
  </g>
</svg>