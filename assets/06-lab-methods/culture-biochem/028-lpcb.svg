    <circle cx="50" cy="35" r="2" fill="#6C3FA0" data-pp="gene"/>
    <circle cx="45" cy="65" r="2.5" fill="#6C3FA0" data-pp="gene"/>
    <circle cx="55" cy="65" r="2.5" fill="#6C3FA0" data-pp="gene"/>
