    <circle cx="62" cy="55" r="4" fill="#E8871E" stroke="#1B2733" stroke-width="0.5" data-pp="mge"/>
    <circle cx="38" cy="38" r="9" fill="none" stroke="#93A0AC" stroke-width="0.5" stroke-dasharray="2,1" data-pp="muted"/>
    <circle cx="60" cy="35" r="7" fill="none" stroke="#93A0AC" stroke-width="0.5" stroke-dasharray="2,1" data-pp="muted"/>
