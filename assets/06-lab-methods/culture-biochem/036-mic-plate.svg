<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-methods" role="img" aria-labelledby="t-mic_plate d-mic_plate" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-mic_plate">MIC稀释板 / MIC Broth Dilution</title>
  <desc id="d-mic_plate">微量肉汤稀释法测MIC: 多孔板系列稀释抗生素(孔数为示意), 判定最低抑菌浓度。关键词: MIC, microdilution, broth, minimum inhibitory concentration</desc>
  <g id="layer-body" data-name="body">
    <rect x="12" y="20" width="76" height="50" rx="3" fill="#F4F1EA" stroke="#1B2733" stroke-width="1.5" data-pp="bg"/>
    <circle cx="22" cy="32" r="4" fill="#C42D2D" fill-opacity="0.6" data-pp="alert"/>
    <circle cx="34" cy="32" r="4" fill="#C42D2D" fill-opacity="0.45" data-pp="alert"/>
    <circle cx="46" cy="32" r="4" fill="#C42D2D" fill-opacity="0.3" data-pp="alert"/>
    <circle cx="58" cy="32" r="4" fill="#C42D2D" fill-opacity="0.15" data-pp="alert"/>
    <circle cx="70" cy="32" r="4" fill="#2E86AB" fill-opacity="0.3" data-pp="bacteria"/>
    <circle cx="82" cy="32" r="4" fill="#2E86AB" fill-opacity="0.3" data-pp="bacteria"/>
    <circle cx="22" cy="47" r="4" fill="#C42D2D" fill-opacity="0.6" data-pp="alert"/>
    <circle cx="34" cy="47" r="4" fill="#C42D2D" fill-opacity="0.45" data-pp="alert"/>
    <circle cx="46" cy="47" r="4" fill="#C42D2D" fill-opacity="0.3" data-pp="alert"/>
    <circle cx="58" cy="47" r="4" fill="#2E86AB" fill-opacity="0.3" data-pp="bacteria"/>
    <circle cx="70" cy="47" r="4" fill="#2E86AB" fill-opacity="0.3" data-pp="bacteria"/>
    <circle cx="82" cy="47" r="4" fill="#2E86AB" fill-opacity="0.3" data-pp="bacteria"/>
    <circle cx="22" cy="62" r="4" fill="#C42D2D" fill-opacity="0.6" data-pp="alert"/>
    <circle cx="34" cy="62" r="4" fill="#C42D2D" fill-opacity="0.45" data-pp="alert"/>
    <circle cx="46" cy="62" r="4" fill="#2E86AB" fill-opacity="0.3" data-pp="bacteria"/>
    <circle cx="58" cy="62" r="4" fill="#2E86AB" fill-opacity="0.3" data-pp="bacteria"/>
    <circle cx="70" cy="62" r="4" fill="#2E86AB" fill-opacity="0.3" data-pp="bacteria"/>
    <circle cx="82" cy="62" r="4" fill="#2E86AB" fill-opacity="0.3" data-pp="bacteria"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="85" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">MIC</text>
  </g>
</svg>