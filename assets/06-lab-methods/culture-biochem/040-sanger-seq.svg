  <title id="t-sanger_seq">Sanger测序 / Sanger Sequencing</title>
  <desc id="d-sanger_seq">Sanger双脱氧链终止法测序峰图: 四色荧光峰代表A/T/G/C碱基。关键词: Sanger, sequencing, chromatogram, ddNTP, four colors, capillary</desc>
  <g id="layer-body" data-name="body">
    <rect x="10" y="20" width="80" height="50" rx="2" fill="#F4F1EA" stroke="#1B2733" stroke-width="1" data-pp="bg"/>
    <path d="M15,60 L15,45 L20,42 L22,38 L24,45 L28,60" fill="#00857A" fill-opacity="0.7" data-pp="metabolism"/>
    <path d="M26,60 L28,50 L30,45 L32,40 L34,48 L36,60" fill="#C42D2D" fill-opacity="0.7" data-pp="alert"/>
    <path d="M35,60 L37,48 L39,42 L41,38 L43,45 L45,60" fill="#6C3FA0" fill-opacity="0.7" data-pp="gene"/>
    <path d="M44,60 L46,52 L48,47 L50,43 L52,50 L54,60" fill="#E8871E" fill-opacity="0.7" data-pp="mge"/>
    <path d="M53,60 L55,45 L57,40 L59,36 L61,43 L63,60" fill="#00857A" fill-opacity="0.7" data-pp="metabolism"/>
    <path d="M62,60 L64,50 L66,44 L68,40 L70,47 L72,60" fill="#C42D2D" fill-opacity="0.7" data-pp="alert"/>
    <path d="M71,60 L73,48 L75,42 L77,38 L79,45 L82,60" fill="#6C3FA0" fill-opacity="0.7" data-pp="gene"/>
    <line x1="10" y1="60" x2="90" y2="60" stroke="#1B2733" stroke-width="0.5" data-pp="ink"/>
    <text x="18" y="35" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#00857A" data-pp="metabolism">A</text>
    <text x="30" y="35" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">T</text>
    <text x="40" y="33" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#6C3FA0" data-pp="gene">G</text>
    <text x="50" y="35" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#E8871E" data-pp="mge">C</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="85" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Sanger</text>
