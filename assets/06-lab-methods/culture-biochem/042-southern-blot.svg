  <title id="t-southern_blot">Southern blot / Southern Blot</title>
  <desc id="d-southern_blot">Southern印迹杂交: DNA电泳→转膜→标记探针杂交检测特定序列。关键词: Southern blot, DNA, hybridization, probe, membrane, transfer</desc>
  <g id="layer-body" data-name="body">
    <rect x="15" y="15" width="30" height="30" rx="2" fill="#6C3FA0" fill-opacity="0.15" stroke="#1B2733" stroke-width="1" data-pp="gene"/>
    <rect x="20" y="20" width="4" height="20" rx="1" fill="#6C3FA0" fill-opacity="0.7" data-pp="gene"/>
    <rect x="28" y="22" width="4" height="16" rx="1" fill="#6C3FA0" fill-opacity="0.7" data-pp="gene"/>
    <rect x="36" y="25" width="4" height="12" rx="1" fill="#6C3FA0" fill-opacity="0.7" data-pp="gene"/>
    <path d="M50,30 L58,30" fill="none" stroke="#93A0AC" stroke-width="1.5" stroke-linecap="round" data-pp="muted"/>
    <path d="M56,28 L60,30 L56,32" fill="#93A0AC" data-pp="muted"/>
    <rect x="62" y="15" width="25" height="30" rx="2" fill="#FFFFFF" stroke="#1B2733" stroke-width="1" data-pp="white"/>
    <rect x="67" y="22" width="4" height="15" rx="1" fill="#C42D2D" fill-opacity="0.7" data-pp="alert"/>
    <rect x="75" y="25" width="4" height="10" rx="1" fill="#C42D2D" fill-opacity="0.7" data-pp="alert"/>
    <text x="50" y="58" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">gel→membrane</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="85" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Southern</text>
  </g>
</svg>