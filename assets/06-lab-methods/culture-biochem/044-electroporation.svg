  <title id="t-electroporation">电穿孔 / Electroporation</title>
  <desc id="d-electroporation">电穿孔转化: 高压脉冲在细胞膜形成瞬态孔洞, 使DNA进入细胞。关键词: electroporation, cuvette, transformation, pulse, competent cell</desc>
  <g id="layer-body" data-name="body">
    <rect x="30" y="15" width="40" height="60" rx="3" fill="#F4F1EA" stroke="#1B2733" stroke-width="1.5" data-pp="bg"/>
    <rect x="33" y="18" width="5" height="54" rx="1" fill="#93A0AC" stroke="#1B2733" stroke-width="0.5" data-pp="muted"/>
    <rect x="62" y="18" width="5" height="54" rx="1" fill="#93A0AC" stroke="#1B2733" stroke-width="0.5" data-pp="muted"/>
    <circle cx="50" cy="45" r="12" fill="#2E86AB" fill-opacity="0.3" stroke="#2E86AB" stroke-width="1" data-pp="bacteria"/>
    <path d="M38,35 L42,38 L38,41" fill="none" stroke="#E8871E" stroke-width="1.5" stroke-linecap="round" data-pp="mge"/>
    <path d="M62,35 L58,38 L62,41" fill="none" stroke="#E8871E" stroke-width="1.5" stroke-linecap="round" data-pp="mge"/>
    <circle cx="50" cy="45" r="4" fill="#E8871E" fill-opacity="0.5" data-pp="mge"/>
    <text x="50" y="80" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#C42D2D" data-pp="alert">⚡</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="90" text-anchor="middle" font-size="7" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#1B2733" data-pp="ink">电转</text>
  </g>
</svg>