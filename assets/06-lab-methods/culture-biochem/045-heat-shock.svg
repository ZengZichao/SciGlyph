  <title id="t-heat_shock">热激转化 / Heat Shock</title>
  <desc id="d-heat_shock">Heat shock transformation with 42°C and ice steps. 42°C/冰浴时长为 E. coli 化学转化常用参数示例(示意), 因菌株与方案而异。关键词: heat shock, CaCl2, competent</desc>
  
