<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-methods" role="img" aria-labelledby="t-flow_cytometry d-flow_cytometry" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-flow_cytometry">Flow Cytometry</title>
  <desc id="d-flow_cytometry">流式细胞术散点图: 前向散射vs侧向散射, 分选或分析细胞群体。关键词: flow cytometry, FACS, FSC, SSC, scatter, fluorescence</desc>
  <g id="layer-body" data-name="body">
    <rect x="15" y="15" width="70" height="55" rx="2" fill="#F4F1EA" stroke="#1B2733" stroke-width="1" data-pp="bg"/>
    <line x1="20" y1="65" x2="80" y2="65" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
    <line x1="20" y1="20" x2="20" y2="65" stroke="#1B2733" stroke-width="1" data-pp="ink"/>
    <circle cx="35" cy="55" r="2" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="38" cy="52" r="2" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="32" cy="58" r="2" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="40" cy="56" r="2" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="55" cy="40" r="2" fill="#00857A" data-pp="metabolism"/>
    <circle cx="58" cy="38" r="2" fill="#00857A" data-pp="metabolism"/>
    <circle cx="52" cy="42" r="2" fill="#00857A" data-pp="metabolism"/>
    <circle cx="70" cy="28" r="2" fill="#C42D2D" data-pp="alert"/>
    <circle cx="72" cy="30" r="2" fill="#C42D2D" data-pp="alert"/>
    <text x="80" y="70" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">FSC</text>
    <text x="12" y="20" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">SSC</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="85" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">Flow cytometry</text>
  </g>
</svg>