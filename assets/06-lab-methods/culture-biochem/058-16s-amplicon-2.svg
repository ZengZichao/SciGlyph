<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-methods" role="img" aria-labelledby="t-16s_amplicon d-16s_amplicon" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-16s_amplicon">16S扩增子 / 16S Amplicon</title>
  <desc id="d-16s_amplicon">16S rRNA基因扩增子测序: 通用引物27F/1492R扩增全长(含V1-V9高变区, V4区常用于短读长方案), 鉴定群落组成。关键词: 16S rRNA, amplicon, 27F, 1492R, V4, taxonomy, diversity</desc>
  <g id="layer-body" data-name="body">
    <line x1="10" y1="40" x2="90" y2="40" stroke="#6C3FA0" stroke-width="2.5" stroke-linecap="round" data-pp="gene"/>
    <rect x="15" y="35" width="8" height="10" rx="1" fill="#C42D2D" fill-opacity="0.7" data-pp="alert"/>
    <rect x="28" y="35" width="10" height="10" rx="1" fill="#00857A" fill-opacity="0.5" data-pp="metabolism"/>
    <rect x="42" y="35" width="8" height="10" rx="1" fill="#C42D2D" fill-opacity="0.7" data-pp="alert"/>
    <rect x="55" y="35" width="12" height="10" rx="1" fill="#00857A" fill-opacity="0.5" data-pp="metabolism"/>
    <rect x="72" y="35" width="8" height="10" rx="1" fill="#C42D2D" fill-opacity="0.7" data-pp="alert"/>
    <text x="19" y="32" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">V1</text>
    <text x="33" y="32" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">V3</text>
    <text x="46" y="32" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">V4</text>
    <text x="61" y="32" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">V6</text>
    <text x="76" y="32" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">V9</text>
    <path d="M10,45 L15,50 L10,55 Z" fill="#E8871E" data-pp="mge"/>
    <path d="M90,45 L85,50 L90,55 Z" fill="#E8871E" data-pp="mge"/>
    <text x="10" y="62" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#E8871E" data-pp="mge">27F</text>
    <text x="75" y="62" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#E8871E" data-pp="mge">1492R</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="85" text-anchor="middle" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">16S</text>
  </g>
</svg>