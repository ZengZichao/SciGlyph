<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-brightfield d-brightfield" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-brightfield">明场显微镜 / Brightfield microscopy light path</title>
  <desc id="d-brightfield">明场显微镜光路简图：光源→聚光镜→样品→物镜→目镜。样品吸收光产生暗色影像。关键词: brightfield, light microscopy, condenser, objective, transmitted light</desc>
  <g id="layer-body-brightfield" data-name="body">
    <!-- Objective lens -->
    <rect x="40" y="10" width="20" height="15" rx="3" ry="3" fill="#93A0AC" data-pp="muted" stroke="#1B2733" stroke-width="1.5"/>
    <!-- Light cone -->
    <path d="M42,25 L30,60 L70,60 L58,25" fill="#E8871E" data-pp="mge" fill-opacity="0.2" stroke="none"/>
    <!-- Light rays -->
    <line x1="45" y1="25" x2="35" y2="60" stroke="#E8871E" data-pp="mge" stroke-width="1" stroke-dasharray="2,1"/>
    <line x1="50" y1="25" x2="50" y2="60" stroke="#E8871E" data-pp="mge" stroke-width="1" stroke-dasharray="2,1"/>
    <line x1="55" y1="25" x2="65" y2="60" stroke="#E8871E" data-pp="mge" stroke-width="1" stroke-dasharray="2,1"/>
    <!-- Sample -->
    <rect x="25" y="58" width="50" height="6" rx="1" ry="1" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1"/>
    <!-- Specimen dots -->
    <circle cx="40" cy="61" r="2" fill="#2E86AB" data-pp="bacteria"/>
    <circle cx="55" cy="61" r="2" fill="#2E86AB" data-pp="bacteria"/>
    <!-- Condenser below -->
    <rect x="41" y="70" width="18" height="8" rx="2" ry="2" fill="#93A0AC" data-pp="muted" stroke="#1B2733" stroke-width="1"/>
    <!-- Light source -->
    <circle cx="50" cy="88" r="5" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
  </g>
  <g id="layer-annotation-brightfield" data-name="annotation">
    <text x="60.44" y="18.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">objective</text>
    <text x="60.44" y="74.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">condenser</text>
    <text x="50" y="98" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">brightfield</text>
  </g>
</svg>