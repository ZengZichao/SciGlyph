<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-sim d-sim" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-sim">SIM结构光照明 / SIM structured illumination microscopy</title>
  <desc id="d-sim">SIM结构光照明显微镜：用条纹图案光照射样品→高频信息折叠为可观测Moiré条纹→多方向/多相位采集→计算重建→分辨率提升2×(~100nm)。关键词: SIM, structured illumination, Moiré, computational, 2x resolution</desc>
  <g id="layer-body-sim" data-name="body">
    <!-- Raw SIM frame: coarse Moiré fringes produced by the striped illumination -->
    <rect x="10" y="24" width="30" height="24" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1.5"/>
    <line x1="13" y1="28" x2="37" y2="28" stroke="#E8871E" data-pp="mge" stroke-width="1.5"/>
    <line x1="13" y1="32" x2="37" y2="32" stroke="#E8871E" data-pp="mge" stroke-width="1.5"/>
    <line x1="13" y1="36" x2="37" y2="36" stroke="#E8871E" data-pp="mge" stroke-width="1.5"/>
    <line x1="13" y1="40" x2="37" y2="40" stroke="#E8871E" data-pp="mge" stroke-width="1.5"/>
    <line x1="13" y1="44" x2="37" y2="44" stroke="#E8871E" data-pp="mge" stroke-width="1.5"/>
    <!-- Arrow -->
    <path d="M42,36 L53,36" fill="none" stroke="#1B2733" stroke-width="1.5"/>
    <polygon points="51,33 57,36 51,39" fill="#1B2733" data-pp="ink"/>
    <!-- Computational reconstruction: twice as many resolvable fringes -->
    <rect x="58" y="24" width="32" height="24" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1.5"/>
    <line x1="61" y1="26.5" x2="87" y2="26.5" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
    <line x1="61" y1="28.75" x2="87" y2="28.75" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
    <line x1="61" y1="31" x2="87" y2="31" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
    <line x1="61" y1="33.25" x2="87" y2="33.25" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
    <line x1="61" y1="35.5" x2="87" y2="35.5" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
    <line x1="61" y1="37.75" x2="87" y2="37.75" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
    <line x1="61" y1="40" x2="87" y2="40" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
    <line x1="61" y1="42.25" x2="87" y2="42.25" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
    <line x1="61" y1="44.5" x2="87" y2="44.5" stroke="#E8871E" data-pp="mge" stroke-width="1"/>
  </g>
  <g id="layer-annotation-sim" data-name="annotation">
    <text x="25" y="56" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">raw frame</text>
    <text x="74" y="56" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">recon.</text>
    <text x="50" y="64" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">2× resolution, ~100 nm</text>
    <text x="50" y="72" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">Moiré → reconstruction</text>
  </g>
</svg>
