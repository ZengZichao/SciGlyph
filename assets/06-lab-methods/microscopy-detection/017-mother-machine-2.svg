  <title id="t-mother_machine">微流控Mother Machine / Mother machine microfluidic single cell</title>
  <desc id="d-mother_machine">Mother Machine微流控芯片：死端通道中细菌生长，母细胞始终在通道底部被追踪。连续培养基流动冲走子细胞。长期单细胞谱系追踪。关键词: Mother Machine, microfluidic, single cell, lineage tracking, dead-end channel</desc>
