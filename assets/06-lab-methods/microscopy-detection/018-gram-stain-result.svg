<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-gram_stain_result d-gram_stain_result" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-gram_stain_result">革兰染色结果 / Gram stain result positive negative</title>
  <desc id="d-gram_stain_result">革兰染色结果对照：G+(紫色/蓝紫,厚肽聚糖保留结晶紫) vs G-(粉红/红,薄肽聚糖+外膜,脱色后复染品红)。关键词: Gram stain, Gram-positive, Gram-negative, crystal violet, safranin, peptidoglycan</desc>
  <g id="layer-body-gram_stain_result" data-name="body">
    <circle cx="20" cy="30" r="7" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="1.5"/>
    <circle cx="35" cy="25" r="6" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="1.5"/>
    <circle cx="25" cy="45" r="5" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="1.5"/>
    <circle cx="38" cy="42" r="6" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="1.5"/>
    <rect x="55" y="24" width="14" height="6" rx="3" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1.5"/>
    <rect x="60" y="35" width="12" height="5" rx="2.5" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1.5"/>
    <rect x="52" y="44" width="15" height="6" rx="3" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1.5"/>
    <rect x="62" y="54" width="11" height="5" rx="2.5" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1.5"/>
    <line x1="10" y1="65" x2="90" y2="65" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>
  <g id="layer-annotation-gram_stain_result" data-name="annotation">
    <text x="15" y="60" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#A2305B" data-pp="archaea" text-anchor="start">G+</text>
    <text x="60" y="68" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="start">G-</text>
    <text x="50" y="80" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">Gram stain</text>
  </g>
</svg>
