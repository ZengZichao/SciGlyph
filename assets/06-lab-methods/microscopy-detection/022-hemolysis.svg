<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-hemolysis d-hemolysis" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-hemolysis">血溶血圈(α/β/γ) / Hemolysis alpha beta gamma blood agar</title>
  <desc id="d-hemolysis">血平板溶血类型：α-部分溶血(绿色)、β-完全溶血(透明圈)、γ-不溶血。用于链球菌等鉴定。关键词: hemolysis, alpha, beta, gamma, blood agar, Streptococcus</desc>
  <g id="layer-body-hemolysis" data-name="body">
    <!-- Blood agar plate -->
    <circle cx="50" cy="45" r="32" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1.5" fill-opacity="0.3"/>
    <!-- Alpha (partial, greenish) -->
    <circle cx="28" cy="35" r="5" fill="#00857A" data-pp="metabolism" stroke="#1B2733" stroke-width="0.5" fill-opacity="0.5"/>
    <circle cx="28" cy="35" r="8" fill="#00857A" data-pp="metabolism" fill-opacity="0.2" stroke="none"/>
    <text x="28" y="50" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">α</text>
    <!-- Beta (complete clear) -->
    <circle cx="50" cy="35" r="5" fill="#FFFFFF" data-pp="white" stroke="#1B2733" stroke-width="0.5"/>
    <circle cx="50" cy="35" r="8" fill="#FFFFFF" data-pp="white" fill-opacity="0.5" stroke="none"/>
    <text x="50" y="50" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">β</text>
    <!-- Gamma (none) -->
    <circle cx="72" cy="35" r="5" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5" fill-opacity="0.3"/>
    <text x="72" y="50" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">γ</text>
  </g>
  <g id="layer-annotation-hemolysis" data-name="annotation">
    <text x="28" y="62" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">α partial</text>
    <text x="72" y="62" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">γ none</text>
    <text x="50" y="70" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">β complete</text>
    <text x="50" y="85" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">hemolysis types</text>
  </g>
</svg>