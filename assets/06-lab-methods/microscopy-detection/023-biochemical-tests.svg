<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-biochemical_tests d-biochemical_tests" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-biochemical_tests">生化显色结果 / Biochemical test color results</title>
  <desc id="d-biochemical_tests">常用生化试验显色结果：氧化酶(紫色+)、触酶(气泡+)、吲哚(红色环+)、尿素酶(粉红+)、甲基红MR(红色+)、V-P(红色+)。关键词: biochemical test, oxidase, catalase, indole, urease, MR, VP</desc>
  <g id="layer-body-biochemical_tests" data-name="body">
    <!-- Oxidase (purple) -->
    <rect x="5" y="10" width="18" height="10" rx="2" ry="2" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="1"/>
    <text x="17.86" y="28.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">oxidase+</text>
    <!-- Catalase (bubbles) -->
    <rect x="28" y="10" width="18" height="10" rx="2" ry="2" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1"/>
    <circle cx="33" cy="12" r="1" fill="#FFFFFF" data-pp="white" stroke="#1B2733" stroke-width="0.3"/>
    <circle cx="37" cy="11" r="1" fill="#FFFFFF" data-pp="white" stroke="#1B2733" stroke-width="0.3"/>
    <circle cx="41" cy="13" r="1" fill="#FFFFFF" data-pp="white" stroke="#1B2733" stroke-width="0.3"/>
    <line x1="37.0" y1="25.9" x2="45.0" y2="25.9" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="45.0" y="28.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">cat+</text>
    <!-- Indole (red ring) -->
    <rect x="52" y="10" width="18" height="10" rx="2" ry="2" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1"/>
    <text x="61" y="7" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">indole+</text>
    <!-- Urease (pink) -->
    <rect x="75" y="10" width="18" height="10" rx="2" ry="2" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1" fill-opacity="0.5"/>
    <text x="84" y="28" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">urease+</text>
    <!-- MR (red) -->
    <rect x="15" y="38" width="18" height="10" rx="2" ry="2" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1"/>
    <text x="24" y="56" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">MR+</text>
    <!-- VP (red-pink) -->
    <rect x="40" y="38" width="18" height="10" rx="2" ry="2" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="1" fill-opacity="0.5"/>
    <text x="49" y="56" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">VP+</text>
  </g>
  <g id="layer-annotation-biochemical_tests" data-name="annotation">
    <text font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-size="7" x="35.22" y="72.0">Biochemical test</text><text font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-size="7" x="37.39" y="80.26">results</text>
  </g>
</svg>