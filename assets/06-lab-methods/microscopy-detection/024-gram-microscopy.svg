<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-gram_microscopy d-gram_microscopy" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-gram_microscopy">革兰染色镜下图 / Gram stain microscopy view</title>
  <desc id="d-gram_microscopy">革兰染色显微镜视野：紫色球菌(G+)和粉红色杆菌(G-)混合视野。100×油镜。关键词: Gram stain, microscopy, cocci, bacilli, oil immersion, 100x</desc>
  <g id="layer-body-gram_microscopy" data-name="body">
    <!-- Microscope field (circular) -->
    <circle cx="50" cy="45" r="35" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1.5"/>
    <!-- Gram+ cocci (purple) -->
    <circle cx="35" cy="35" r="5" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="0.5"/>
    <circle cx="45" cy="32" r="5" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="0.5"/>
    <circle cx="40" cy="42" r="4" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="0.5"/>
    <!-- Gram- bacilli (pink) -->
    <rect x="55" y="40" width="12" height="5" rx="2" ry="2" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5"/>
    <rect x="58" y="50" width="10" height="4" rx="2" ry="2" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5"/>
    <rect x="30" y="55" width="11" height="5" rx="2" ry="2" fill="#C42D2D" data-pp="alert" stroke="#1B2733" stroke-width="0.5"/>
  </g>
  <g id="layer-annotation-gram_microscopy" data-name="annotation">
    <text x="35" y="25" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#A2305B" data-pp="archaea">G+</text>
    <text x="65" y="38" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert">G-</text>
    <text x="50" y="88" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">Gram stain microscopy</text>
  </g>
</svg>