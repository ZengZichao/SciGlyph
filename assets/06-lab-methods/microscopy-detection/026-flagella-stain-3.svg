<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-flagella_stain d-flagella_stain" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-flagella_stain">鞭毛染色 / Flagella stain mordant light microscopy</title>
  <desc id="d-flagella_stain">鞭毛染色：媒染剂(单宁酸/钾明矾)增厚鞭毛→光学显微镜可见。显示鞭毛排列(周毛/极毛/侧毛)。关键词: flagella stain, mordant, peritrichous, polar, light microscopy</desc>
  <g id="layer-body-flagella_stain" data-name="body">
    <!-- Cell body (stained dark) -->
    <rect x="38" y="30" width="18" height="10" rx="5" ry="5" fill="#A2305B" data-pp="archaea" stroke="#1B2733" stroke-width="1.5"/>
    <!-- Flagella (stained with mordant) -->
    <path d="M38,35 Q25,30 15,35 Q10,40 5,35" fill="none" stroke="#1B2733" stroke-width="1" stroke-linecap="round"/>
    <path d="M38,38 Q28,42 18,38 Q12,34 5,38" fill="none" stroke="#1B2733" stroke-width="1" stroke-linecap="round"/>
    <path d="M38,40 Q30,48 20,45 Q12,42 5,45" fill="none" stroke="#1B2733" stroke-width="1" stroke-linecap="round"/>
    <path d="M56,35 Q68,30 78,35 Q85,40 90,35" fill="none" stroke="#1B2733" stroke-width="1" stroke-linecap="round"/>
    <path d="M56,38 Q65,42 75,38 Q82,34 90,38" fill="none" stroke="#1B2733" stroke-width="1" stroke-linecap="round"/>
    <path d="M56,40 Q65,48 75,45 Q82,42 90,45" fill="none" stroke="#1B2733" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g id="layer-annotation-flagella_stain" data-name="annotation">
    <text x="50" y="60" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">flagella stain</text>
    <text x="50" y="68" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">mordant thickens</text>ext>
    <text x="50" y="76" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">flagella for LM</text>
  </g>
</svg>