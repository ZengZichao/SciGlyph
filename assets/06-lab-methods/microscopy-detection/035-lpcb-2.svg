<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-lpcb d-lpcb" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-lpcb">乳酸酚棉蓝染色 / Lactophenol cotton blue fungal stain</title>
  <desc id="d-lpcb">乳酸酚棉蓝(LPCB)染色：真菌标本常用封片染色。棉蓝染几丁质→蓝色菌丝和孢子。酚杀菌、乳酸保持形态。关键词: lactophenol cotton blue, LPCB, fungal stain, hyphae, conidia, mount</desc>
  <g id="layer-body-lpcb" data-name="body">
    
    <circle cx="50" cy="45" r="35" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1.5" />
    
    <path d="M25,35 Q35,30 45,35 Q55,40 65,35 Q75,30 80,35" fill="none" stroke="#2E86AB" data-pp="bacteria" stroke-width="2" />
    <path d="M30,50 Q40,45 50,50 Q60,55 70,50" fill="none" stroke="#2E86AB" data-pp="bacteria" stroke-width="2" />
    
    <circle cx="40" cy="30" r="3" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.5" />
    <circle cx="55" cy="28" r="2.5" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.5" />
    <circle cx="65" cy="45" r="3" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="0.5" />
    
    <line x1="45" y1="33" x2="45" y2="37" stroke="#1B2733" stroke-width="0.5" />
    <line x1="55" y1="38" x2="55" y2="42" stroke="#1B2733" stroke-width="0.5" />
  </g>
  <g id="layer-annotation-lpcb" data-name="annotation">
    <text font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-size="7" x="39.56" y="84.96">lactophenol cotton</text><text font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle" font-size="7" x="41.32" y="93.22">blue</text>
    <text x="42.63" y="77.53" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">fungal mount</text><line x1="25.8" y1="90.22" x2="17.43" y2="73.49" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/>
  </g>
</svg>
