  <title id="t-ddpcr">微滴数字PCR / Droplet digital PCR ddPCR chip</title>
  <desc id="d-ddpcr">微滴数字PCR(ddPCR)：样品分成~20000个纳升级微滴→PCR扩增→荧光检测阳性/阴性微滴→Poisson统计绝对定量。无需标准曲线。关键词: ddPCR, droplet digital PCR, partitioning, Poisson, absolute quantification</desc>
