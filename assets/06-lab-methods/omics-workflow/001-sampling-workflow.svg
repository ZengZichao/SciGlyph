<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name-zh="采样—提取—建库—测序流程" data-name-en="Sampling-to-Sequencing Workflow" data-cat="05-eco-seq" data-tags="采样,DNA提取,建库,测序,流程条,宏基因组" role="img" aria-labelledby="t-17-sampling-workflow d-17-sampling-workflow" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-17-sampling-workflow">采样—提取—建库—测序流程 / Sampling-to-Sequencing Workflow</title>
  <desc id="d-17-sampling-workflow">无菌采样后裂解细胞获取核酸，加接头建库并上机测序，四个步骤以箭头串联构成组学分析前端流程。关键词: 采样, DNA提取, 建库, 测序, 流程条, 宏基因组</desc>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
