    <text font-family="Inter,Helvetica,Arial,sans-serif" x="73" y="24">③</text>
    <text font-family="Inter,Helvetica,Arial,sans-serif" x="101" y="24">④</text>
  </g>
  <path d="M17 29 V36 M45 29 V36 M73 29 V36 M101 29 V36" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 2"/>
