  <circle cx="111" cy="71" r="2.8" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <!-- 膜分片边界 -->
  <path d="M5 44 H45 M75 44 H115" stroke="#7A8B93" stroke-width="1.2" stroke-dasharray="2 3"/>
