  <circle cx="111" cy="51" r="2.8" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
  <circle cx="8" cy="71" r="2.8" fill="#B7D7E8" stroke="#1F6F8B" stroke-width="1.2"/>
