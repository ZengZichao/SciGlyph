  <title id="t">火焰原子吸收光谱仪 / Flame AAS</title>
  <desc id="d">火焰原子吸收光谱仪流程示意（模块排布非真实光学几何）：空心阴极灯→雾化器→火焰原子化器→单色器→检测器→读数；蓝色线段为光路，它穿过火焰（真实仪器中光束只经火焰，雾化器侧向进料）。</desc>
