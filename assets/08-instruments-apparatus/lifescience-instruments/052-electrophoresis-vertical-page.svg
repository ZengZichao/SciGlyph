  <title id="t">垂直电泳槽（SDS-PAGE） / Vertical Electrophoresis Cell</title>
  <desc id="d">垂直板电泳槽：上槽电极与制胶夹、加样梳与样品孔、浓缩胶与分离胶界面、蛋白 Marker 泳道与样品条带、迁移方向箭头，用于 SDS-PAGE 与蛋白胶鉴定。</desc>
  <g id="body">
