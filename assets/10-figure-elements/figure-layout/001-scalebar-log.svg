<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-01_scalebar_log d-01_scalebar_log" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-01_scalebar_log">对数尺 / Log scale</title>
  <desc id="d-01_scalebar_log">对数(以10为底)比例尺(log scale)，数量级跨度大的数据常见。骨架，配合系统树使用。次刻度为装饰示意，未按 2–9 的对数间距精确定位。关键词: scalebar, log, log10</desc>
  <g id="layer-body" data-name="body">
    <line x1="10" y1="40" x2="90" y2="40" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="10" y1="35" x2="10" y2="45" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <line x1="30" y1="37" x2="30" y2="43" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <line x1="50" y1="35" x2="50" y2="45" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <line x1="70" y1="37" x2="70" y2="43" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <line x1="90" y1="35" x2="90" y2="45" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <text x="10" y="55" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">0.01</text>
    <text x="50" y="55" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">0.1</text>
    <text x="90" y="55" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">1</text>
    <text x="50" y="68" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">substitutions/site</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Log scale</text>
  </g>
</svg>