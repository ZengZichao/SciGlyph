<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-04_scalebar_ani d-04_scalebar_ani" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-04_scalebar_ani">ANI阈值尺 / ANI threshold</title>
  <desc id="d-04_scalebar_ani">ANI 95%/99% 阈值尺，蓝区=≥95% 同种判定区间。骨架，配合基因组比较使用。关键词: ANI, threshold, species</desc>
  <g id="layer-body" data-name="body">
    <rect x="10" y="34" width="80" height="12" rx="2" fill="#93A0AC" data-pp="muted" fill-opacity="0.2" />
    <rect x="70" y="34" width="20" height="12" rx="2" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.3" />
    <line x1="70" y1="30" x2="70" y2="50" stroke="#C42D2D" data-pp="alert" stroke-width="1.5" stroke-linecap="round" />
    <line x1="86" y1="32" x2="86" y2="48" stroke="#C42D2D" data-pp="alert" stroke-width="1" stroke-dasharray="2 1" stroke-linecap="round" />
    <text x="70.0" y="58.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="middle">95%</text>
    <text x="86" y="28" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#C42D2D" data-pp="alert" text-anchor="middle">99%</text>
    <text x="10" y="58" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">80%</text>
    <text x="94.0" y="58.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="end">100%</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">ANI threshold</text>
  </g>
</svg>