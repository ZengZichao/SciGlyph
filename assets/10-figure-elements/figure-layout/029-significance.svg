<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-29_significance d-29_significance" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-29_significance">显著性标记 / Significance</title>
  <desc id="d-29_significance">显著性标记: */**/***/ns 四级。骨架，配合统计图使用。关键词: significance, star, p-value</desc>
  <g id="layer-body" data-name="body">
    <text x="20" y="35" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">ns</text>
    <text x="40" y="35" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">*</text>
    <text x="60" y="35" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">**</text>
    <text x="80" y="35" font-size="10" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">***</text>
    <line x1="20" y1="39" x2="20" y2="49" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="20.03" y="55.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">p&gt;0.05</text>
    <line x1="40" y1="39" x2="40" y2="64" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="40" y="70.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">p&lt;0.05</text>
    <line x1="60" y1="39" x2="60" y2="49" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="60" y="55.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">p&lt;0.01</text>
    <line x1="80" y1="39" x2="80" y2="64" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="77.8" y="70.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">p&lt;0.001</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Significance</text>
