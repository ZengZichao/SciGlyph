  <g id="layer-body" data-name="body">
    <line x1="50" y1="20" x2="50" y2="70" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="42" y1="20" x2="58" y2="20" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="42" y1="70" x2="58" y2="70" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="50" cy="45" r="3" fill="#2E86AB" data-pp="bacteria"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Error bar I</text>
  </g>
