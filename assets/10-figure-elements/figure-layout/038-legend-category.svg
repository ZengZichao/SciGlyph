    <rect x="10" y="54" width="12" height="12" rx="2" fill="#00857A" data-pp="metabolism"/>
    <text x="28" y="64" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">Group C</text>
    <rect x="10" y="70" width="12" height="12" rx="2" fill="#E8871E" data-pp="mge"/>
