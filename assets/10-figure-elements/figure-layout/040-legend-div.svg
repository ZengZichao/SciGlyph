<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-40_legend_div d-40_legend_div" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-40_legend_div">连续色带(发散) / Diverging</title>
  <desc id="d-40_legend_div">发散连续色带。骨架，配合正负差异图使用。关键词: legend, diverging, gradient</desc>
  <g id="layer-body" data-name="body">
    <defs><linearGradient id="pp40__g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2E86AB" data-pp="bacteria"/><stop offset="50%" stop-color="#F4F1EA" data-pp="bg"/><stop offset="100%" stop-color="#C42D2D" data-pp="alert"/></linearGradient></defs>
    <rect x="10" y="35" width="80" height="14" rx="2" fill="url(#pp40__g)" stroke="#1B2733" data-pp="ink" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="10" y="62" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">−</text>
    <text x="50" y="62" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">0</text>
    <text x="90" y="62" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="end">+</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Diverging</text>
  </g>
</svg>