  <title id="t-41_legend_cyc">连续色带(循环) / Cyclic</title>
  <desc id="d-41_legend_cyc">循环连续色带。骨架，配合角度/周期数据使用。关键词: legend, cyclic, hue wheel</desc>
  <g id="layer-body" data-name="body">
    <defs><linearGradient id="pp41__g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2E86AB" data-pp="bacteria"/><stop offset="25%" stop-color="#6C3FA0" data-pp="gene"/><stop offset="50%" stop-color="#C42D2D" data-pp="alert"/><stop offset="75%" stop-color="#E8871E" data-pp="mge"/><stop offset="100%" stop-color="#2E86AB" data-pp="bacteria"/></linearGradient></defs>
    <rect x="10" y="35" width="80" height="14" rx="2" fill="url(#pp41__g)" stroke="#1B2733" data-pp="ink" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="62" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">0° → 360°</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Cyclic</text>
  </g>
