<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-44_legend_fillstroke d-44_legend_fillstroke" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-44_legend_fillstroke">填充vs描边 / Fill vs stroke</title>
  <desc id="d-44_legend_fillstroke">填充vs描边含义图例。骨架，配合分类图使用。关键词: legend, fill, stroke</desc>
  <g id="layer-body" data-name="body">
    <rect x="12" y="22" width="20" height="20" rx="3" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34.4" y="36.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">filled: present</text>
    <rect x="12" y="50" width="20" height="20" rx="3" fill="none" stroke="#2E86AB" data-pp="bacteria" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34.4" y="64.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">outline: absent</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Fill vs stroke</text>
  </g>
</svg>