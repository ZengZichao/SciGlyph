<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-45_legend_nodesize d-45_legend_nodesize" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-45_legend_nodesize">节点大小图例 / Node size</title>
  <desc id="d-45_legend_nodesize">节点大小-数值对应图例。骨架，配合气泡图/网络图使用。关键词: legend, node size, bubble</desc>
  <g id="layer-body" data-name="body">
    <circle cx="20" cy="45" r="6" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.4" stroke="#1B2733" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="45" r="12" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.4" stroke="#1B2733" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="72" cy="45" r="20" fill="#2E86AB" data-pp="bacteria" fill-opacity="0.4" stroke="#1B2733" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="70" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">10</text>
    <text x="42" y="70" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">50</text>
    <text x="72" y="70" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">100</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Node size</text>
  </g>
