<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-47_skel_hbar d-47_skel_hbar" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-47_skel_hbar">水平条形骨架 / H-bar skeleton</title>
  <desc id="d-47_skel_hbar">水平条形图空骨架，可填数据。虚线框为数据占位槽(无实际数值，长度仅为槽位形状)，填入数据后替换为实色条。关键词: skeleton, bar chart, horizontal</desc>
  <g id="layer-body" data-name="body">
    <line x1="25" y1="15" x2="25" y2="80" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="25" y1="80" x2="90" y2="80" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="26" y="20" width="46" height="10" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.8" stroke-dasharray="2,2" stroke-linejoin="round" data-name="bar-1-slot"/>
    <rect x="26" y="34" width="46" height="10" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.8" stroke-dasharray="2,2" stroke-linejoin="round" data-name="bar-2-slot"/>
    <rect x="26" y="48" width="46" height="10" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.8" stroke-dasharray="2,2" stroke-linejoin="round" data-name="bar-3-slot"/>
    <rect x="26" y="62" width="46" height="10" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.8" stroke-dasharray="2,2" stroke-linejoin="round" data-name="bar-4-slot"/>
    <text x="22" y="28" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end" data-name="label-1">A</text>
    <text x="22" y="42" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end" data-name="label-2">B</text>
    <text x="22" y="56" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end" data-name="label-3">C</text>
    <text x="22" y="70" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end" data-name="label-4">D</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">H-bar skeleton</text>
  </g>
</svg>