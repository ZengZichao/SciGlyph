<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-48_skel_vbar d-48_skel_vbar" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-48_skel_vbar">垂直条形骨架 / V-bar skeleton</title>
  <desc id="d-48_skel_vbar">垂直条形图空骨架，可填数据。虚线框为数据占位槽(无实际数值)，填入数据后替换为实色条。关键词: skeleton, bar chart, vertical</desc>
  <g id="layer-body" data-name="body">
    <line x1="15" y1="15" x2="15" y2="75" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="75" x2="90" y2="75" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="22" y="40" width="10" height="35" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.8" stroke-dasharray="2,2" stroke-linejoin="round" data-name="bar-1-slot"/>
    <rect x="38" y="40" width="10" height="35" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.8" stroke-dasharray="2,2" stroke-linejoin="round" data-name="bar-2-slot"/>
    <rect x="54" y="40" width="10" height="35" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.8" stroke-dasharray="2,2" stroke-linejoin="round" data-name="bar-3-slot"/>
    <rect x="70" y="40" width="10" height="35" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.8" stroke-dasharray="2,2" stroke-linejoin="round" data-name="bar-4-slot"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">V-bar skeleton</text>
  </g>
</svg>