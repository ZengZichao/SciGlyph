    <rect x="76" y="15" width="12" height="60" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-dasharray="2 1" stroke-linecap="round" stroke-linejoin="round" data-name="stack-4"/>
