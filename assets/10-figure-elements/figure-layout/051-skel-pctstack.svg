<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-51_skel_pctstack d-51_skel_pctstack" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-51_skel_pctstack">百分比堆积骨架 / Pct stacked</title>
  <desc id="d-51_skel_pctstack">百分比堆积条形图骨架(空骨架)。骨架，配合百分比组分使用。关键词: skeleton, percentage stacked, 100%</desc>
  <g id="layer-body" data-name="body">
    <line x1="15" y1="15" x2="15" y2="75" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round" />
    <line x1="15" y1="75" x2="90" y2="75" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round" />
    <rect x="22" y="20" width="12" height="55" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-dasharray="2 1" stroke-linecap="round" stroke-linejoin="round" data-name="pct-1" />
    <rect x="40" y="20" width="12" height="55" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-dasharray="2 1" stroke-linecap="round" stroke-linejoin="round" data-name="pct-2" />
    <rect x="58" y="20" width="12" height="55" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-dasharray="2 1" stroke-linecap="round" stroke-linejoin="round" data-name="pct-3" />
    <rect x="76" y="20" width="12" height="55" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-dasharray="2 1" stroke-linecap="round" stroke-linejoin="round" data-name="pct-4" />
    <text x="17.86" y="22.0" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end">100%</text>
    <text x="10" y="76" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end">0%</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Pct stacked</text>
  </g>
</svg>