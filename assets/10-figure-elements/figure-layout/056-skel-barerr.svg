<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-56_skel_barerr d-56_skel_barerr" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-56_skel_barerr">柱状图带误差棒 / Bar+error skeleton</title>
  <desc id="d-56_skel_barerr">柱状图带误差棒空骨架，可填数据。虚线框为数值占位槽，误差棒为示意(非实测)。关键词: skeleton, bar chart, error bar, mean</desc>
  <g id="layer-body" data-name="body">
    <line x1="15" y1="15" x2="15" y2="75" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="75" x2="90" y2="75" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="25" y="45" width="14" height="30" fill="none" stroke="#2E86AB" data-pp="bacteria" stroke-width="0.8" stroke-dasharray="2,2" stroke-linejoin="round" data-name="bar-1-slot"/>
    <line x1="32" y1="38" x2="32" y2="52" stroke="#1B2733" data-pp="ink" stroke-width="1" data-name="errbar-1"/>
    <line x1="29" y1="38" x2="35" y2="38" stroke="#1B2733" data-pp="ink" stroke-width="1" data-name="errbar-1-cap"/>
    <line x1="29" y1="52" x2="35" y2="52" stroke="#1B2733" data-pp="ink" stroke-width="1" data-name="errbar-1-cap2"/>
    <rect x="50" y="45" width="14" height="30" fill="none" stroke="#A2305B" data-pp="archaea" stroke-width="0.8" stroke-dasharray="2,2" stroke-linejoin="round" data-name="bar-2-slot"/>
    <line x1="57" y1="38" x2="57" y2="52" stroke="#1B2733" data-pp="ink" stroke-width="1" data-name="errbar-2"/>
    <line x1="54" y1="38" x2="60" y2="38" stroke="#1B2733" data-pp="ink" stroke-width="1" data-name="errbar-2-cap"/>
    <line x1="54" y1="52" x2="60" y2="52" stroke="#1B2733" data-pp="ink" stroke-width="1" data-name="errbar-2-cap2"/>
    <rect x="75" y="45" width="14" height="30" fill="none" stroke="#00857A" data-pp="metabolism" stroke-width="0.8" stroke-dasharray="2,2" stroke-linejoin="round" data-name="bar-3-slot"/>
    <line x1="82" y1="38" x2="82" y2="52" stroke="#1B2733" data-pp="ink" stroke-width="1" data-name="errbar-3"/>
    <line x1="79" y1="38" x2="85" y2="38" stroke="#1B2733" data-pp="ink" stroke-width="1" data-name="errbar-3-cap"/>
    <line x1="79" y1="52" x2="85" y2="52" stroke="#1B2733" data-pp="ink" stroke-width="1" data-name="errbar-3-cap2"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Bar+error skeleton</text>
  </g>
</svg>