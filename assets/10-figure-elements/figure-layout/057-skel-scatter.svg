<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-57_skel_scatter d-57_skel_scatter" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-57_skel_scatter">散点图带参考线 / Scatter+ref skeleton</title>
  <desc id="d-57_skel_scatter">散点图带对角参考线骨架(空骨架)。骨架，配合相关性展示使用。关键词: skeleton, scatter, diagonal, reference line</desc>
  <g id="layer-body" data-name="body">
    <line x1="15" y1="15" x2="15" y2="75" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="75" x2="90" y2="75" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="75" x2="90" y2="15" stroke="#93A0AC" data-pp="muted" stroke-width="1" stroke-dasharray="3 2" stroke-linecap="round" data-name="ref-line"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Scatter+ref skeleton</text>
  </g>
</svg>