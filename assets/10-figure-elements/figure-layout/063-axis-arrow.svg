<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-63_axis_arrow d-63_axis_arrow" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-63_axis_arrow">坐标轴(箭头) / Axis arrow</title>
  <desc id="d-63_axis_arrow">坐标轴骨架(带箭头)。骨架，配合通用图表使用。关键词: skeleton, axis, arrow</desc>
  <defs><marker id="pp63__m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L8,5 L0,9 z" fill="#1B2733" data-pp="ink"/></marker></defs>
  <g id="layer-body" data-name="body">
    <line x1="15" y1="80" x2="90" y2="80" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round" marker-end="url(#pp63__m)"/>
    <line x1="15" y1="80" x2="15" y2="10" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round" marker-end="url(#pp63__m)"/>
    <text x="90" y="90" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="end" data-name="x-label">x</text>
    <text x="8" y="14" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="start" data-name="y-label">y</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Axis arrow</text>
  </g>
</svg>