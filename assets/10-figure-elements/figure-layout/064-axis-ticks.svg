  <title id="t-64_axis_ticks">坐标轴(刻度) / Axis ticks</title>
  <desc id="d-64_axis_ticks">坐标轴骨架(带刻度)。骨架，配合通用图表使用。关键词: skeleton, axis, ticks</desc>
  <g id="layer-body" data-name="body">
    <line x1="15" y1="75" x2="90" y2="75" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="75" x2="15" y2="15" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="75" x2="30" y2="79" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round" data-name="tick-1"/>
    <line x1="50" y1="75" x2="50" y2="79" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round" data-name="tick-2"/>
    <line x1="70" y1="75" x2="70" y2="79" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round" data-name="tick-3"/>
    <line x1="15" y1="55" x2="11" y2="55" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round" data-name="ytick-1"/>
    <line x1="15" y1="35" x2="11" y2="35" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round" data-name="ytick-2"/>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Axis ticks</text>
  </g>
