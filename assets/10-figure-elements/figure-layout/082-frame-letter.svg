<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-82_frame_letter d-82_frame_letter" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-82_frame_letter">Letter版心框 / Letter frame</title>
  <desc id="d-82_frame_letter">Letter图版版心定位框。骨架，配合Letter论文图版使用。关键词: frame, Letter, US, layout</desc>
  <g id="layer-body" data-name="body">
    <rect x="5" y="5" width="90" height="70" rx="1" fill="none" stroke="#1B2733" data-pp="ink" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-name="page"/>
    <rect x="12" y="10" width="76" height="56" rx="0" fill="none" stroke="#93A0AC" data-pp="muted" stroke-width="0.5" stroke-dasharray="2 2" stroke-linecap="round" data-name="margin"/>
    <text x="50" y="82" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Letter (8.5×11in)</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Letter frame</text>
  </g>
</svg>