  <g id="layer-body" data-name="body">
    <line x1="10" y1="10" x2="10" y2="80" stroke="#C42D2D" data-pp="alert" stroke-width="0.5" stroke-dasharray="3 2" stroke-linecap="round" data-name="guide-v1"/>
    <line x1="50" y1="10" x2="50" y2="80" stroke="#C42D2D" data-pp="alert" stroke-width="0.5" stroke-dasharray="3 2" stroke-linecap="round" data-name="guide-v2"/>
    <line x1="90" y1="10" x2="90" y2="80" stroke="#C42D2D" data-pp="alert" stroke-width="0.5" stroke-dasharray="3 2" stroke-linecap="round" data-name="guide-v3"/>
    <line x1="10" y1="10" x2="90" y2="10" stroke="#C42D2D" data-pp="alert" stroke-width="0.5" stroke-dasharray="3 2" stroke-linecap="round" data-name="guide-h1"/>
    <line x1="10" y1="45" x2="90" y2="45" stroke="#C42D2D" data-pp="alert" stroke-width="0.5" stroke-dasharray="3 2" stroke-linecap="round" data-name="guide-h2"/>
    <line x1="10" y1="80" x2="90" y2="80" stroke="#C42D2D" data-pp="alert" stroke-width="0.5" stroke-dasharray="3 2" stroke-linecap="round" data-name="guide-h3"/>
    <rect x="20" y="20" width="25" height="15" fill="none" stroke="#2E86AB" data-pp="bacteria" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" data-name="obj-1"/>
    <rect x="55" y="50" width="25" height="15" fill="none" stroke="#A2305B" data-pp="archaea" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" data-name="obj-2"/>
