<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-figure-layout" role="img" aria-labelledby="t-85_spacing_ruler d-85_spacing_ruler" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-85_spacing_ruler">间距量度尺 / Spacing ruler</title>
  <desc id="d-85_spacing_ruler">间距量度尺(1/2/4 mm)。骨架，配合图版间距标注使用。关键词: spacing, ruler, mm, measurement</desc>
  <g id="layer-body" data-name="body">
    <line x1="10" y1="30" x2="90" y2="30" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <line x1="10" y1="25" x2="10" y2="35" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <line x1="30" y1="27" x2="30" y2="33" stroke="#1B2733" data-pp="ink" stroke-width="0.5" stroke-linecap="round"/>
    <line x1="50" y1="25" x2="50" y2="35" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <line x1="70" y1="27" x2="70" y2="33" stroke="#1B2733" data-pp="ink" stroke-width="0.5" stroke-linecap="round"/>
    <line x1="90" y1="25" x2="90" y2="35" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <text x="10" y="45" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">0</text>
    <text x="50" y="45" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">2mm</text>
    <text x="90" y="45" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">4mm</text>
    <line x1="10" y1="55" x2="90" y2="55" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <line x1="10" y1="50" x2="10" y2="60" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <line x1="30" y1="52" x2="30" y2="58" stroke="#1B2733" data-pp="ink" stroke-width="0.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="50" y2="60" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <line x1="70" y1="52" x2="70" y2="58" stroke="#1B2733" data-pp="ink" stroke-width="0.5" stroke-linecap="round"/>
    <line x1="90" y1="50" x2="90" y2="60" stroke="#1B2733" data-pp="ink" stroke-width="1" stroke-linecap="round"/>
    <text x="50" y="70" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">minor tick = 1 mm</text>
  </g>
  <g id="layer-annotation" data-name="annotation">
    <text x="50" y="96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#93A0AC" data-pp="muted" text-anchor="middle">Spacing ruler</text>
  </g>
</svg>