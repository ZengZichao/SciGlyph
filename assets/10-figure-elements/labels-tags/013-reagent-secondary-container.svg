<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="96" viewBox="0 0 160 96"
     role="img" aria-labelledby="t d"
     data-id="lb-reagent-secondary-container" data-cat="lb" data-spec="160"
     data-tags="reagent,secondary,container,solution,concentration,date,responsible,warning" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t">二次容器标签 / Secondary Container Label</title>
  <desc id="d">二次容器标签，溶液名+浓度+日期+责任人+有效期+警示条。</desc>
  <g id="body">
    <rect x="10" y="10" width="140" height="76" rx="3" ry="3" fill="#FFFFFF" stroke="#1F2933" stroke-linejoin="round" stroke-width="2.5" data-ls="fill" data-ls-stroke="stroke"/>
    <rect x="10" y="10" width="140" height="8" fill="#F5A623" stroke="none" data-ls="warn"/>
    <text x="16" y="28" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" data-ls="stroke">SOLUTION:</text>
    <line x1="16" y1="32" x2="144" y2="32" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <text x="16" y="44" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9" font-weight="600" data-ls="stroke">CONC:</text>
    <text x="80" y="44" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9" font-weight="600" data-ls="stroke">DATE:</text>
    <line x1="16" y1="48" x2="70" y2="48" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <line x1="80" y1="48" x2="144" y2="48" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <text x="16" y="58" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9" font-weight="600" data-ls="stroke">RESP:</text>
    <text x="80" y="58" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9" font-weight="600" data-ls="stroke">EXP:</text>
    <line x1="16" y1="62" x2="70" y2="62" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <line x1="80" y1="62" x2="144" y2="62" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <text x="16" y="76" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">⚠ HAZARD</text>
