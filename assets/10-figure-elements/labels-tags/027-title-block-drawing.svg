<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="96" viewBox="0 0 160 96"
     role="img" aria-labelledby="t d"
     data-id="lb-title-block-drawing" data-cat="lb" data-spec="160"
     data-tags="title,block,drawing,engineering,drawing-number,scale,date,signature" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t">工程图标题栏 / Title Block Drawing</title>
  <desc id="d">工程图标题栏，图号/名称/比例/日期/签名网格。</desc>
  <g id="body">
    <rect x="10" y="10" width="140" height="76" rx="2" ry="2" fill="#FFFFFF" stroke="#1F2933" stroke-linejoin="round" stroke-width="2.5" data-ls="fill" data-ls-stroke="stroke"/>
    <line x1="10" y1="28" x2="150" y2="28" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <line x1="10" y1="46" x2="150" y2="46" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <line x1="10" y1="64" x2="150" y2="64" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <line x1="80" y1="28" x2="80" y2="86" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <text x="16" y="22" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">DWG NO:</text>
    <text x="86" y="22" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">REV:</text>
    <text x="16" y="40" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">TITLE:</text>
    <text x="86" y="40" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">SCALE:</text>
    <text x="16" y="58" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">DATE:</text>
    <text x="86" y="58" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">DRAWN BY:</text>
    <text x="16" y="76" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">CHECKED:</text>
    <text x="86" y="76" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">APPROVED:</text>
  </g>
</svg>