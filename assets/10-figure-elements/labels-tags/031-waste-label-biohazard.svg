<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="96" viewBox="0 0 160 96"
     role="img" aria-labelledby="t d"
     data-id="lb-waste-label-biohazard" data-cat="lb" data-spec="160"
     data-tags="waste,label,biohazard,infectious,medical waste,biological,废液,生物" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t">生物废液标签 / Biohazard Waste Label</title>
  <desc id="d">生物危害废液标签版式：橙色警示条、生物危害三弧符号、类别/灭活方式/产生日期/责任人栏位与满刻度线，供高压灭活前后填写。</desc>
  <g id="body">
    <rect x="10" y="10" width="140" height="76" rx="3" ry="3" fill="#FFFFFF" stroke="#1F2933" stroke-linejoin="round" stroke-width="2.5" data-ls="fill" data-ls-stroke="stroke"/>
    <rect x="10" y="10" width="140" height="10" fill="#F5A623" stroke="none" data-ls="warn"/>
    <text x="80" y="18" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9" font-weight="600" text-anchor="middle" data-ls="stroke">BIOHAZARD WASTE</text>
  </g>
  <g id="detail">
    <g id="symbol" transform="translate(30 40)">
      <circle cx="0" cy="-8.5" r="6.5" fill="none" stroke="#33414F" stroke-width="2.5" data-ls="dark"/>
      <circle cx="-7.4" cy="4.3" r="6.5" fill="none" stroke="#33414F" stroke-width="2.5" data-ls="dark"/>
      <circle cx="7.4" cy="4.3" r="6.5" fill="none" stroke="#33414F" stroke-width="2.5" data-ls="dark"/>
      <circle cx="0" cy="0" r="3.2" fill="none" stroke="#33414F" stroke-width="2.5" data-ls="dark"/>
    </g>
    <text x="52" y="30" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">CATEGORY:</text>
    <line x1="98" y1="34" x2="144" y2="34" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <text x="52" y="43" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">INACTIVATION:</text>
    <line x1="112" y1="47" x2="144" y2="47" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <text x="52" y="56" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">BSL LEVEL:</text>
    <line x1="100" y1="60" x2="144" y2="60" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <text x="16" y="68" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">GENERATED BY:</text>
    <line x1="70" y1="72" x2="104" y2="72" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <text x="110" y="68" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="8" font-weight="600" data-ls="stroke">DATE:</text>
    <line x1="132" y1="72" x2="144" y2="72" fill="none" stroke="#5A6B7B" stroke-linecap="round" stroke-width="1.75" data-ls="thin"/>
    <line x1="16" y1="80" x2="104" y2="80" stroke="#E02020" stroke-dasharray="3,2" stroke-width="1.2" data-ls="danger"/>
    <text x="144" y="83" fill="#1F2933" font-family="Inter,Helvetica,Arial,sans-serif" font-size="7" font-weight="600" text-anchor="end" data-ls="stroke">MAX 3/4</text>
  </g>
</svg>
