<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-size_01nm_bp d-size_01nm_bp" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-size_01nm_bp">0.34nm碱基对间距 / 0.34nm base-pair rise (DNA)</title>
  <desc id="d-size_01nm_bp">尺度图标：DNA相邻碱基对沿螺旋轴的间距(rise)约0.34 nm；单个原子约0.1 nm。 Scale bar=0.34 nm，与图中碱基对中心距等长。假设放大倍率: ~×3×10^7 (1cm ≈ 0.34nm)。关键词: size scale, 0.34 nm, base pair rise, scale bar</desc>
  <g id="layer-body-size_01nm_bp" data-name="body">
    
    <rect x="25" y="20" width="20" height="3" rx="1" ry="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1" />
    <rect x="25" y="55" width="20" height="3" rx="1" ry="1" fill="#6C3FA0" data-pp="gene" stroke="#1B2733" stroke-width="1" />
    
    <line x1="32" y1="23" x2="32" y2="55" stroke="#1B2733" stroke-width="0.5" stroke-dasharray="0.5,0.5" />
    <line x1="38" y1="23" x2="38" y2="55" stroke="#1B2733" stroke-width="0.5" stroke-dasharray="0.5,0.5" />
    <text x="35" y="54.96" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">0.34 nm</text>
    <text x="35" y="62.04" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="start">rise/bp</text>
    
    <line x1="15" y1="82" x2="50" y2="82" stroke="#1B2733" stroke-width="1.5" />
    <line x1="15" y1="79" x2="15" y2="85" stroke="#1B2733" stroke-width="1" />
    <line x1="50" y1="79" x2="50" y2="85" stroke="#1B2733" stroke-width="1" />
    <text x="32" y="90" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">0.34 nm</text>
  </g>
