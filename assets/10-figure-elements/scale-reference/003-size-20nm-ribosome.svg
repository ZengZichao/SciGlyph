<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-size_20nm_ribosome d-size_20nm_ribosome" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-size_20nm_ribosome">20nm核糖体 / 20nm ribosome</title>
  <desc id="d-size_20nm_ribosome">尺度图标：20nm核糖体，大小约20 nm。细菌70S核糖体直径约20nm。 Scale bar=20 nm。假设放大倍率: ×5×10^4 (1cm = 200nm)。关键词: size scale, 20 nm, scale bar</desc>
  <g id="layer-body-size_20nm_ribosome" data-name="body">
    <!-- Ribosome (large + small subunit) -->
    <ellipse cx="40" cy="35" rx="14" ry="10" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1.5"/>
    <ellipse cx="40" cy="48" rx="10" ry="7" fill="#E8871E" data-pp="mge" stroke="#1B2733" stroke-width="1.5"/>
    <text x="40" y="37" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">50S</text>
    <text x="40" y="50" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#FFFFFF" data-pp="white" text-anchor="middle">30S</text>
    <text x="40" y="65" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">~20nm</text>
    <!-- Scale bar -->
    <line x1="15" y1="82" x2="43" y2="82" stroke="#1B2733" stroke-width="1.5"/>
    <line x1="15" y1="79" x2="15" y2="85" stroke="#1B2733" stroke-width="1"/>
    <line x1="43" y1="79" x2="43" y2="85" stroke="#1B2733" stroke-width="1"/>
    <text x="29" y="90" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">20 nm</text>
      <path d="M20,42 Q30,42 40,42 Q50,42 60,42" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="1"/>
    <circle cx="65" cy="35" r="2" fill="#6C3FA0" data-pp="gene"/>
    <circle cx="70" cy="42" r="1.5" fill="#6C3FA0" data-pp="gene"/>

  </g>
  <g id="layer-annotation-size_20nm_ribosome" data-name="annotation">
    <text x="70" y="15" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">20 nm</text>
    <line x1="70.0" y1="19.9" x2="60.44" y2="19.9" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="60.44" y="22.99" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">scale bar</text>
  </g>
</svg>