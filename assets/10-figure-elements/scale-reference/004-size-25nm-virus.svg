<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-size_25nm_virus d-size_25nm_virus" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-size_25nm_virus">25nm小病毒 / 25nm small virus</title>
  <desc id="d-size_25nm_virus">尺度图标：25nm小病毒，大小约25 nm。小病毒如parvovirus/φX174约25nm。 Scale bar=25 nm。假设放大倍率: ×4×10^4 (1cm = 250nm)。关键词: size scale, 25 nm, scale bar</desc>
  <g id="layer-body-size_25nm_virus" data-name="body">
    <!-- Small virus (parvovirus ~25nm) -->
    <polygon points="40,25 50,30 50,42 40,47 30,42 30,30" fill="#5B8C3E" data-pp="virus" stroke="#1B2733" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="40" y="38" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">T=1</text>
    <text x="40" y="58" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">~25nm</text>
    <!-- Scale bar -->
    <line x1="15" y1="82" x2="35" y2="82" stroke="#1B2733" stroke-width="1.5"/>
    <line x1="15" y1="79" x2="15" y2="85" stroke="#1B2733" stroke-width="1"/>
    <line x1="35" y1="79" x2="35" y2="85" stroke="#1B2733" stroke-width="1"/>
    <text x="25" y="90" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">25 nm</text>
      <circle cx="35" cy="28" r="1.5" fill="#5B8C3E" data-pp="virus"/>
    <circle cx="45" cy="28" r="1.5" fill="#5B8C3E" data-pp="virus"/>
    <circle cx="40" cy="48" r="1.5" fill="#5B8C3E" data-pp="virus"/>

  </g>
  <g id="layer-annotation-size_25nm_virus" data-name="annotation">
    <text x="70" y="15" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">25 nm</text>
    <line x1="70.0" y1="19.9" x2="60.44" y2="19.9" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="60.44" y="22.99" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">scale bar</text>
  </g>
</svg>