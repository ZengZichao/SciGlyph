  <title id="t-size_200nm_nanoarchaeum">0.2µm超小细胞 / 0.2µm ultra-small cell</title>
  <desc id="d-size_200nm_nanoarchaeum">尺度图标：超小细胞(ultra-small cell, DPANN类超小古菌/超小细菌)直径约0.2 µm，接近细胞生命的尺寸下限；注意 Nanoarchaeum equitans 实测约 0.4 µm，本图取的是 DPANN 超小细胞的 0.2 µm 量级。 Scale bar=200 nm。假设放大倍率: ×5×10^4 (1cm = 200nm)。关键词: size scale, 200 nm, ultra-small cell, scale bar</desc>
