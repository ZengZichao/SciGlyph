<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-size_02um_filter d-size_02um_filter" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-size_02um_filter">0.2µm滤膜孔径 / 0.2µm filter membrane pore</title>
  <desc id="d-size_02um_filter">尺度图标：0.2µm滤膜孔径(=图中孔径与标尺等长，示意)。0.2µm滤膜用于除菌过滤。 Scale bar=0.2 µm。假设放大倍率: ×5×10^3 (1cm = 2µm)。关键词: size scale, 0.2 µm, filter pore, scale bar</desc>
  <g id="layer-body-size_02um_filter" data-name="body">
    <!-- Filter membrane with pores -->
    <rect x="15" y="30" width="60" height="15" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="1.5"/>
    <!-- Pores -->
    <circle cx="25" cy="37.5" r="6" fill="#FFFFFF" data-pp="white" stroke="#1B2733" stroke-width="0.5"/>
    <circle cx="45" cy="37.5" r="6" fill="#FFFFFF" data-pp="white" stroke="#1B2733" stroke-width="0.5"/>
    <circle cx="65" cy="37.5" r="6" fill="#FFFFFF" data-pp="white" stroke="#1B2733" stroke-width="0.5"/>
    <!-- Bacteria blocked on top -->
    <text x="42" y="55" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">0.2µm pore</text>
    <!-- Scale bar -->
    <line x1="15" y1="82" x2="27" y2="82" stroke="#1B2733" stroke-width="1.5"/>
    <line x1="15" y1="79" x2="15" y2="85" stroke="#1B2733" stroke-width="1"/>
    <line x1="27" y1="79" x2="27" y2="85" stroke="#1B2733" stroke-width="1"/>
    <text x="21" y="90" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">0.2 µm</text>
  </g>
  <g id="layer-annotation-size_02um_filter" data-name="annotation">
    <text x="70" y="15" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">0.2 µm</text>
    <line x1="70.0" y1="19.9" x2="60.44" y2="19.9" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="60.44" y="22.99" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">scale bar</text>
  </g>
</svg>