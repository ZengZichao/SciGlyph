<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     class="pp-icon pp-microscopy-scale" role="img" aria-labelledby="t-size_200um_thiomargarita d-size_200um_thiomargarita" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-size_200um_thiomargarita">0.2mm Thiomargarita / 0.2mm Thiomargarita namibiensis</title>
  <desc id="d-size_200um_thiomargarita">尺度图标：0.2mm Thiomargarita，大小约0.2 mm。Thiomargarita namibiensis直径常约0.1-0.2mm(最大报道~0.75mm)，肉眼可见的最大细菌之一。含大液泡。 Scale bar=0.2 mm。假设放大倍率: ×20 (1cm = 500µm)。关键词: size scale, 0.2 mm, scale bar</desc>
  <g id="layer-body-size_200um_thiomargarita" data-name="body">
    <!-- Thiomargarita (giant bacterium ~200µm = 0.2mm) -->
    <circle cx="42" cy="40" r="25" fill="#2E86AB" data-pp="bacteria" stroke="#1B2733" stroke-width="1.5"/>
    <!-- Vacuole -->
    <circle cx="42" cy="40" r="18" fill="#F4F1EA" data-pp="bg" stroke="#1B2733" stroke-width="0.5"/>
    <!-- Sulfur granules -->
    <circle cx="30" cy="30" r="2" fill="#E8871E" data-pp="mge"/>
    <circle cx="50" cy="28" r="2" fill="#E8871E" data-pp="mge"/>
    <circle cx="35" cy="55" r="2" fill="#E8871E" data-pp="mge"/>
    <circle cx="55" cy="50" r="2" fill="#E8871E" data-pp="mge"/>
    <!-- Nucleoid at periphery -->
    <path d="M25,45 Q28,42 32,45" fill="none" stroke="#6C3FA0" data-pp="gene" stroke-width="1"/>
    <text x="42" y="72" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">~0.2mm visible!</text>
    <!-- Scale bar -->
    <line x1="15" y1="82" x2="65" y2="82" stroke="#1B2733" stroke-width="1.5"/>
    <line x1="15" y1="79" x2="15" y2="85" stroke="#1B2733" stroke-width="1"/>
    <line x1="65" y1="79" x2="65" y2="85" stroke="#1B2733" stroke-width="1"/>
    <text x="40" y="90" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink" text-anchor="middle">0.2 mm</text>
  </g>
  <g id="layer-annotation-size_200um_thiomargarita" data-name="annotation">
    <text x="70" y="15" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">0.2 mm</text>
    <line x1="70.0" y1="19.9" x2="60.44" y2="19.9" stroke="#5A6B7B" stroke-width="0.5" stroke-dasharray="1.5,1.2"/><text x="60.44" y="22.99" font-size="7" font-family="Inter,Helvetica,Arial,sans-serif" fill="#1B2733" data-pp="ink">scale bar</text>
  </g>
</svg>