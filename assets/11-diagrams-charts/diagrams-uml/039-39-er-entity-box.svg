<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" role="img" data-name-zh="ER实体框" data-name-en="Er Entity Box" data-cat="diagrams-sw-uml" aria-labelledby="t-39 d-39" data-license="CC-BY-4.0" data-copyright="ZengZichao">
  <title id="t-39">ER实体框 / Er Entity Box</title>
  <desc id="d-39">ER实体框：实体名栏+属性栏，属性带 PK/FK 键标记（无方法栏，区别于一栏/三栏 UML 类框）。关键词: entity,er,attribute</desc>
  <g id="g-39-ER实体三栏">
    <rect x="10" y="15" width="140" height="30" fill="#0072B2" stroke="#1f2937" stroke-width="1.5" data-drole="series-1"/>
    <text x="80" y="35" fill="#ffffff" font-family="Inter,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" font-weight="bold">User</text>
    <rect x="10" y="45" width="140" height="60" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="18" y="63" fill="#1f2937" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9" text-anchor="start">PK user_id: INT</text>
    <text x="18" y="80" fill="#1f2937" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9" text-anchor="start">name: VARCHAR</text>
    <text x="18" y="97" fill="#1f2937" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9" text-anchor="start">FK dept_id: INT</text>
  </g>
</svg>
